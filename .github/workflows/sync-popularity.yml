name: Sync TMDB Popularity

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync popularity
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        with:
          script: |
            const SU = process.env.SUPABASE_URL;
            const SK = process.env.SUPABASE_KEY;
            const TK = process.env.TMDB_KEY;

            // Test sur 1 seul film pour voir l'erreur exacte
            const r = await fetch(`${SU}/rest/v1/movies?select=id,data&limit=1`, {
              headers: { apikey: SK, Authorization: `Bearer ${SK}` }
            });
            const rows = await r.json();
            const row = rows[0];
            const m = row.data;
            
            console.log(`Film: ${m.title}, row.id: ${row.id}`);
            console.log(`tmdb_id: ${m.tmdb_id}, media_type: ${m.media_type}`);

            // Fetch TMDB
            const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${m.tmdb_id}?api_key=${TK}`);
            const td = await tmdbRes.json();
            console.log(`TMDB popularity: ${td.popularity}`);

            // Construire newData sans _id
            const newData = Object.fromEntries(Object.entries(m).filter(([k]) => k !== '_id'));
            newData.popularity = td.popularity;
            newData.vote_average = td.vote_average;
            
            console.log(`Sending PATCH to: ${SU}/rest/v1/movies?id=eq.${row.id}`);
            console.log(`newData has _id: ${'_id' in newData}`);

            const pr = await fetch(`${SU}/rest/v1/movies?id=eq.${row.id}`, {
              method: 'PATCH',
              headers: {
                apikey: SK,
                Authorization: `Bearer ${SK}`,
                'Content-Type': 'application/json',
                Prefer: 'return=representation'
              },
              body: JSON.stringify({ data: newData })
            });
            
            console.log(`PATCH status: ${pr.status}`);
            const responseText = await pr.text();
            console.log(`PATCH response: ${responseText.slice(0, 500)}`);
