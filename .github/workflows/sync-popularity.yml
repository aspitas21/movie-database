name: Sync TMDB Popularity

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync popularity
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        with:
          script: |
            const SU = process.env.SUPABASE_URL;
            const SK = process.env.SUPABASE_KEY;
            const TK = process.env.TMDB_KEY;
            const H  = { apikey: SK, Authorization: `Bearer ${SK}` };

            const r = await fetch(`${SU}/rest/v1/movies?select=id,data&limit=3`, { headers: H });
            const rows = await r.json();
            
            for (const row of rows) {
              const m = row.data;
              console.log(`row.id=${row.id}`);
              console.log(`typeof m = ${typeof m}`);
              console.log(`m is null: ${m === null}`);
              if (m) {
                console.log(`m.tmdb_id = ${m.tmdb_id}`);
                console.log(`typeof m.tmdb_id = ${typeof m.tmdb_id}`);
                console.log(`keys: ${Object.keys(m).slice(0,8).join(', ')}`);
              }
              console.log('---');
            }
