name: Sync TMDB Popularity

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync popularity
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        with:
          script: |
            const SU = process.env.SUPABASE_URL;
            const SK = process.env.SUPABASE_KEY;
            const TK = process.env.TMDB_KEY;

            async function fetchAll() {
              let all = [], offset = 0;
              while (true) {
                const r = await fetch(`${SU}/rest/v1/movies?select=id,data&limit=1000&offset=${offset}`, {
                  headers: { apikey: SK, Authorization: `Bearer ${SK}` }
                });
                const page = await r.json();
                if (!Array.isArray(page) || !page.length) break;
                all = all.concat(page);
                if (page.length < 1000) break;
                offset += 1000;
              }
              return all;
            }

            const rows = await fetchAll();
            console.log(`Found ${rows.length} films`);

            let updated = 0, errors = 0, skipped = 0;

            for (let i = 0; i < rows.length; i++) {
              const row = rows[i];
              const m = row.data;
              if (!m || !m.tmdb_id) { skipped++; continue; }
              const type = m.media_type === 'tv' ? 'tv' : 'movie';
              if (type !== 'movie' && type !== 'tv') { skipped++; continue; }

              try {
                const url = `https://api.themoviedb.org/3/${type}/${m.tmdb_id}?api_key=${TK}`;
                const tr = await fetch(url);
                if (!tr.ok) { errors++; continue; }
                const td = await tr.json();

                if (!td || td.success === false) { errors++; continue; }

                const newPop = td.popularity;
                const newVote = td.vote_average;

                if (newPop === undefined) { skipped++; continue; }

                const updated_data = {
                  ...m,
                  popularity: newPop,
                  vote_average: newVote !== undefined ? newVote : (m.vote_average || 0)
                };

                const pr = await fetch(`${SU}/rest/v1/movies?id=eq.${row.id}`, {
                  method: 'PATCH',
                  headers: {
                    apikey: SK,
                    Authorization: `Bearer ${SK}`,
                    'Content-Type': 'application/json',
                    Prefer: 'return=minimal'
                  },
                  body: JSON.stringify({ data: updated_data })
                });

                if (pr.ok) {
                  updated++;
                  if (updated <= 5) console.log(`✓ ${m.title}: pop=${newPop}`);
                } else {
                  const err = await pr.text();
                  console.log(`✗ ${m.title}: ${err}`);
                  errors++;
                }
              } catch(e) {
                errors++;
                console.log(`Error: ${m.title}: ${e.message}`);
              }

              if (i % 50 === 0 && i > 0) {
                console.log(`${i}/${rows.length} — updated: ${updated}, errors: ${errors}`);
                await new Promise(r => setTimeout(r, 1200));
              }
            }

            console.log(`Done! Updated: ${updated}, Skipped: ${skipped}, Errors: ${errors}`);
