name: Sync TMDB Popularity

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync popularity
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        with:
          script: |
            const SU = process.env.SUPABASE_URL;
            const SK = process.env.SUPABASE_KEY;
            const TK = process.env.TMDB_KEY;

            // Récupérer tous les films
            async function fetchAll() {
              let all = [], offset = 0;
              while (true) {
                const r = await fetch(`${SU}/rest/v1/movies?select=id,data&limit=1000&offset=${offset}`, {
                  headers: { apikey: SK, Authorization: `Bearer ${SK}` }
                });
                const page = await r.json();
                if (!Array.isArray(page) || !page.length) break;
                all = all.concat(page);
                if (page.length < 1000) break;
                offset += 1000;
              }
              return all;
            }

            const rows = await fetchAll();
            console.log(`Found ${rows.length} films`);

            // Test sur 1 film pour vérifier le format
            const testRow = rows.find(r => r.data && r.data.tmdb_id && r.data.media_type === 'movie');
            if (testRow) {
              console.log(`Test film: ${testRow.data.title}, id=${testRow.id}`);
              console.log(`Data keys: ${Object.keys(testRow.data).join(', ')}`);
              
              // Test PATCH
              const testData = { ...testRow.data };
              delete testData._id;
              testData.popularity = testRow.data.popularity || 0;
              
              const testPatch = await fetch(`${SU}/rest/v1/movies?id=eq.${testRow.id}`, {
                method: 'PATCH',
                headers: {
                  apikey: SK,
                  Authorization: `Bearer ${SK}`,
                  'Content-Type': 'application/json',
                  Prefer: 'return=minimal'
                },
                body: JSON.stringify({ data: testData })
              });
              console.log(`Test PATCH status: ${testPatch.status}`);
              if (!testPatch.ok) {
                const errText = await testPatch.text();
                console.log(`Test PATCH error: ${errText}`);
              }
            }

            let updated = 0, errors = 0, skipped = 0;

            for (let i = 0; i < rows.length; i++) {
              const row = rows[i];
              const m = row.data;
              if (!m || !m.tmdb_id || (m.media_type !== 'movie' && m.media_type !== 'tv')) {
                skipped++;
                continue;
              }

              try {
                const type = m.media_type === 'tv' ? 'tv' : 'movie';
                const tr = await fetch(`https://api.themoviedb.org/3/${type}/${m.tmdb_id}?api_key=${TK}`);
                if (!tr.ok) { errors++; continue; }
                const td = await tr.json();
                if (!td || td.success === false || td.popularity === undefined) { skipped++; continue; }

                // Construire le nouvel objet data SANS _id
                const newData = { ...m };
                delete newData._id;
                newData.popularity = td.popularity;
                newData.vote_average = td.vote_average !== undefined ? td.vote_average : (m.vote_average || 0);

                const pr = await fetch(`${SU}/rest/v1/movies?id=eq.${row.id}`, {
                  method: 'PATCH',
                  headers: {
                    apikey: SK,
                    Authorization: `Bearer ${SK}`,
                    'Content-Type': 'application/json',
                    Prefer: 'return=minimal'
                  },
                  body: JSON.stringify({ data: newData })
                });

                if (pr.ok) {
                  updated++;
                  if (updated <= 3) console.log(`✓ ${m.title}: ${td.popularity}`);
                } else {
                  if (errors === 0) {
                    const errText = await pr.text();
                    console.log(`First error on ${m.title}: ${errText}`);
                  }
                  errors++;
                }
              } catch(e) {
                if (errors === 0) console.log(`Exception: ${e.message}`);
                errors++;
              }

              if (i % 50 === 0 && i > 0) {
                console.log(`${i}/${rows.length} — updated: ${updated}, errors: ${errors}`);
                await new Promise(r => setTimeout(r, 1000));
              }
            }

            console.log(`Done! Updated: ${updated}, Skipped: ${skipped}, Errors: ${errors}`);
