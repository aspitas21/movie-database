<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>CINEMA ARCHIVE — Médiathèque</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #08070b;
  --s1: #0f0e14;
  --s2: #18161f;
  --s3: #221f2c;
  --border: rgba(220, 180, 80, 0.12);
  --border-gold: rgba(212, 175, 55, 0.35);
  --text: #f5efeb;
  --muted: #9e8d7c;
  --muted2: #b8a99a;
  --accent-gold: #e4b363;
  --accent-red: #c23b22;
  --card-w: 170px;
  --cinema-grad: linear-gradient(145deg, #0b0a10 0%, #121019 100%);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.03) 2%, transparent 3%),
                    repeating-linear-gradient(45deg, rgba(100, 70, 40, 0.02) 0px, rgba(100, 70, 40, 0.02) 2px, transparent 2px, transparent 8px);
  pointer-events: none;
  z-index: 0;
}

header {
  padding: 0 2rem;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: rgba(8, 7, 11, 0.86);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 60;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 34px;
  height: 34px;
  background: radial-gradient(circle at 30% 20%, #e4b363, #9e2a1f);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 0 12px rgba(228, 179, 99, 0.5);
}

.logo-name {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.2px;
  background: linear-gradient(135deg, #f5e6d3, #e4b363);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.search-wrap {
  flex: 1;
  max-width: 460px;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 10px 16px 10px 38px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid var(--border-gold);
  border-radius: 60px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  transition: 0.2s;
}
.search-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px rgba(228, 179, 99, 0.2); background: #111017; outline: none; }

.btn-rnd {
  background: rgba(228, 179, 99, 0.1);
  border: 1px solid var(--border-gold);
  border-radius: 32px;
  padding: 7px 15px;
  color: var(--accent-gold);
  font-weight: 700;
  font-size: 11px;
  cursor: pointer;
  transition: 0.2s;
}
.btn-rnd:hover { background: rgba(228, 179, 99, 0.25); transform: translateY(-1px); }

.btn-add {
  background: linear-gradient(135deg, #9e2a1f, #c23b22);
  border: none;
  padding: 7px 18px;
  border-radius: 32px;
  color: white;
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(194, 59, 34, 0.4);
  cursor: pointer;
}

.count {
  background: #1e1a24;
  border-radius: 40px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--border);
}

.bar {
  padding: 0 2rem;
  background: rgba(10, 9, 14, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: thin;
  position: sticky;
  top: 68px;
  z-index: 50;
  min-height: 48px;
}

.chip {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted2);
  cursor: pointer;
  white-space: nowrap;
  transition: 0.15s;
}
.chip.active { background: var(--accent-gold); color: #0a0812; border-color: var(--accent-gold); font-weight: 800; }

.bsel {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted2);
  cursor: pointer;
}

.genre-bar {
  display: flex;
  gap: 8px;
  padding: 8px 2rem;
  background: rgba(0, 0, 0, 0.35);
  border-bottom: 1px solid rgba(212, 175, 55, 0.1);
  overflow-x: auto;
  scrollbar-width: thin;
}
.gchip {
  background: rgba(30, 25, 40, 0.8);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 4px 12px;
  font-size: 10px;
  font-weight: 600;
  color: #d4c5b5;
  cursor: pointer;
}
.gchip.inc { background: rgba(212, 175, 55, 0.2); border-color: var(--accent-gold); color: var(--accent-gold); }
.gchip.exc { background: rgba(194, 59, 34, 0.2); border-color: #c23b22; color: #ff8360; text-decoration: line-through; }

.content {
  padding: 1.8rem 2rem 3rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
  gap: 18px;
}

.card {
  background: var(--cinema-grad);
  border-radius: 16px;
  border: 1px solid var(--border);
  overflow: hidden;
  transition: transform 0.25s ease, box-shadow 0.3s;
  cursor: pointer;
  position: relative;
}
.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 25px 35px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(228,179,99,0.3);
}
.poster-wrap {
  position: relative;
  aspect-ratio: 2/3;
  overflow: hidden;
}
.cposter {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.35s;
}
.card:hover .cposter { transform: scale(1.05); }
.crating {
  position: absolute;
  top: 8px;
  left: 8px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 9px;
  font-weight: 800;
  color: #f5b642;
}
.cbody {
  padding: 10px 9px 12px;
}
.ctitle {
  font-weight: 800;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qbadge {
  display: inline-block;
  font-size: 12px;
  background: rgba(0,0,0,0.5);
  border-radius: 6px;
  padding: 2px 6px;
}
.detail-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.7);
  border: none;
  border-radius: 30px;
  width: 28px;
  height: 28px;
  color: var(--accent-gold);
  font-weight: bold;
  cursor: pointer;
  opacity: 0;
  transition: 0.15s;
}
.card:hover .detail-btn { opacity: 1; }

.modal {
  background: #12101c;
  border: 1px solid var(--border-gold);
  border-radius: 28px;
  box-shadow: 0 30px 50px rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
}
.mtitle {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.3px;
  background: linear-gradient(135deg,#f5e6d3, #e4b363);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.btnc, .btns, .btnd {
  font-weight: 700;
  transition: 0.2s;
  padding: 8px 16px;
  border-radius: 40px;
  cursor: pointer;
}
.btns {
  background: linear-gradient(95deg, #c23b22, #9e2a1f);
  border: none;
  color: white;
}
.btnc {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted2);
}
.btnd {
  background: transparent;
  border: 1px solid rgba(194,59,34,0.4);
  color: #f87171;
}

.filmography-list {
  margin-top: 16px;
  border-top: 1px dashed var(--border-gold);
  padding-top: 12px;
}
.filmography-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--accent-gold);
  letter-spacing: 1px;
}
.filmocheck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
  margin: 8px 0;
}
.filmocheck-item {
  background: var(--s2);
  border-radius: 12px;
  padding: 6px 6px 4px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.1s;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.filmocheck-item.selected {
  border-color: var(--accent-gold);
  background: rgba(228,179,99,0.12);
}
.filmocheck-item img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 8px;
}
.filmocheck-title {
  font-size: 9px;
  font-weight: 700;
  margin-top: 5px;
  color: #ddd;
}
.btn-filmography {
  background: rgba(228,179,99,0.12);
  border: 1px solid var(--border-gold);
  border-radius: 30px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  color: var(--accent-gold);
  margin-top: 8px;
  cursor: pointer;
  transition: 0.15s;
}

.change-poster-btn {
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--border-gold);
  padding: 5px 12px;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 700;
  color: #f0cf9a;
  cursor: pointer;
  margin-top: 5px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.poster-picker-grid {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin: 10px 0;
  padding-bottom: 8px;
}
.poster-thumb {
  width: 55px;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: 0.1s;
}
.poster-thumb.selected { border-color: var(--accent-gold); transform: scale(0.98); }

.posters {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 10px;
}
.poster-option {
  cursor: pointer;
  text-align: center;
  width: 80px;
}
.poster-option img {
  width: 100%;
  border-radius: 8px;
  border: 2px solid transparent;
  transition: 0.1s;
}
.poster-option.selected img { border-color: var(--accent-gold); }

.link-row {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.link-row input {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 40px;
  padding: 8px 12px;
  color: white;
  font-size: 12px;
}

@media (max-width: 700px) {
  header { flex-wrap: wrap; padding: 0.8rem; height: auto; gap: 8px; }
  .search-wrap { order: 3; max-width: 100%; width: 100%; }
  .bar { top: auto; position: relative; }
  .content { padding: 1rem; }
  .grid { gap: 12px; }
}
</style>
</head>
<body>

<div id="ls" class="loading" style="display:flex; position:fixed; inset:0; background:#08070b; z-index:999; align-items:center; justify-content:center; gap:12px; flex-direction:column;">
  <div style="font-size:28px; font-weight:900;">🎞️ CINEMA<span style="color:#e4b363;">ARCHIVE</span></div>
  <div style="width:160px; height:2px; background:#2a2533; border-radius:2px;"><div style="width:40%; height:100%; background:#e4b363; animation: loadingBar 1s infinite;"></div></div>
</div>

<header>
  <div class="logo"><div class="logo-mark">🎬</div><div class="logo-name">CINEMA<span>ARCHIVE</span></div></div>
  <div class="search-wrap"><span style="position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#aa9a88;">🔍</span><input class="search-input" id="sb" placeholder="Rechercher film, série, collection..." oninput="render()"></div>
  <div class="hdr-right" style="display:flex; gap:8px; align-items:center;"><div class="sync"><div class="sdot" id="sdot"></div><span id="slbl" style="font-size:11px;">sync</span></div><span class="count" id="tc">0</span><button class="btn-rnd" onclick="openRandom()">🎲 Surprise</button><button class="btn-add" onclick="openModal()">+ Ajouter</button></div>
</header>

<div class="bar" id="filterBar">
  <button class="chip active" data-q="" onclick="setFilter('',this)">Tous <span id="cnt-all"></span></button>
  <button class="chip" data-q="4kr" onclick="setFilter('4kr',this)">💎 4K Remux <span id="cnt-4kr"></span></button>
  <button class="chip" data-q="4kl" onclick="setFilter('4kl',this)">✨ 4K Light <span id="cnt-4kl"></span></button>
  <button class="chip" data-q="1r" onclick="setFilter('1r',this)">🍀 1080p Remux <span id="cnt-1r"></span></button>
  <button class="chip" data-q="1l" onclick="setFilter('1l',this)">🎬 1080p Light <span id="cnt-1l"></span></button>
  <button class="chip" id="filter-movie" onclick="setMediaFilter('movie')">🎬 Films <span id="cnt-movie"></span></button>
  <button class="chip" id="filter-tv" onclick="setMediaFilter('tv')">📺 Séries <span id="cnt-tv"></span></button>
  <button class="chip" id="filter-col" onclick="setMediaFilter('collection')">🎞 Collections <span id="cnt-col"></span></button>
  <button class="chip" id="filter-saga" onclick="setMediaFilter('saga')">⚡ Sagas <span id="cnt-saga"></span></button>
  <select class="bsel" id="sort-sel" onchange="setSort(this.value)"><option value="added">📅 Date ajout</option><option value="alpha">🔤 A-Z</option><option value="date">🗓 Année</option><option value="pop" selected>🔥 Popularité</option><option value="note">⭐ Note</option></select>
  <button class="bsel" id="sort-dir-btn" onclick="toggleSortDir()" style="cursor:pointer;">↓</button>
</div>
<div class="genre-bar" id="genre-bar"></div>
<div class="content" id="ct"></div>
<footer style="padding:1rem 2rem; border-top:1px solid var(--border); display:flex; gap:8px; flex-wrap:wrap;">
  <button class="btnc" onclick="exportData()">⬇ Export JSON</button>
  <button class="btnc" onclick="document.getElementById('iinp').click()">⬆ Import JSON</button>
  <input type="file" id="iinp" accept=".json" style="display:none" onchange="importData(event)">
  <button class="btnc" style="color:#e4b363; border-color:#e4b36340;" onclick="exportLetterboxd()">🎞 Letterboxd CSV</button>
</footer>

<!-- MODAL ADD/EDIT -->
<div class="mbg" id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(12px); z-index:200; align-items:center; justify-content:center;"><div class="modal" style="width:550px; max-width:95vw; background:#11101c; border-radius:28px; padding:1.6rem;"><div class="mtitle" id="mtitle">Ajouter un film</div>
<div class="field" style="margin-bottom:12px;"><label style="font-size:10px; color:#b8a99a;">Type</label><div style="display:flex; gap:8px; margin-top:4px;"><button class="type-btn" id="type-movie" onclick="setType('movie')">🎬 Film</button><button class="type-btn" id="type-tv" onclick="setType('tv')">📺 Série</button><button class="type-btn" id="type-collection" onclick="setType('collection')">🎞 Collection (Acteur/Réal)</button><button class="type-btn" id="type-saga" onclick="setType('saga')">⚡ Saga</button></div></div>
<div class="field" style="margin-bottom:12px;"><label id="search-label" style="font-size:10px; color:#b8a99a;">Titre / Personne</label><div class="srow" style="display:flex; gap:8px; margin-top:4px;"><input type="text" id="ititle" placeholder="ex: Christopher Nolan" style="flex:1; background:#18161f; border:1px solid #2a2533; border-radius:40px; padding:10px 15px; color:white;"/><button class="sbtn" onclick="searchPosters()" style="background:#2a2533; border:none; border-radius:40px; padding:0 16px; color:#e4b363; cursor:pointer;">🔍</button></div><div class="status" id="status" style="font-size:11px; margin-top:4px; color:#aa9a88;"></div><div id="posters" class="posters"></div><div id="gprev" style="margin-top:6px;"></div></div>
<div id="poster-changer-area" style="margin: 6px 0 0 0;"></div>
<div class="field" style="margin-bottom:12px;"><label style="font-size:10px; color:#b8a99a;">Liens (streaming, bande-annonce...)</label><div id="links-container"><div class="link-row"><input class="link-input" placeholder="Nom du lien" style="flex:1"/><input class="link-url" placeholder="https://" style="flex:2"/><button onclick="removeLinkRow(this)" style="background:transparent; border:1px solid #c23b22; border-radius:20px; color:#f87171; cursor:pointer;">✕</button></div></div><button onclick="addLinkRow()" style="margin-top:4px; background:transparent; border:1px dashed var(--border-gold); border-radius:40px; padding:5px 12px; color:#e4b363; cursor:pointer;">+ Ajouter lien</button></div>
<div class="field" style="margin-bottom:12px;"><label style="font-size:10px; color:#b8a99a;">Qualité</label><select id="iqual" style="width:100%; background:#18161f; border:1px solid #2a2533; border-radius:40px; padding:8px 12px; color:white; margin-top:4px;"><option value="4kr">💎 4K Remux</option><option value="4kl">✨ 4K Light</option><option value="1r">🍀 1080p Remux</option><option value="1l" selected>🎬 1080p Light</option></select></div>
<div id="filmography-collection-section" style="display:none;"></div>
<div class="mact" style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;"><button class="btnc" onclick="closeModal()">Annuler</button><button class="btns" onclick="saveMovie()">Sauvegarder</button></div></div></div>

<!-- DETAIL MODAL -->
<div class="mbg" id="dmod" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(12px); z-index:200; align-items:center; justify-content:center;"><div class="modal dmod" id="dcont" style="width:550px; max-width:95vw; background:#11101c; border-radius:28px; padding:1.6rem;"></div></div>
<!-- RANDOM MODAL -->
<div class="mbg" id="rmod" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(12px); z-index:200; align-items:center; justify-content:center;"><div class="modal rmod" id="rcont" style="text-align:center; background:#11101c; border-radius:28px; padding:1.6rem;"></div></div>

<script>
const SU='https://dnzrpvyeiyxplrcomsuo.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuenJwdnllaXl4cGxyY29tc3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzYwNTAsImV4cCI6MjA5NTExMjA1MH0.BwuZBjZXQcJlNsaQ_DYSj_n-IbMZswsgL_VuGOVMVs4';
const TK='4dc76b66e8b41dd652e56c6cc3a425ab';
const H={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
let movies=[], selPoster='', srt='pop', genreInc=new Set(), genreExc=new Set(), editIdx=-1, mediaType='movie', mediaFilt='', sortDir=1, currentTmdbId=null, currentPersonId=null, filmographyCache=[], filmographySelected=new Set();

async function load(){
  try{ const r=await fetch(`${SU}/rest/v1/movies?select=*&order=created_at.asc`,{headers:H});
    if(!r.ok) throw new Error();
    movies=(await r.json()).map(row=>({...row.data,_id:row.id}));
    document.getElementById('ls').style.display='none'; render();
  }catch(e){document.getElementById('ls').style.display='none'; render();}
}
async function addM(m){ const r=await fetch(`${SU}/rest/v1/movies`,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({data:m})});
  if(r.ok) movies.push((await r.json())[0].data); render();}
async function updM(idx,m){ const id=movies[idx]._id; await fetch(`${SU}/rest/v1/movies?id=eq.${id}`,{method:'PATCH',headers:{...H},body:JSON.stringify({data:m})}); movies[idx]=m; render();}
async function delM(idx){ const id=movies[idx]._id; await fetch(`${SU}/rest/v1/movies?id=eq.${id}`,{method:'DELETE',headers:H}); movies.splice(idx,1); render(); closeModal();}
let filts=new Set();

function setFilter(f,btn){ if(f===''){ filts.clear(); document.querySelectorAll('.chip[data-q]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); } else { document.querySelector('.chip[data-q=""]').classList.remove('active'); if(filts.has(f))filts.delete(f); else filts.add(f); btn.classList.toggle('active'); } render(); }
function setMediaFilter(t){ mediaFilt=(mediaFilt===t?'':t); render(); }
function setSort(s){ srt=s; render(); }
function toggleSortDir(){ sortDir*=-1; document.getElementById('sort-dir-btn').textContent=sortDir===1?'↓':'↑'; render(); }
function toggleGenre(g){ if(genreInc.has(g)){ genreInc.delete(g); genreExc.add(g); } else if(genreExc.has(g)) genreExc.delete(g); else genreInc.add(g); render(); }
function clearGenres(){ genreInc.clear(); genreExc.clear(); render(); }

function render(){
  let list=movies.filter(m=>!filts.size||filts.has(m.quality)).filter(m=>!mediaFilt||(m.media_type||'movie')===mediaFilt);
  if(genreInc.size) list=list.filter(m=>[...genreInc].every(g=>(m.tags||[]).includes(g)));
  if(genreExc.size) list=list.filter(m=>[...genreExc].every(g=>!(m.tags||[]).includes(g)));
  const q=document.getElementById('sb').value.toLowerCase().trim();
  if(q) list=list.filter(m=>m.title.toLowerCase().includes(q));
  list.sort((a,b)=>{ let v=0; if(srt==='alpha') v=a.title.localeCompare(b.title); else if(srt==='date') v=(b.release_date||'').localeCompare(a.release_date||''); else if(srt==='pop') v=(b.popularity||0)-(a.popularity||0); else if(srt==='note') v=(b.vote_average||0)-(a.vote_average||0); else v=0; return sortDir*v; });
  document.getElementById('tc').textContent=list.length;
  const ct=document.getElementById('ct'); ct.innerHTML='';
  if(!list.length){ ct.innerHTML='<div class="empty" style="text-align:center; padding:3rem;"><div style="font-size:48px;">🎞️</div><div>Aucun résultat</div></div>'; return; }
  const grid=document.createElement('div'); grid.className='grid';
  list.forEach((m,idx)=>{ const realIdx=movies.indexOf(m); const card=document.createElement('div'); card.className=`card ${m.quality}`;
    card.innerHTML=`<div class="poster-wrap">${m.poster?`<img class="cposter" src="${m.poster}" loading="lazy">`:`<div class="no-poster" style="background:#1e1a2a; display:flex; align-items:center; justify-content:center; height:100%;">🎬</div>`}${m.vote_average?`<div class="crating">⭐ ${m.vote_average.toFixed(1)}</div>`:''}</div><div class="cbody"><div class="ctitle">${m.title}</div><div class="cfoot" style="display:flex; justify-content:space-between; margin-top:5px;"><span class="qbadge ${m.quality}">${m.quality==='4kr'?'💎':m.quality==='4kl'?'✨':m.quality==='1r'?'🍀':'🎬'}</span><button class="detail-btn" onclick="openDetail(event,${realIdx})">⋯</button></div></div>`;
    card.onclick=(e)=>{ if(!e.target.closest('.detail-btn')) openDetail(e,realIdx); };
    grid.appendChild(card);
  }); ct.appendChild(grid);
  updateGenreBar(); updateCounts();
}
function updateGenreBar(){ const all=new Set(); movies.forEach(m=>(m.tags||[]).forEach(t=>all.add(t))); const bar=document.getElementById('genre-bar'); bar.innerHTML=''; if(all.size){ const clearBtn=document.createElement('button'); clearBtn.className='gchip'; clearBtn.textContent='✖ Effacer genres'; clearBtn.onclick=clearGenres; bar.appendChild(clearBtn); [...all].sort().forEach(g=>{ const chip=document.createElement('button'); chip.className='gchip'; if(genreInc.has(g)) chip.classList.add('inc'); if(genreExc.has(g)) chip.classList.add('exc'); chip.textContent=g; chip.onclick=()=>toggleGenre(g); bar.appendChild(chip); }); } }
function updateCounts(){ document.getElementById('cnt-all').textContent=movies.length; ['4kr','4kl','1r','1l'].forEach(q=>{const el=document.getElementById('cnt-'+q); if(el) el.textContent=movies.filter(m=>m.quality===q).length;}); document.getElementById('cnt-movie').textContent=movies.filter(m=>(m.media_type||'movie')==='movie').length; document.getElementById('cnt-tv').textContent=movies.filter(m=>m.media_type==='tv').length; document.getElementById('cnt-col').textContent=movies.filter(m=>m.media_type==='collection').length; document.getElementById('cnt-saga').textContent=movies.filter(m=>m.media_type==='saga').length; }

  document.getElementById('dmod').style.display='flex';
}
function closeDet(){ document.getElementById('dmod').style.display='none'; }
