<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CinéVault · Smart Collections</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #05050a;
      --surface: #0c0c14;
      --surface2: #12121c;
      --surface3: #1a1a28;
      --border: rgba(255,255,255,0.05);
      --border2: rgba(255,255,255,0.12);
      --text: #ededf5;
      --muted: #5a5a7a;
      --muted2: #7a7a9a;
      --accent: #8b5cf6;
      --accent2: #c084fc;
      --accent-soft: rgba(139,92,246,0.1);
      --accent-border: rgba(139,92,246,0.3);
      --c4kr: #c084fc;
      --c4kl: #4ade80;
      --c1r: #38bdf8;
      --c1l: #fb923c;
      --card-w: 160px;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(5,5,10,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(139,92,246,0.4);
    }

    .logo-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
    }
    .logo-name em { color: var(--accent2); font-style: italic; }

    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 40px;
      color: var(--text);
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent-border);
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted2);
      font-size: 0.85rem;
    }

    .hdr-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sync-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--muted2);
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .sync-dot.ok { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .sync-dot.loading { background: #fbbf24; animation: pulse 0.8s infinite; }
    .sync-dot.error { background: #f87171; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .count-badge {
      background: var(--surface3);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--border);
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 6px 14px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--muted2);
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      border-color: var(--border2);
      color: var(--text);
      transform: translateY(-1px);
    }
    .btn-add {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: white;
      box-shadow: 0 4px 12px rgba(139,92,246,0.3);
    }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(139,92,246,0.4); }

    /* Filter bar */
    .filter-bar {
      position: sticky;
      top: 70px;
      z-index: 50;
      background: rgba(5,5,10,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 2rem;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .chip {
      padding: 4px 14px;
      border-radius: 40px;
      background: var(--surface2);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .bar-select {
      background: var(--surface2);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    /* Genre bar */
    .genre-bar {
      padding: 0.5rem 2rem;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
    }
    .gchip {
      padding: 3px 12px;
      border-radius: 40px;
      background: var(--surface2);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
    }
    .gchip.inc { background: var(--accent-soft); color: var(--accent2); border-color: var(--accent-border); }
    .gchip.exc { background: rgba(239,68,68,0.1); color: #f87171; text-decoration: line-through; }

    /* Recent section (last 50, sorted by popularity) */
    .recent-section { padding: 1rem 2rem 0; }
    .recent-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.7rem;
    }
    .recent-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted2);
    }
    .recent-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .recent-card {
      width: 72px;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }
    .recent-card:hover { transform: translateY(-4px); border-color: var(--border2); }
    .recent-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .recent-card .rc-placeholder {
      aspect-ratio: 2/3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface3);
    }
    .recent-card .rc-title {
      font-size: 0.65rem;
      padding: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Results bar */
    .results-bar {
      padding: 0.6rem 2rem 0;
      font-size: 0.8rem;
      color: var(--muted2);
    }

    /* Grid */
    .content {
      padding: 1.2rem 2rem 3rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
      gap: 1.2rem;
      animation: fadeUp 0.3s ease;
    }

    /* Card */
    .card {
      background: var(--surface2);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2,0.9,0.4,1.1), box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 20px 30px -12px rgba(0,0,0,0.6);
      border-color: var(--border2);
    }
    .poster {
      aspect-ratio: 2/3;
      width: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .poster { transform: scale(1.03); }
    .no-poster {
      aspect-ratio: 2/3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface3);
      font-size: 2rem;
    }
    .card-body {
      padding: 8px 10px 10px;
    }
    .card-title {
      font-weight: 700;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 0.7rem;
      color: var(--muted2);
    }
    .quality-badge {
      font-size: 0.7rem;
    }

    .detail-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: pointer;
      opacity: 0;
      transition: 0.15s;
    }
    .card:hover .detail-btn { opacity: 1; }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(12px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-container {
      background: var(--surface);
      border-radius: 24px;
      padding: 1.5rem;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--border2);
      animation: modalPop 0.25s ease;
    }
    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      margin-bottom: 1.2rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted2);
      display: block;
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface3);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
    }
    .field-row {
      display: flex;
      gap: 8px;
    }
    .posters-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .poster-opt {
      width: 60px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.6;
      transition: 0.1s;
    }
    .poster-opt.sel { opacity: 1; border-color: var(--accent2); }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 1.2rem;
    }

    /* Collection link picker */
    .collection-link-picker {
      background: var(--surface3);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 12px;
    }
    .link-option {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    /* Filmography list */
    .filmography-list {
      max-height: 320px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface2);
      padding: 4px;
    }
    .filmo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .filmo-item.selected { background: var(--accent-soft); }
    .filmo-item img { width: 42px; border-radius: 6px; }
    .filmo-info { flex: 1; min-width: 0; }
    .filmo-title { font-weight: 600; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .filmo-year { font-size: 0.7rem; color: var(--muted2); }
    .filmo-quality select {
      width: auto;
      padding: 4px 8px;
      font-size: 0.7rem;
    }

    /* Smart collections */
    .sc-group {
      background: var(--surface2);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1.2rem;
      border: 1px solid var(--border);
    }
    .sc-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .sc-poster {
      width: 48px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--surface3);
    }
    .sc-name {
      font-size: 1.1rem;
      font-weight: 800;
    }
    .sc-count {
      background: var(--surface3);
      padding: 2px 8px;
      border-radius: 40px;
      font-size: 0.7rem;
    }
    .sc-type {
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 40px;
      font-size: 0.7rem;
      color: var(--accent2);
    }
    .sc-films {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sc-film {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface3);
      border-radius: 40px;
      padding: 4px 12px 4px 6px;
      cursor: pointer;
      transition: 0.1s;
    }
    .sc-film img { width: 28px; border-radius: 4px; }
    .sc-film-title { font-size: 0.75rem; font-weight: 500; white-space: nowrap; }

    footer {
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-footer {
      font-size: 0.7rem;
      text-transform: uppercase;
      padding: 6px 12px;
    }

    @media (max-width: 700px) {
      header { padding: 0.8rem; }
      .filter-bar, .genre-bar, .results-bar, .content { padding-left: 1rem; padding-right: 1rem; }
      .grid { gap: 0.8rem; }
    }
  </style>
</head>
<body>

<div id="loadingScreen" style="position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;">
  <div class="logo-name" style="font-size:32px;">Ciné<em>Vault</em></div>
  <div style="width:140px; height:2px; background:#1e1e2a;"><div style="width:40%; height:100%; background:var(--accent2); animation: loading 1s infinite;"></div></div>
  <style>@keyframes loading { 0%{width:0%} 50%{width:70%} 100%{width:0%} }</style>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🎬</div>
    <div class="logo-name">Ciné<em>Vault</em></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="Rechercher un film..." oninput="render()">
  </div>
  <div class="hdr-right">
    <div class="sync-badge"><div class="sync-dot" id="syncDot"></div><span id="syncLabel">...</span></div>
    <span class="count-badge" id="countBadge">0</span>
    <button class="btn-add" onclick="openAddModal()">+ Ajouter</button>
  </div>
</header>

<div class="filter-bar" id="filterBar"></div>
<div class="genre-bar" id="genreBar"></div>
<div class="recent-section" id="recentSection"></div>
<div class="results-bar"><span id="resultLabel"></span></div>
<div class="content" id="gridContainer"></div>

<footer>
  <button class="btn-footer" onclick="exportData()">⬇ Exporter JSON</button>
  <button class="btn-footer" onclick="document.getElementById('importFile').click()">⬆ Importer JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  <button class="btn-footer" onclick="exportLetterboxd()">🎞 Letterboxd CSV</button>
  <button class="btn-footer" onclick="openSmartCollections()">⚡ Smart Collections</button>
  <button class="btn-footer" onclick="openFilmoModal()">🎭 Filmographie</button>
</footer>

<!-- ADD/EDIT MODAL -->
<div id="mainModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-title" id="modalTitle">Ajouter un film</div>
    <div class="field">
      <label>Type</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" data-type="movie" class="type-btn active" onclick="setType('movie')">🎬 Film</button>
        <button type="button" data-type="tv" class="type-btn" onclick="setType('tv')">📺 Série</button>
        <button type="button" data-type="collection" class="type-btn" onclick="setType('collection')">🎞 Collection</button>
        <button type="button" data-type="saga" class="type-btn" onclick="setType('saga')">⚡ Saga</button>
      </div>
    </div>
    <div class="field">
      <label id="searchLabel">Titre</label>
      <div class="field-row">
        <input type="text" id="titleInput" placeholder="ex: Dune, Oppenheimer...">
        <button class="sbtn" onclick="searchTMDB()">🔍 Chercher</button>
      </div>
      <div class="status-msg" id="searchStatus"></div>
      <div class="posters-row" id="postersRow"></div>
      <div class="genre-preview" id="genrePreview"></div>
    </div>
    <div class="field">
      <label>Liens personnalisés</label>
      <div id="linksContainer"></div>
      <button class="btn-add-link" onclick="addLinkRow()">+ Ajouter un lien</button>
    </div>
    <div class="field">
      <label>Qualité</label>
      <select id="qualitySelect">
        <option value="4kr">💎 4K Remux</option>
        <option value="4kl">✨ 4K Light</option>
        <option value="1r">🍀 1080p Remux</option>
        <option value="1l">🎬 1080p Light</option>
      </select>
    </div>
    <!-- Collection specific -->
    <div id="collectionSection" style="display:none;">
      <div class="field">
        <label>Liens à attacher aux films (coche ceux que tu veux)</label>
        <div id="collectionLinkPicker" class="collection-link-picker"></div>
        <button class="sbtn" id="loadFilmographyBtn" style="width:100%; margin-top:8px;">🎭 Charger la filmographie</button>
        <div id="filmographyList" class="filmography-list" style="margin-top:12px;"></div>
        <button id="importSelectedBtn" class="btn-add" style="width:100%; margin-top:8px;">⬇ Importer les films sélectionnés</button>
      </div>
    </div>
    <div id="sagaSection" style="display:none;">
      <div class="field">
        <label>Choisir un poster parmi les films de la saga</label>
        <button id="loadSagaPostersBtn" class="sbtn">📀 Charger les posters</button>
        <div id="sagaPostersGrid" class="posters-row"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-add" id="saveBtn" onclick="saveMovie()">Sauvegarder</button>
    </div>
  </div>
</div>

<!-- SMART COLLECTIONS MODAL -->
<div id="smartModal" class="modal-overlay">
  <div class="modal-container" style="max-width:800px;">
    <div class="modal-title">⚡ Smart Collections</div>
    <div id="smartContent" style="max-height:70vh; overflow-y:auto;"></div>
    <div class="modal-actions"><button onclick="closeSmartModal()">Fermer</button></div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" class="modal-overlay"><div class="modal-container" id="detailContent"></div></div>

<script>
  // ---------- CONFIG ----------
  const SU = 'https://dnzrpvyeiyxplrcomsuo.supabase.co';
  const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuenJwdnllaXl4cGxyY29tc3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzYwNTAsImV4cCI6MjA5NTExMjA1MH0.BwuZBjZXQcJlNsaQ_DYSj_n-IbMZswsgL_VuGOVMVs4';
  const TMDB_KEY = '4dc76b66e8b41dd652e56c6cc3a425ab';
  const HEADERS = { 'Content-Type': 'application/json', 'apikey': SK, 'Authorization': `Bearer ${SK}` };
  const QUAL_ICON = { '4kr':'💎','4kl':'✨','1r':'🍀','1l':'🎬' };

  let movies = [];
  let editIndex = null;
  let currentMediaType = 'movie';
  let currentPoster = '';
  let currentMetadata = {};
  let currentLinks = [];
  let currentCollectionLinks = [];
  let currentFilmography = [];
  let currentPersonId = null;
  let currentPersonName = '';

  // Filters
  let qualityFilters = new Set();
  let mediaTypeFilters = new Set();
  let genreInc = new Set();
  let genreExc = new Set();
  let searchQuery = '';

  // DOM
  const gridContainer = document.getElementById('gridContainer');
  const filterBar = document.getElementById('filterBar');
  const genreBarEl = document.getElementById('genreBar');
  const recentSection = document.getElementById('recentSection');
  const resultLabel = document.getElementById('resultLabel');
  const countBadge = document.getElementById('countBadge');
  const syncDot = document.getElementById('syncDot');
  const syncLabel = document.getElementById('syncLabel');

  function setSync(status, text) {
    syncDot.className = `sync-dot ${status}`;
    syncLabel.innerText = text;
  }

  // ---------- LOAD / SAVE ----------
  async function loadMovies() {
    setSync('loading', 'Chargement...');
    try {
      const res = await fetch(`${SU}/rest/v1/movies?select=*&order=created_at.asc`, { headers: HEADERS });
      if (!res.ok) throw new Error();
      const data = await res.json();
      movies = data.map(row => ({ ...row.data, _id: row.id }));
      localStorage.setItem('cinevault_backup', JSON.stringify(movies));
      setSync('ok', 'Sync');
    } catch(e) {
      const backup = localStorage.getItem('cinevault_backup');
      if (backup) movies = JSON.parse(backup);
      setSync('error', 'Local');
    }
    document.getElementById('loadingScreen').style.display = 'none';
    render();
  }

  async function addMovie(movie) {
    try {
      const res = await fetch(`${SU}/rest/v1/movies`, { method: 'POST', headers: { ...HEADERS, 'Prefer': 'return=representation' }, body: JSON.stringify({ data: movie }) });
      if (res.ok) {
        const newMovie = (await res.json())[0].data;
        movies.push(newMovie);
      } else movies.push({ ...movie, _id: Date.now() });
    } catch(e) { movies.push({ ...movie, _id: Date.now() }); }
    localStorage.setItem('cinevault_backup', JSON.stringify(movies));
    render();
  }

  async function updateMovie(idx, movie) {
    const id = movies[idx]._id;
    try {
      await fetch(`${SU}/rest/v1/movies?id=eq.${id}`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ data: movie }) });
      movies[idx] = movie;
    } catch(e) { movies[idx] = movie; }
    localStorage.setItem('cinevault_backup', JSON.stringify(movies));
    render();
  }

  async function deleteMovie(idx) {
    const id = movies[idx]._id;
    try {
      await fetch(`${SU}/rest/v1/movies?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    } catch(e) {}
    movies.splice(idx, 1);
    localStorage.setItem('cinevault_backup', JSON.stringify(movies));
    render();
    closeModal();
  }

  // ---------- RENDER GRID, FILTERS, GENRES, RECENT ----------
  function render() {
    let filtered = [...movies];
    if (qualityFilters.size) filtered = filtered.filter(m => qualityFilters.has(m.quality));
    if (mediaTypeFilters.size) filtered = filtered.filter(m => mediaTypeFilters.has(m.media_type || 'movie'));
    if (genreInc.size) filtered = filtered.filter(m => (m.tags || []).some(t => genreInc.has(t)));
    if (genreExc.size) filtered = filtered.filter(m => !(m.tags || []).some(t => genreExc.has(t)));
    if (searchQuery) filtered = filtered.filter(m => m.title.toLowerCase().includes(searchQuery.toLowerCase()));

    countBadge.innerText = filtered.length;
    resultLabel.innerHTML = `📀 ${filtered.length} film${filtered.length > 1 ? 's' : ''} trouvé(s)`;

    // grid
    if (!filtered.length) { gridContainer.innerHTML = '<div style="text-align:center; padding:3rem;"><div>🎬</div><div>Aucun film</div></div>'; }
    else {
      gridContainer.innerHTML = '';
      const grid = document.createElement('div'); grid.className = 'grid';
      filtered.forEach((m, idx) => {
        const realIdx = movies.indexOf(m);
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `
          <div style="position:relative;">
            ${m.poster ? `<img class="poster" src="${m.poster}" loading="lazy" onerror="this.classList.add('no-poster');this.outerHTML='<div class=\'no-poster\'>🎬</div>'">` : `<div class="no-poster">🎬</div>`}
            <button class="detail-btn" onclick="event.stopPropagation(); openDetail(${realIdx})">⋯</button>
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(m.title)}</div>
            <div class="card-meta">
              <span>${QUAL_ICON[m.quality] || ''}</span>
              <span>${m.release_date ? m.release_date.slice(0,4) : ''}</span>
            </div>
          </div>
        `;
        card.onclick = (e) => { if (!e.target.closest('.detail-btn')) openDetail(realIdx); };
        grid.appendChild(card);
      });
      gridContainer.appendChild(grid);
    }

    renderFilters();
    renderGenres();
    renderRecent();
  }

  function renderFilters() {
    filterBar.innerHTML = '';
    const qualities = [
      { key: '4kr', label: '💎 4K Remux' }, { key: '4kl', label: '✨ 4K Light' },
      { key: '1r', label: '🍀 1080p Remux' }, { key: '1l', label: '🎬 1080p Light' }
    ];
    qualities.forEach(q => {
      const chip = document.createElement('div'); chip.className = `chip ${qualityFilters.has(q.key) ? 'active' : ''}`;
      chip.textContent = q.label;
      chip.style.cursor = 'pointer';
      chip.onclick = () => { if (qualityFilters.has(q.key)) qualityFilters.delete(q.key); else qualityFilters.add(q.key); render(); };
      filterBar.appendChild(chip);
    });
    const sep = document.createElement('div'); sep.style.width = '1px'; sep.style.background = 'var(--border)'; sep.style.margin = '0 6px';
    filterBar.appendChild(sep);
    const types = [
      { key: 'movie', label: '🎬 Films' }, { key: 'tv', label: '📺 Séries' },
      { key: 'collection', label: '🎞 Collections' }, { key: 'saga', label: '⚡ Sagas' }
    ];
    types.forEach(t => {
      const chip = document.createElement('div'); chip.className = `chip ${mediaTypeFilters.has(t.key) ? 'active' : ''}`;
      chip.textContent = t.label;
      chip.style.cursor = 'pointer';
      chip.onclick = () => { if (mediaTypeFilters.has(t.key)) mediaTypeFilters.delete(t.key); else mediaTypeFilters.add(t.key); render(); };
      filterBar.appendChild(chip);
    });
  }

  function renderGenres() {
    const allGenres = new Set();
    movies.forEach(m => (m.tags || []).forEach(g => allGenres.add(g)));
    genreBarEl.innerHTML = '';
    if (!allGenres.size) return;
    const clearBtn = document.createElement('div'); clearBtn.className = 'gchip'; clearBtn.textContent = '✖ Effacer';
    clearBtn.onclick = () => { genreInc.clear(); genreExc.clear(); render(); };
    genreBarEl.appendChild(clearBtn);
    [...allGenres].sort().forEach(g => {
      const chip = document.createElement('div'); chip.className = 'gchip';
      if (genreInc.has(g)) chip.classList.add('inc');
      if (genreExc.has(g)) chip.classList.add('exc');
      chip.textContent = g;
      chip.onclick = () => {
        if (genreInc.has(g)) { genreInc.delete(g); genreExc.add(g); }
        else if (genreExc.has(g)) genreExc.delete(g);
        else genreInc.add(g);
        render();
      };
      genreBarEl.appendChild(chip);
    });
  }

  function renderRecent() {
    if (qualityFilters.size || genreInc.size || genreExc.size || mediaTypeFilters.size || searchQuery) {
      recentSection.innerHTML = ''; return;
    }
    // Prendre les 50 derniers ajoutés (par ordre d'insertion, on suppose que le tableau movies est dans l'ordre d'ajout)
    const last50 = [...movies].slice(-50);
    const popular = [...last50].sort((a,b) => (b.popularity||0) - (a.popularity||0)).slice(0, 12);
    if (!popular.length) { recentSection.innerHTML = ''; return; }
    recentSection.innerHTML = `
      <div class="recent-header"><div class="recent-title">🔥 POPULAIRES — DERNIERS AJOUTS</div><div class="recent-line"></div></div>
      <div class="recent-grid">${popular.map(m => {
        const idx = movies.indexOf(m);
        return `<div class="recent-card" onclick="openDetail(${idx})">
          ${m.poster ? `<img src="${m.poster}" loading="lazy">` : `<div class="rc-placeholder">🎬</div>`}
          <div class="rc-title">${escapeHtml(m.title)}</div>
        </div>`;
      }).join('')}</div>`;
  }

  // ---------- DETAIL ----------
  function openDetail(idx) {
    const m = movies[idx];
    const year = m.release_date?.slice(0,4) || '';
    const runtime = m.runtime ? `${Math.floor(m.runtime/60)}h${m.runtime%60}` : '';
    const rating = m.vote_average ? '⭐ ' + m.vote_average.toFixed(1) : '';
    const links = m.links && m.links.length ? m.links : (m.link ? [{ name: '', url: m.link }] : []);
    const lbUrl = m.tmdb_id ? `https://letterboxd.com/tmdb/${m.tmdb_id}/` : `https://letterboxd.com/search/${encodeURIComponent(m.title)}/`;
    const allocUrl = `https://www.allocine.fr/rechercher/?q=${encodeURIComponent(m.title)}`;
    const subUrl = `https://www.opensubtitles.com/fr/search/all/q-${encodeURIComponent(m.title)}/`;
    document.getElementById('detailContent').innerHTML = `
      <div style="display:flex; gap:1.2rem; flex-wrap:wrap;">
        <div>${m.poster ? `<img src="${m.poster}" style="width:120px; border-radius:12px;">` : `<div style="width:120px; height:180px; background:var(--surface3); display:flex; align-items:center; justify-content:center;">🎬</div>`}</div>
        <div style="flex:1;">
          <div class="modal-title" style="margin-bottom:0.2rem;">${escapeHtml(m.title)}</div>
          <div style="font-size:0.8rem; color:var(--muted2);">${year} ${runtime ? `· ${runtime}` : ''}</div>
          <div style="margin:6px 0;">${rating ? `<span class="quality-badge">${rating}</span>` : ''}</div>
          <div>${(m.tags || []).map(t => `<span class="gchip" style="background:var(--surface3);">${escapeHtml(t)}</span>`).join('')}</div>
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <a href="${lbUrl}" target="_blank" style="color:#00e0a6;">🎞 Letterboxd</a>
            <a href="${allocUrl}" target="_blank" style="color:#fbbf24;">🎬 Allociné</a>
            <a href="${subUrl}" target="_blank" style="color:#4ade80;">💬 Sous-titres</a>
          </div>
          <div style="margin-top:10px;">${links.map(l => `<a href="${l.url}" target="_blank" style="display:inline-block; margin-right:10px;">▶ ${escapeHtml(l.name || 'Lien')}</a>`).join('') || '<span class="no-link">Aucun lien personnalisé</span>'}</div>
        </div>
      </div>
      <div class="modal-actions" style="margin-top:1.2rem;">
        <button class="btn-cancel" onclick="closeDetail()">Fermer</button>
        <button onclick="closeDetail(); openEditModal(${idx})">✎ Modifier</button>
        <button style="background:rgba(239,68,68,0.1); color:#f87171;" onclick="deleteMovie(${idx}); closeDetail();">🗑 Supprimer</button>
      </div>
    `;
    document.getElementById('detailModal').classList.add('open');
  }
  function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

  // ---------- ADD/EDIT MODAL ----------
  function openAddModal() {
    editIndex = null;
    currentMediaType = 'movie';
    currentPoster = '';
    currentMetadata = {};
    currentLinks = [];
    resetModalForm();
    document.getElementById('modalTitle').innerText = 'Ajouter un film';
    document.getElementById('titleInput').value = '';
    document.getElementById('qualitySelect').value = '1l';
    document.getElementById('postersRow').innerHTML = '';
    document.getElementById('searchStatus').innerText = '';
    document.getElementById('genrePreview').innerHTML = '';
    document.getElementById('linksContainer').innerHTML = '';
    addLinkRow();
    document.getElementById('collectionSection').style.display = 'none';
    document.getElementById('sagaSection').style.display = 'none';
    document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector('.type-btn[data-type="movie"]').classList.add('active');
    document.getElementById('mainModal').classList.add('open');
    setTimeout(() => document.getElementById('titleInput').focus(), 100);
  }

  function openEditModal(idx) {
    const m = movies[idx];
    editIndex = idx;
    currentMediaType = m.media_type || 'movie';
    currentPoster = m.poster || '';
    currentMetadata = { ...m };
    currentLinks = m.links ? [...m.links] : [];
    resetModalForm();
    document.getElementById('modalTitle').innerText = 'Modifier le film';
    document.getElementById('titleInput').value = m.title;
    document.getElementById('qualitySelect').value = m.quality;
    document.getElementById('postersRow').innerHTML = '';
    document.getElementById('searchStatus').innerText = '';
    document.getElementById('genrePreview').innerHTML = '';
    document.getElementById('linksContainer').innerHTML = '';
    if (currentLinks.length === 0) addLinkRow();
    else currentLinks.forEach(l => addLinkRow(l.name, l.url));

    document.getElementById('sagaSection').style.display = 'none';
    document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));

    if (btn) btn.classList.add('active');

  function resetModalForm() {
    // nothing extra
  }

  function closeModal() { document.getElementById('mainModal').classList.remove('open'); editIndex = null; currentFilmography = []; }
  function closeSmartModal() { document.getElementById('smartModal').classList.remove('open'); }

  function setType(type) {
    currentMediaType = type;
    document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`.type-btn[data-type="${type}"]`);
    if (activeBtn) activeBtn.classList.add('active');
    if (type === 'collection') {
      document.getElementById('collectionSection').style.display = 'block';
      document.getElementById('sagaSection').style.display = 'none';
      renderCollectionLinkPicker();
      rebindCollectionButtons();
    } else if (type === 'saga') {
      document.getElementById('sagaSection').style.display = 'block';
      document.getElementById('collectionSection').style.display = 'none';
      const loadBtn = document.getElementById('loadSagaPostersBtn');
      const newBtn = loadBtn.cloneNode(true);
      loadBtn.parentNode.replaceChild(newBtn, loadBtn);
      newBtn.addEventListener('click', loadSagaPosters);
    } else {
      document.getElementById('collectionSection').style.display = 'none';
      document.getElementById('sagaSection').style.display = 'none';
    }
  }

  function addLinkRow(name='', url='') {
    const container = document.getElementById('linksContainer');
    const div = document.createElement('div'); div.className = 'link-row';
    div.innerHTML = `
      <input type="text" placeholder="Nom du lien" value="${escapeHtml(name)}" style="flex:1">
      <input type="text" placeholder="URL" value="${escapeHtml(url)}" style="flex:2">
      <button class="btn-rm-link" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(div);
  }
  function getLinks() {
    const rows = document.querySelectorAll('#linksContainer .link-row');
    return Array.from(rows).map(row => ({
      name: row.querySelector('input:first-child').value.trim(),
      url: row.querySelector('input:nth-child(2)').value.trim()
    })).filter(l => l.url);
  }

  // ---------- TMDB SEARCH ----------
  async function searchTMDB() {
    const title = document.getElementById('titleInput').value.trim();
    if (!title) return;
    const status = document.getElementById('searchStatus');
    status.innerText = 'Recherche...';
    document.getElementById('postersRow').innerHTML = '';
    try {
      let endpoint;
      if (currentMediaType === 'collection') {
        endpoint = `https://api.themoviedb.org/3/search/person?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}&language=fr-FR`;
      } else if (currentMediaType === 'saga') {
        endpoint = `https://api.themoviedb.org/3/search/collection?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}&language=fr-FR`;
      } else {
        const type = currentMediaType === 'tv' ? 'tv' : 'movie';
        endpoint = `https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}&language=fr-FR`;
      }
      const res = await fetch(endpoint);
      const data = await res.json();
      let results = [];
      if (currentMediaType === 'collection') results = (data.results || []).filter(p => p.profile_path).slice(0,8);
      else if (currentMediaType === 'saga') results = (data.results || []).filter(c => c.poster_path).slice(0,8);
      else results = (data.results || []).filter(r => r.poster_path).slice(0,10);
      if (!results.length) { status.innerText = 'Aucun résultat'; return; }
      status.innerText = 'Sélectionnez une affiche :';
      const postersRow = document.getElementById('postersRow');
      results.forEach(r => {
        let posterUrl = '';
        let name = '';
        if (currentMediaType === 'collection') { posterUrl = `https://image.tmdb.org/t/p/w342${r.profile_path}`; name = r.name; }
        else if (currentMediaType === 'saga') { posterUrl = `https://image.tmdb.org/t/p/w342${r.poster_path}`; name = r.name || r.title; }
        else { posterUrl = `https://image.tmdb.org/t/p/w342${r.poster_path}`; name = r.title || r.name; }
        const div = document.createElement('div'); div.style.cursor = 'pointer'; div.style.textAlign = 'center';
        div.innerHTML = `<img src="${posterUrl}" style="width:70px; border-radius:8px;"><div style="font-size:9px;">${escapeHtml(name.slice(0,15))}</div>`;
        div.onclick = async () => {
          document.querySelectorAll('#postersRow img').forEach(i => i.style.border = 'none');
          div.querySelector('img').style.border = '2px solid #c084fc';
          currentPoster = posterUrl;
          if (currentMediaType === 'collection') {
            currentMetadata = { tmdb_id: r.id, media_type: 'collection', person_role: r.name, tags: [r.known_for_department||''] };
            document.getElementById('titleInput').value = name;
            currentPersonId = r.id;
            currentPersonName = name;
            renderCollectionLinkPicker();
            await loadFilmographyForPerson();
          } else if (currentMediaType === 'saga') {
            currentMetadata = { tmdb_id: r.id, media_type: 'saga', title: name };
            document.getElementById('titleInput').value = name;
          } else {
            const releaseDate = currentMediaType === 'tv' ? r.first_air_date : r.release_date;
            const tags = (r.genre_ids || []).map(g => `genre_${g}`);
            currentMetadata = {
              tmdb_id: r.id,
              media_type: currentMediaType,
              release_date: releaseDate || '',
              popularity: r.popularity || 0,
              vote_average: r.vote_average || 0,
              tags: tags,
              runtime: 0
            };
            document.getElementById('titleInput').value = name;
            if (currentMediaType === 'movie') {
              try {
                const detail = await fetch(`https://api.themoviedb.org/3/movie/${r.id}?api_key=${TMDB_KEY}`);
                const d = await detail.json();
                currentMetadata.runtime = d.runtime || 0;
              } catch(e) {}
            }
            status.innerText = currentMetadata.runtime ? `⏱ ${Math.floor(currentMetadata.runtime/60)}h${currentMetadata.runtime%60}` : '';
          }
        };
        postersRow.appendChild(div);
      });
    } catch(e) { status.innerText = 'Erreur réseau'; }
  }

  // ---------- COLLECTION FILMOGRAPHY ----------
  async function loadFilmographyForPerson() {
    if (!currentPersonId) return;
    const status = document.getElementById('searchStatus');
    status.innerText = 'Chargement de la filmographie...';
    try {
      const res = await fetch(`https://api.themoviedb.org/3/person/${currentPersonId}/combined_credits?api_key=${TMDB_KEY}&language=fr-FR`);
      const data = await res.json();
      let cast = (data.cast || []).filter(m => m.media_type === 'movie' && m.poster_path);
      cast.sort((a,b) => (b.release_date||'').localeCompare(a.release_date||''));
      cast = cast.slice(0, 150);
      currentFilmography = cast.map(m => ({ movie: m, selected: false, quality: '1l' }));
      renderFilmographyList();
      status.innerText = `${cast.length} films trouvés (triés par date). Doublons autorisés.`;
    } catch(e) { status.innerText = 'Erreur chargement filmographie'; }
  }

  function renderFilmographyList() {
    const container = document.getElementById('filmographyList');
    if (!container) return;
    container.innerHTML = '';
    currentFilmography.forEach((item, idx) => {
      const m = item.movie;
      const div = document.createElement('div'); div.className = `filmo-item ${item.selected ? 'selected' : ''}`;
      div.innerHTML = `
        <input type="checkbox" ${item.selected ? 'checked' : ''} style="width:18px;">
        <img src="https://image.tmdb.org/t/p/w92${m.poster_path}" loading="lazy">
        <div class="filmo-info">
          <div class="filmo-title">${escapeHtml(m.title)}</div>
          <div class="filmo-year">${m.release_date ? m.release_date.slice(0,4) : 'N/A'}</div>
        </div>
        <div class="filmo-quality"><select><option value="4kr">💎 4K</option><option value="4kl">✨ 4K Light</option><option value="1r">🍀 1080p</option><option value="1l" selected>🎬 1080p Light</option></select></div>
      `;
      const cb = div.querySelector('input');
      const sel = div.querySelector('select');
      sel.value = item.quality;
      cb.addEventListener('change', () => { item.selected = cb.checked; div.classList.toggle('selected', cb.checked); });
      sel.addEventListener('change', () => { item.quality = sel.value; });
      div.addEventListener('click', (e) => { if (e.target !== cb && !e.target.closest('select')) { cb.checked = !cb.checked; item.selected = cb.checked; div.classList.toggle('selected', cb.checked); } });
      container.appendChild(div);
    });
  }

  function renderCollectionLinkPicker() {
    const container = document.getElementById('collectionLinkPicker');
    if (!container) return;
    const personName = document.getElementById('titleInput').value || currentPersonName;
    const defaultLinks = [
      { name: 'Letterboxd', url: `https://letterboxd.com/search/${encodeURIComponent(personName)}/` },
      { name: 'Allociné', url: `https://www.allocine.fr/rechercher/?q=${encodeURIComponent(personName)}` },
      { name: 'TMDB', url: `https://www.themoviedb.org/person/${currentPersonId || ''}` },
      { name: 'Wikipedia', url: `https://fr.wikipedia.org/wiki/${encodeURIComponent(personName)}` }
    ].filter(l => l.url && !l.url.includes('undefined'));
    container.innerHTML = '<div style="margin-bottom:8px; font-size:0.7rem;">Sélectionnez les liens à ajouter aux films importés :</div>';
    defaultLinks.forEach(link => {
      const div = document.createElement('div'); div.className = 'link-option';
      div.innerHTML = `<input type="checkbox" checked value="${escapeHtml(link.url)}" data-name="${escapeHtml(link.name)}"><span>${escapeHtml(link.name)} (${escapeHtml(link.url)})</span>`;
      container.appendChild(div);
    });
    // also add custom links from main links container
    const customLinks = getLinks();
    customLinks.forEach(l => {
      const div = document.createElement('div'); div.className = 'link-option';
      div.innerHTML = `<input type="checkbox" checked value="${escapeHtml(l.url)}" data-name="${escapeHtml(l.name || 'Lien')}"><span>${escapeHtml(l.name || 'Lien')} (${escapeHtml(l.url)})</span>`;
      container.appendChild(div);
    });
  }

  function getSelectedCollectionLinks() {
    const container = document.getElementById('collectionLinkPicker');
    if (!container) return [];
    return Array.from(container.querySelectorAll('input:checked')).map(cb => ({ name: cb.dataset.name || 'Lien', url: cb.value }));
  }

  async function importSelectedFilms() {
    const selectedLinks = getSelectedCollectionLinks();
    const toImport = currentFilmography.filter(item => item.selected);
    if (!toImport.length) { alert('Aucun film sélectionné'); return; }
    let imported = 0;
    for (const item of toImport) {
      const m = item.movie;
      const poster = `https://image.tmdb.org/t/p/w342${m.poster_path}`;
      let runtime = 0;
      try {
        const d = await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${TMDB_KEY}`);
        const data = await d.json();
        runtime = data.runtime || 0;
      } catch(e) {}
      const newMovie = {
        title: m.title,
        link: selectedLinks[0]?.url || '',
        links: selectedLinks,
        quality: item.quality,
        poster: poster,
        release_date: m.release_date || '',
        popularity: m.popularity || 0,
        vote_average: m.vote_average || 0,
        tags: [],
        runtime: runtime,
        tmdb_id: m.id,
        media_type: 'movie',
        person_id: currentPersonId,
        person_role: currentPersonName
      };
      await addMovie(newMovie);
      imported++;
    }
    alert(`${imported} film(s) importé(s) avec les liens sélectionnés.`);
    currentFilmography = [];
    document.getElementById('filmographyList').innerHTML = '';
    document.getElementById('searchStatus').innerText = '';
    render();
  }

  function rebindCollectionButtons() {
    const loadBtn = document.getElementById('loadFilmographyBtn');
    const newLoad = loadBtn.cloneNode(true);
    loadBtn.parentNode.replaceChild(newLoad, loadBtn);
    newLoad.addEventListener('click', loadFilmographyForPerson);
    const importBtn = document.getElementById('importSelectedBtn');
    const newImport = importBtn.cloneNode(true);
    importBtn.parentNode.replaceChild(newImport, importBtn);
    newImport.addEventListener('click', importSelectedFilms);
  }

  // ---------- SAGA POSTERS ----------
  async function loadSagaPosters() {
    const sagaId = currentMetadata.tmdb_id;
    if (!sagaId) { alert('Aucun TMDB ID. Cherchez d\'abord la saga.'); return; }
    try {
      const res = await fetch(`https://api.themoviedb.org/3/collection/${sagaId}?api_key=${TMDB_KEY}&language=fr-FR`);
      const data = await res.json();
      const parts = data.parts || [];
      const container = document.getElementById('sagaPostersGrid');
      container.innerHTML = '';
      parts.slice(0,12).forEach(p => {
        if (!p.poster_path) return;
        const url = `https://image.tmdb.org/t/p/w342${p.poster_path}`;
        const div = document.createElement('div'); div.style.cursor = 'pointer'; div.style.textAlign = 'center';
        div.innerHTML = `<img src="${url}" style="width:70px; border-radius:8px;"><div style="font-size:8px;">${escapeHtml(p.title.slice(0,12))}</div>`;
        div.onclick = () => { currentPoster = url; document.querySelectorAll('#sagaPostersGrid img').forEach(i => i.style.border = 'none'); div.querySelector('img').style.border = '2px solid #c084fc'; };
        container.appendChild(div);
      });
    } catch(e) { alert('Erreur chargement saga'); }
  }

  // ---------- SMART COLLECTIONS ----------
  function openSmartCollections() {
    const groups = new Map();
    for (const m of movies) {
      if (m.person_id && !m.person_role) m.person_role = 'Artiste';
      if (m.person_id) {
        const key = `person_${m.person_id}`;
        if (!groups.has(key)) groups.set(key, { name: m.person_role || 'Acteur/Réalisateur', poster: m.poster, type: 'person', items: [] });
        groups.get(key).items.push(m);
      }
      if (m.collection_id) {
        const key = `collection_${m.collection_id}`;
        if (!groups.has(key)) groups.set(key, { name: `Saga ${m.collection_id}`, poster: m.poster, type: 'saga', items: [] });
        groups.get(key).items.push(m);
      }
    }
    const valid = Array.from(groups.values()).filter(g => g.items.length >= 3);
    const content = document.getElementById('smartContent');
    if (!valid.length) { content.innerHTML = '<div class="empty-sub">Aucun regroupement (3+ films) trouvé.</div>'; }
    else {
      content.innerHTML = '';
      for (const g of valid) {
        const groupDiv = document.createElement('div'); groupDiv.className = 'sc-group';
        groupDiv.innerHTML = `
          <div class="sc-header">
            ${g.poster ? `<img class="sc-poster" src="${g.poster}" onerror="this.outerHTML='<div class=&quot;sc-poster&quot;>🎬</div>'">` : `<div class="sc-poster" style="display:flex;align-items:center;justify-content:center;">🎬</div>`}
            <div class="sc-name">${escapeHtml(g.name)}</div>
            <div class="sc-count">${g.items.length} films</div>
            <div class="sc-type">${g.type === 'person' ? '🎭 Acteur / Réal' : '⚡ Saga'}</div>
          </div>
          <div class="sc-films">
            ${g.items.map(m => `
              <div class="sc-film" data-idx="${movies.indexOf(m)}">
                <img src="${m.poster || ''}" onerror="this.src=''">
                <div class="sc-film-title">${escapeHtml(m.title)}</div>
              </div>
            `).join('')}
          </div>
        `;
        groupDiv.querySelectorAll('.sc-film').forEach(el => {
          const idx = parseInt(el.dataset.idx);
          el.addEventListener('click', () => { closeSmartModal(); openDetail(idx); });
        });
        content.appendChild(groupDiv);
      }
    }
    document.getElementById('smartModal').classList.add('open');
  }

  // ---------- STANDALONE FILMOGRAPHY MODAL ----------
  let standaloneFilmoResults = [], standaloneFilmoSelected = new Set();
  function openFilmoModal() {
    standaloneFilmoResults = [];
    standaloneFilmoSelected.clear();
    const modalHtml = `
      <div class="modal-container" style="max-width:700px;">
        <div class="modal-title">🎭 Importer une filmographie</div>
        <div class="field">
          <label>Acteur / Réalisateur</label>
          <div class="field-row">
            <input type="text" id="filmoSearchInput" placeholder="ex: Robert De Niro">
            <button id="filmoSearchBtn">🔍 Chercher</button>
          </div>
          <div class="status-msg" id="filmoStatus"></div>
        </div>
        <div id="filmoQualityField" style="display:none;" class="field">
          <label>Qualité par défaut</label>
          <select id="filmoDefaultQuality"><option value="4kr">💎 4K Remux</option><option value="4kl">✨ 4K Light</option><option value="1r" selected>🍀 1080p Remux</option><option value="1l">🎬 1080p Light</option></select>
        </div>
        <div id="filmoBar" style="display:none;" class="fmod-bar">
          <span><strong id="filmoCount">0</strong> sélectionnés</span>
          <button id="filmoSelectAll">Tout sélectionner</button>
          <button id="filmoDeselectExisting">Décocher existants</button>
        </div>
        <div id="filmoGrid" class="filmography-list" style="height:400px;"></div>
        <div class="modal-actions"><button id="filmoImportBtn" style="display:none;" class="btn-add">⬇ Importer la sélection</button><button onclick="closeModalOverlay('filmoOverlay')">Fermer</button></div>
      </div>
    `;
    const overlay = document.createElement('div'); overlay.className = 'modal-overlay open'; overlay.id = 'filmoOverlay';
    overlay.innerHTML = modalHtml;
    document.body.appendChild(overlay);
    document.getElementById('filmoSearchBtn').onclick = async () => {
      const q = document.getElementById('filmoSearchInput').value.trim();
      if (!q) return;
      const st = document.getElementById('filmoStatus');
      st.innerText = 'Recherche...';
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=fr-FR`);
        const data = await res.json();
        const people = (data.results || []).filter(p => p.known_for_department);
        if (!people.length) { st.innerText = 'Aucune personne'; return; }
        if (people.length === 1) loadFilmoData(people[0].id, people[0].name);
        else {
          st.innerHTML = 'Plusieurs résultats : ' + people.slice(0,4).map(p => `<button class="sbtn" style="margin:2px;" onclick="loadFilmoData(${p.id},'${p.name.replace(/'/g,"\\'")}')">${p.name}</button>`).join('');
        }
      } catch(e) { st.innerText = 'Erreur'; }
    };
    window.loadFilmoData = async (personId, name) => {
      const st = document.getElementById('filmoStatus');
      st.innerText = `Chargement des films de ${name}...`;
      try {
        const res = await fetch(`https://api.themoviedb.org/3/person/${personId}/combined_credits?api_key=${TMDB_KEY}&language=fr-FR`);
        const data = await res.json();
        let cast = (data.cast || []).filter(m => m.media_type === 'movie' && m.poster_path);
        cast.sort((a,b) => (b.release_date||'').localeCompare(a.release_date||''));
        cast = cast.slice(0, 200);
        standaloneFilmoResults = cast;
        standaloneFilmoSelected.clear();
        const grid = document.getElementById('filmoGrid');
        grid.innerHTML = '';
        cast.forEach((m, i) => {
          const already = movies.some(ex => ex.tmdb_id === m.id);
          const card = document.createElement('div'); card.className = 'filmo-item';
          card.innerHTML = `
            <input type="checkbox" ${standaloneFilmoSelected.has(i) ? 'checked' : ''}>
            <img src="https://image.tmdb.org/t/p/w92${m.poster_path}">
            <div class="filmo-info"><div class="filmo-title">${escapeHtml(m.title)}</div><div class="filmo-year">${m.release_date ? m.release_date.slice(0,4) : '?'}</div></div>
            ${already ? '<span style="color:#4ade80;">✓ déjà importé</span>' : ''}
          `;
          const cb = card.querySelector('input');
          if (!already) cb.addEventListener('change', () => { if (cb.checked) standaloneFilmoSelected.add(i); else standaloneFilmoSelected.delete(i); document.getElementById('filmoCount').innerText = standaloneFilmoSelected.size; });
          else cb.disabled = true;
          grid.appendChild(card);
        });
        document.getElementById('filmoCount').innerText = standaloneFilmoSelected.size;
        document.getElementById('filmoQualityField').style.display = 'block';
        document.getElementById('filmoBar').style.display = 'flex';
        document.getElementById('filmoImportBtn').style.display = 'block';
        st.innerText = `${cast.length} films trouvés pour ${name}`;
      } catch(e) { st.innerText = 'Erreur chargement'; }
    };
    document.getElementById('filmoSelectAll')?.addEventListener('click', () => {
      standaloneFilmoResults.forEach((_,i) => standaloneFilmoSelected.add(i));
      document.querySelectorAll('#filmoGrid input[type="checkbox"]:not(:disabled)').forEach(cb => cb.checked = true);
      document.getElementById('filmoCount').innerText = standaloneFilmoSelected.size;
    });
    document.getElementById('filmoDeselectExisting')?.addEventListener('click', () => {
      standaloneFilmoResults.forEach((m,i) => { if (movies.some(ex => ex.tmdb_id === m.id)) standaloneFilmoSelected.delete(i); });
      renderFilmoCheckboxes();
      document.getElementById('filmoCount').innerText = standaloneFilmoSelected.size;
    });
    document.getElementById('filmoImportBtn')?.addEventListener('click', async () => {
      const quality = document.getElementById('filmoDefaultQuality').value;
      const toImport = Array.from(standaloneFilmoSelected).map(i => standaloneFilmoResults[i]);
      if (!toImport.length) return;
      for (const m of toImport) {
        if (movies.some(ex => ex.tmdb_id === m.id)) continue;
        const poster = `https://image.tmdb.org/t/p/w342${m.poster_path}`;
        let runtime = 0;
        try { const d = await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${TMDB_KEY}`); const data = await d.json(); runtime = data.runtime || 0; } catch(e) {}
        await addMovie({
          title: m.title, link: '', links: [], quality, poster,
          release_date: m.release_date || '', popularity: m.popularity || 0,
          vote_average: m.vote_average || 0, tags: [], runtime,
          tmdb_id: m.id, media_type: 'movie'
        });
      }
      alert(`${toImport.length} film(s) importé(s)`);
      document.getElementById('filmoOverlay').remove();
    });
  }
  function renderFilmoCheckboxes() {
    document.querySelectorAll('#filmoGrid .filmo-item').forEach((item, i) => {
      const cb = item.querySelector('input');
      if (cb && !cb.disabled) cb.checked = standaloneFilmoSelected.has(i);
    });
  }
  function closeModalOverlay(id) { document.getElementById(id)?.remove(); }

  // ---------- SAVE MOVIE ----------
  async function saveMovie() {
    const title = document.getElementById('titleInput').value.trim();
    if (!title) { alert('Entrez un titre'); return; }
    const quality = document.getElementById('qualitySelect').value;
    const links = getLinks();
    const movieData = {
      title,
      link: links[0]?.url || '',
      links: links,
      quality,
      poster: currentPoster,
      release_date: currentMetadata.release_date || '',
      popularity: currentMetadata.popularity || 0,
      vote_average: currentMetadata.vote_average || 0,
      tags: currentMetadata.tags || [],
      runtime: currentMetadata.runtime || 0,
      tmdb_id: currentMetadata.tmdb_id || null,
      media_type: currentMediaType,
      person_id: currentPersonId || null,
      person_role: currentPersonName || '',
      collection_id: currentMetadata.collection_id || null
    };
    closeModal();
    if (editIndex !== null) await updateMovie(editIndex, movieData);
    else await addMovie(movieData);
  }

  // ---------- EXPORT / IMPORT ----------
  function exportData() {
    const blob = new Blob([JSON.stringify(movies, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cinevault.json'; a.click();
  }
  async function importData(event) {
    const file = event.target.files[0];
    const text = await file.text();
    const imported = JSON.parse(text);
    for (const m of imported) await addMovie(m);
    render();
  }
  function exportLetterboxd() {
    let csv = 'Title,Year,tmdbID\n';
    movies.forEach(m => { csv += `"${m.title.replace(/"/g, '""')}",${m.release_date?.slice(0,4) || ''},${m.tmdb_id || ''}\n`; });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'letterboxd_export.csv'; a.click();
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }

  // Global exports for onclick
  window.openDetail = openDetail;
  window.openAddModal = openAddModal;
  window.openEditModal = openEditModal;
  window.openSmartCollections = openSmartCollections;
  window.openFilmoModal = openFilmoModal;
  window.closeModal = closeModal;
  window.closeDetail = closeDetail;
  window.closeSmartModal = closeSmartModal;
  window.setType = setType;
  window.searchTMDB = searchTMDB;
  window.addLinkRow = addLinkRow;
  window.saveMovie = saveMovie;
  window.deleteMovie = deleteMovie;
  window.exportData = exportData;
  window.importData = importData;
  window.exportLetterboxd = exportLetterboxd;
  window.closeModalOverlay = closeModalOverlay;

  document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; render(); });
  document.getElementById('mainModal').addEventListener('click', (e) => { if (e.target === document.getElementById('mainModal')) closeModal(); });
  document.getElementById('detailModal').addEventListener('click', (e) => { if (e.target === document.getElementById('detailModal')) closeDetail(); });
  document.getElementById('smartModal').addEventListener('click', (e) => { if (e.target === document.getElementById('smartModal')) closeSmartModal(); });

  loadMovies();
</script>
