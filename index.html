<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIDÉO CLUB 3D - Expérience immersive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Courier New', 'Segoe UI', monospace;
            background: #000;
            height: 100vh;
            width: 100vw;
        }

        /* Conteneur principal */
        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 0.4s ease-in-out;
        }

        /* Zones cliquables (hotspots) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.2s, box-shadow 0.2s;
            border-radius: 8px;
        }
        .hotspot:hover {
            background: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 0 2px #ffcc44;
        }

        /* Interface overlay (catalogue, etc.) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }
        .overlay.visible {
            display: flex;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            background: rgba(0,0,0,0.6);
            padding: 20px;
            border-radius: 30px;
        }
        .movie-card {
            background: #1e1a24;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #ffcc66;
            transition: 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff66aa;
        }
        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .movie-title {
            padding: 8px;
            text-align: center;
            color: #ffecb3;
            font-size: 12px;
        }
        .close-overlay {
            position: absolute;
            top: 20px;
            right: 30px;
            background: #ff3366;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Animation prise DVD */
        .take-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s;
        }
        .hand-take {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path fill="%23f7d9aa" d="M80,140 L110,170 L160,120 L130,90 L80,140Z" stroke="%23806040" stroke-width="2"/><circle cx="100" cy="110" r="28" fill="%23f7d9aa"/><rect x="90" y="80" width="40" height="60" fill="%23332211" rx="5"/><rect x="95" y="85" width="30" height="20" fill="%23ff3366"/></svg>') no-repeat center;
            background-size: contain;
            width: 180px;
            height: 180px;
            animation: grab 0.5s ease-out forwards;
        }
        @keyframes grab {
            0% { transform: translateY(100px) scale(0.8); opacity: 0; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Indicateur de direction */
        .instruction {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffdd99;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="instruction" id="instruction">🏠 Cliquez sur la porte pour entrer</div>
</div>

<!-- Overlay catalogue -->
<div id="catalogOverlay" class="overlay">
    <button class="close-overlay" onclick="closeCatalog()">✖ FERMER</button>
    <h2 style="color:#ffcc44; margin-bottom:20px;">📀 CATALOGUE COMPLET</h2>
    <div id="catalogGrid" class="catalog-grid"></div>
</div>

<script>
    // ---------- Configuration ----------
    // Données des films (seront chargées depuis Supabase / localStorage)
    let movies = []; // { title, poster, quality, media_type, tmdb_id, etc. }
    
    // État du jeu
    let currentView = "street"; // street, hall, aisle_4kr, aisle_4kl, aisle_1r, aisle_1l, upstairs
    let currentQuality = null;   // pour savoir dans quelle allée on est
    let currentMediaType = "movie"; // movie ou tv
    
    // Éléments DOM
    const container = document.getElementById("gameContainer");
    const catalogOverlay = document.getElementById("catalogOverlay");
    const catalogGridDiv = document.getElementById("catalogGrid");
    
    // ---------- Chargement des films (Supabase + fallback) ----------
    const SU = 'https://dnzrpvyeiyxplrcomsuo.supabase.co';
    const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuenJwdnllaXl4cGxyY29tc3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzYwNTAsImV4cCI6MjA5NTExMjA1MH0.BwuZBjZXQcJlNsaQ_DYSj_n-IbMZswsgL_VuGOVMVs4';
    const H = {'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
    
    async function loadMovies() {
        try {
            const r = await fetch(`${SU}/rest/v1/movies?select=*&order=created_at.asc`, { headers: H });
            if (r.ok) {
                const data = await r.json();
                movies = data.map(row => ({ ...row.data, _id: row.id }));
                localStorage.setItem("videoclub_movies", JSON.stringify(movies));
            } else throw new Error();
        } catch(e) {
            const local = localStorage.getItem("videoclub_movies");
            if (local) movies = JSON.parse(local);
            else movies = []; // exemple par défaut si rien
        }
        renderCatalogGrid();
    }
    
    function renderCatalogGrid() {
        catalogGridDiv.innerHTML = "";
        movies.forEach(m => {
            const card = document.createElement("div");
            card.className = "movie-card";
            card.innerHTML = `
                <img src="${m.poster || 'https://via.placeholder.com/150x225?text=NO+POSTER'}" onerror="this.src='https://via.placeholder.com/150x225?text=NO+POSTER'">
                <div class="movie-title">${m.title} (${m.release_date?.slice(0,4) || '?'})</div>
            `;
            card.onclick = () => {
                closeCatalog();
                startTakeAnimation(m.title);
            };
            catalogGridDiv.appendChild(card);
        });
    }
    
    function openCatalog() {
        renderCatalogGrid();
        catalogOverlay.classList.add("visible");
    }
    function closeCatalog() {
        catalogOverlay.classList.remove("visible");
    }
    
    // Animation de prise de DVD
    function startTakeAnimation(movieTitle) {
        const animDiv = document.createElement("div");
        animDiv.className = "take-animation";
        animDiv.innerHTML = `
            <div style="text-align:center; background:#1e1712; padding:30px; border-radius:48px; border:2px solid #ffcc44;">
                <div class="hand-take"></div>
                <p style="margin-top:20px; font-size:24px; font-weight:bold;">📀 ${movieTitle}</p>
                <p style="margin-top:8px;">Vous prenez le DVD sur l'étagère...</p>
                <button class="close-anim" style="margin-top:20px; background:#ffcc44; border:none; padding:8px 20px; border-radius:40px; cursor:pointer;">Refermer</button>
            </div>
        `;
        document.body.appendChild(animDiv);
        const closeBtn = animDiv.querySelector(".close-anim");
        closeBtn.onclick = () => animDiv.remove();
        setTimeout(() => { if(animDiv.parentNode) animDiv.remove(); }, 3000);
    }
    
    // ---------- Vues et hotspots ----------
    // On va définir des images de fond (des illustrations) pour chaque vue.
    // Comme on n'a pas de vraies images 3D, on utilise des couleurs/gradients et du texte,
    // mais pour un rendu réaliste, l'idéal serait d'avoir des photos. Faute de mieux,
    // on va utiliser des backgrounds générés avec des formes CSS.
    // Vous pourrez remplacer les URLs par de vraies images plus tard.
    
    const views = {
        street: {
            bg: "linear-gradient(135deg, #2c3e50, #1a2632)",
            html: `
                <div style="position:absolute; bottom:30%; left:35%; width:30%; height:40%; background:#8B5A2B; border-radius:20px; box-shadow:0 0 0 10px #5a3a1a;">
                    <div style="position:absolute; top:-30px; left:50%; transform:translateX(-50%); background:#ff3366; padding:5px 15px; border-radius:30px; color:white; font-weight:bold;">📼 VIDEO CLUB</div>
                    <div class="hotspot" id="doorHotspot" style="width:80px; height:150px; bottom:0; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.3);"></div>
                </div>
                <div style="position:absolute; bottom:10px; left:10px; color:#ddd; background:rgba(0,0,0,0.5); padding:5px;">🚪 Cliquez sur la porte</div>
            `,
            hotspots: [{ id: "doorHotspot", action: () => goToView("hall") }]
        },
        hall: {
            bg: "linear-gradient(145deg, #3a2a1a, #1f1508)",
            html: `
                <div style="position:absolute; top:30%; left:5%; width:180px; height:120px; background:#2e241a; border:4px solid #ffcc44; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#ffdd99;">📋 CATALOGUE</div>
                <div class="hotspot" id="catalogHotspot" style="top:30%; left:5%; width:180px; height:120px;"></div>
                
                <!-- Allées -->
                <div style="position:absolute; bottom:20%; left:20%; width:150px; height:200px; background:#4a3520; border-radius:8px; text-align:center; padding-top:10px;">💎 4K REMUX</div>
                <div class="hotspot" id="aisle4kr" style="bottom:20%; left:20%; width:150px; height:200px;"></div>
                
                <div style="position:absolute; bottom:20%; left:45%; width:150px; height:200px; background:#4a3520; border-radius:8px; text-align:center; padding-top:10px;">✨ 4K LIGHT</div>
                <div class="hotspot" id="aisle4kl" style="bottom:20%; left:45%; width:150px; height:200px;"></div>
                
                <div style="position:absolute; bottom:20%; left:70%; width:150px; height:200px; background:#4a3520; border-radius:8px; text-align:center; padding-top:10px;">🍀 1080P REMUX</div>
                <div class="hotspot" id="aisle1r" style="bottom:20%; left:70%; width:150px; height:200px;"></div>
                
                <!-- Escalier droite -->
                <div style="position:absolute; top:40%; right:5%; width:100px; height:180px; background:#8B5A2B; border-radius:10px; text-align:center; padding-top:20px;">📺 SÉRIES<br>⬆️</div>
                <div class="hotspot" id="stairs" style="top:40%; right:5%; width:100px; height:180px;"></div>
            `,
            hotspots: [
                { id: "catalogHotspot", action: () => openCatalog() },
                { id: "aisle4kr", action: () => goToAisle("4kr", "movie") },
                { id: "aisle4kl", action: () => goToAisle("4kl", "movie") },
                { id: "aisle1r", action: () => goToAisle("1r", "movie") },
                { id: "stairs", action: () => goToView("upstairsHall") }
            ]
        },
        upstairsHall: {
            bg: "linear-gradient(145deg, #2a2a1a, #1a1508)",
            html: `
                <div style="position:absolute; top:20px; left:20px; background:#ffaa33; padding:5px 15px; border-radius:20px;">📺 ÉTAGE SÉRIES</div>
                <div style="position:absolute; bottom:20%; left:20%; width:150px; height:200px; background:#4a3520; border-radius:8px; text-align:center; padding-top:10px;">💎 4K REMUX SÉRIES</div>
                <div class="hotspot" id="aisle4kr_tv" style="bottom:20%; left:20%; width:150px; height:200px;"></div>
                
                <div style="position:absolute; bottom:20%; left:45%; width:150px; height:200px; background:#4a3520; border-radius:8px; text-align:center; padding-top:10px;">✨ 4K LIGHT SÉRIES</div>
                <div class="hotspot" id="aisle4kl_tv" style="bottom:20%; left:45%; width:150px; height:200px;"></div>
                
                <div style="position:absolute; bottom:20%; left:70%; width:150px; height:200px; background:#4a3520; border-radius:8px; text-align:center; padding-top:10px;">🍀 1080P REMUX SÉRIES</div>
                <div class="hotspot" id="aisle1r_tv" style="bottom:20%; left:70%; width:150px; height:200px;"></div>
                
                <div class="hotspot" id="backToHall" style="bottom:10px; left:10px; width:80px; height:40px; background:rgba(0,0,0,0.5); border-radius:20px; text-align:center; line-height:40px; color:white;">⬇ DESCENDRE</div>
            `,
            hotspots: [
                { id: "aisle4kr_tv", action: () => goToAisle("4kr", "tv") },
                { id: "aisle4kl_tv", action: () => goToAisle("4kl", "tv") },
                { id: "aisle1r_tv", action: () => goToAisle("1r", "tv") },
                { id: "backToHall", action: () => goToView("hall") }
            ]
        }
    };
    
    // Génération dynamique des vues d'allées
    function goToAisle(quality, mediaType) {
        currentQuality = quality;
        currentMediaType = mediaType;
        const aisleId = `aisle_${quality}_${mediaType}`;
        if (!views[aisleId]) {
            // Créer la vue de l'allée avec les films correspondants
            const filtered = movies.filter(m => 
                m.quality === quality && (m.media_type || 'movie') === mediaType
            );
            let html = `<div style="position:absolute; top:20px; left:20px; background:#ffaa33; padding:5px 15px; border-radius:20px;">${quality.toUpperCase()} - ${mediaType === 'tv' ? 'SÉRIES' : 'FILMS'}</div>`;
            html += `<div style="position:absolute; bottom:10px; left:10px; cursor:pointer; background:#00000099; padding:5px 10px; border-radius:20px;" class="back-btn">⬅ RETOUR</div>`;
            // Afficher les films sur des étagères
            html += `<div style="position:absolute; bottom:30%; left:10%; right:10%; display:flex; flex-wrap:wrap; gap:12px; justify-content:center;">`;
            filtered.forEach((film, idx) => {
                html += `
                    <div class="movie-dvd" data-title="${film.title}" style="width:100px; cursor:pointer; text-align:center;">
                        <img src="${film.poster || 'https://via.placeholder.com/100x150'}" style="width:100px; border-radius:8px; border:2px solid #ffcc44;">
                        <div style="font-size:10px; color:#ffecb3;">${film.title}</div>
                    </div>
                `;
            });
            html += `</div>`;
            views[aisleId] = {
                bg: "linear-gradient(145deg, #2a2418, #120e08)",
                html: html,
                hotspots: [] // sera ajouté après injection
            };
        }
        goToView(aisleId);
        // Après affichage, attacher les événements sur les DVDs
        setTimeout(() => {
            document.querySelectorAll('.movie-dvd').forEach(el => {
                const title = el.getAttribute('data-title');
                el.addEventListener('click', () => startTakeAnimation(title));
            });
            const backBtn = document.querySelector('.back-btn');
            if (backBtn) backBtn.addEventListener('click', () => goToView(mediaType === 'tv' ? 'upstairsHall' : 'hall'));
        }, 50);
    }
    
    function goToView(viewName) {
        currentView = viewName;
        const view = views[viewName];
        if (!view) return;
        container.style.backgroundImage = view.bg;
        container.style.backgroundSize = "cover";
        // Nettoyer les hotspots existants
        const oldHotspots = container.querySelectorAll('.hotspot');
        oldHotspots.forEach(h => h.remove());
        // Ajouter le contenu HTML
        container.innerHTML = view.html;
        // Ajouter les hotspots
        if (view.hotspots) {
            view.hotspots.forEach(hs => {
                const el = document.getElementById(hs.id);
                if (el) {
                    el.classList.add('hotspot');
                    el.onclick = (e) => { e.stopPropagation(); hs.action(); };
                }
            });
        }
        // Réattacher les hotspots créés dynamiquement (comme les DVDs)
        const instructionDiv = document.createElement("div");
        instructionDiv.className = "instruction";
        instructionDiv.innerText = viewName === "street" ? "🏠 Cliquez sur la porte" : "👆 Cliquez sur les éléments pour interagir";
        container.appendChild(instructionDiv);
    }
    
    // Initialisation
    loadMovies().then(() => {
        goToView("street");
    });
</script>
</body>
</html>
