<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinéVault · Bibliothèque</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07070c; --s1:#0d0d16; --s2:#12121e; --s3:#181828; --s4:#1e1e32;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.12);
  --text:#eeeef8; --muted:#3a3a5c; --muted2:#6666a0;
  --accent:#7c6af5; --accent-soft:rgba(124,106,245,0.12); --accent-border:rgba(124,106,245,0.3);
  --c4kr:#c084fc; --c4kr-bg:rgba(192,132,252,0.07);
  --c4kl:#4ade80; --c4kl-bg:rgba(74,222,128,0.07);
  --c1r:#38bdf8;  --c1r-bg:rgba(56,189,248,0.07);
  --c1l:#fb923c;  --c1l-bg:rgba(251,146,60,0.07);
  --card-w:155px; --radius:13px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:1000px;height:700px;border-radius:50%;background:radial-gradient(ellipse,rgba(100,80,220,0.07) 0%,transparent 70%);pointer-events:none;z-index:0;transition:background .7s;}
a{text-decoration:none;color:inherit;}
button{font-family:'DM Sans',sans-serif;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:10px;}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;z-index:999;}
.loading-logo{font-family:'DM Serif Display',serif;font-size:28px;letter-spacing:-.5px;}
.loading-logo em{color:var(--accent);font-style:italic;}
.loading-bar{width:140px;height:2px;background:var(--s3);border-radius:2px;overflow:hidden;}
.loading-bar-inner{height:100%;background:linear-gradient(90deg,#4f3dc8,#a78bfa);border-radius:2px;animation:lbar 1.4s ease infinite;}
@keyframes lbar{0%{width:0;margin-left:0}50%{width:50%;margin-left:25%}100%{width:0;margin-left:100%}}

/* TABS */
.tabs-nav{display:flex;gap:0;border-bottom:1px solid var(--border);background:rgba(7,7,12,0.95);backdrop-filter:blur(20px);position:sticky;top:58px;z-index:45;padding:0 2rem;}
.tab-btn{padding:0 20px;height:42px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.3px;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--text);border-bottom-color:var(--accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* HEADER */
header{padding:0 2rem;height:58px;display:flex;align-items:center;gap:14px;background:rgba(7,7,12,0.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#4f3dc8,#7c6af5);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 18px rgba(124,106,245,0.4);position:relative;overflow:hidden;flex-shrink:0;}
.logo-icon::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);animation:shimmer 3.5s infinite;}
@keyframes shimmer{to{left:200%;}}
.logo-name{font-family:'DM Serif Display',serif;font-size:16px;letter-spacing:-.3px;}
.logo-name em{color:var(--accent);font-style:italic;}
.search-wrap{flex:1;max-width:440px;position:relative;}
.search-input{width:100%;padding:8px 13px 8px 34px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:all .2s;}
.search-input::placeholder{color:var(--muted2);}
.search-input:focus{border-color:var(--accent-border);background:rgba(255,255,255,0.05);box-shadow:0 0 0 3px rgba(124,106,245,0.08);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:12px;pointer-events:none;}
.hdr-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);font-weight:500;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.sync-dot.ok{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,0.5);}
.sync-dot.loading{background:#fbbf24;animation:blink .8s infinite;}
.sync-dot.error{background:#f87171;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.count-badge{font-size:11px;font-weight:700;color:var(--muted2);background:var(--s2);padding:3px 10px;border-radius:20px;border:1px solid var(--border);}
.btn-ghost{padding:7px 11px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted2);font-size:13px;cursor:pointer;transition:all .15s;line-height:1;}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);}
.btn-random{padding:7px 13px;background:rgba(56,189,248,0.07);border:1px solid rgba(56,189,248,0.18);border-radius:8px;color:#7dd3fc;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-random:hover{background:rgba(56,189,248,0.13);}
.btn-add{padding:7px 16px;background:linear-gradient(135deg,#4f3dc8,#7c6af5);border:none;border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:all .2s;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 14px rgba(79,61,200,0.35);}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,61,200,0.5);}

/* FILTER BAR */
.filter-bar{padding:0 2rem;height:44px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border);background:rgba(7,7,12,0.8);backdrop-filter:blur(14px);overflow-x:auto;scrollbar-width:none;position:sticky;top:100px;z-index:40;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.chip:hover{border-color:var(--border2);color:var(--text);}
.chip.active{color:var(--text);background:rgba(255,255,255,0.05);border-color:var(--border2);}
.chip.active[data-q="4kr"]{background:var(--c4kr-bg);border-color:rgba(192,132,252,0.3);color:var(--c4kr);}
.chip.active[data-q="4kl"]{background:var(--c4kl-bg);border-color:rgba(74,222,128,0.3);color:var(--c4kl);}
.chip.active[data-q="1r"]{background:var(--c1r-bg);border-color:rgba(56,189,248,0.3);color:var(--c1r);}
.chip.active[data-q="1l"]{background:var(--c1l-bg);border-color:rgba(251,146,60,0.3);color:var(--c1l);}
.chip-count{font-size:9px;font-weight:800;opacity:.65;}
.bar-sep{width:1px;height:16px;background:var(--border);margin:0 2px;flex-shrink:0;}
.bar-select{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;outline:none;transition:all .15s;flex-shrink:0;}
.bar-select:focus{border-color:var(--border2);color:var(--text);}
.bar-select option{background:var(--s2);color:var(--text);}

/* GENRE BAR */
.genre-bar{padding:.35rem 2rem;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border);background:rgba(7,7,12,0.6);overflow-x:auto;scrollbar-width:none;min-height:38px;}
.genre-bar::-webkit-scrollbar{display:none;}
.genre-bar:empty{display:none;}
.gchip{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.gchip:hover{border-color:var(--border2);color:var(--text);}
.gchip.inc{background:var(--accent-soft);border-color:var(--accent-border);color:#c4b5fd;}
.gchip.exc{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.28);color:#f87171;text-decoration:line-through;}
.genre-hint{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap;flex-shrink:0;}
.genre-clear{padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .15s;}
.genre-clear:hover{color:var(--text);border-color:var(--border2);}

/* RECENT */
.recent-section{padding:1.1rem 2rem 0;position:relative;z-index:1;}
.recent-header{display:flex;align-items:center;gap:10px;margin-bottom:.8rem;}
.recent-title{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted2);}
.recent-line{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.recent-grid{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.recent-grid::-webkit-scrollbar{display:none;}
.recent-card{flex-shrink:0;width:76px;cursor:pointer;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--s1);transition:transform .2s,border-color .2s;}
.recent-card:hover{transform:translateY(-3px);border-color:var(--border2);}
.recent-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
.rc-no-poster{width:100%;aspect-ratio:2/3;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);}
.rc-title{font-size:9px;font-weight:600;color:var(--muted2);padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* RESULTS */
.results-bar{padding:.8rem 2rem 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.results-label{font-size:12px;color:var(--muted2);font-weight:500;}
.results-label strong{color:var(--text);font-weight:700;}

/* GRID */
.content{padding:1rem 2rem 3.5rem;position:relative;z-index:1;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:13px;}

/* CARD */
.card{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--s1);border:1px solid var(--border);cursor:pointer;display:block;transition:transform .28s cubic-bezier(0.34,1.4,0.64,1),border-color .2s,box-shadow .28s;will-change:transform;}
.card.q4kr{background:linear-gradient(160deg,#100c1c 0%,#0d0d16 65%);}
.card.q4kl{background:linear-gradient(160deg,#0a140f 0%,#0d0d16 65%);}
.card.q1r{background:linear-gradient(160deg,#0a111a 0%,#0d0d16 65%);}
.card.q1l{background:linear-gradient(160deg,#150d07 0%,#0d0d16 65%);}
.card:hover{transform:translateY(-9px) scale(1.012);box-shadow:0 28px 55px rgba(0,0,0,0.65),0 0 0 1px rgba(255,255,255,0.04);}
.card.q4kr:hover{border-color:rgba(192,132,252,0.28);box-shadow:0 28px 55px rgba(0,0,0,0.65),0 0 22px rgba(192,132,252,0.1);}
.card.q4kl:hover{border-color:rgba(74,222,128,0.28);box-shadow:0 28px 55px rgba(0,0,0,0.65),0 0 22px rgba(74,222,128,0.1);}
.card.q1r:hover{border-color:rgba(56,189,248,0.28);box-shadow:0 28px 55px rgba(0,0,0,0.65),0 0 22px rgba(56,189,248,0.1);}
.card.q1l:hover{border-color:rgba(251,146,60,0.28);box-shadow:0 28px 55px rgba(0,0,0,0.65),0 0 22px rgba(251,146,60,0.1);}
.card.collection{background:linear-gradient(160deg,#0f0a1c 0%,#0d0d16 65%);}
.card.collection:hover{border-color:rgba(220,180,70,0.3);box-shadow:0 28px 55px rgba(0,0,0,0.65),0 0 22px rgba(220,180,70,0.08);}
.card:hover .card-overlay{opacity:1;}
.card:hover .cposter{transform:scale(1.06);}
.card:hover .detail-btn{opacity:1;transform:scale(1);}
.card:hover .col-portrait{transform:scale(1.06);}
.poster-wrap{overflow:hidden;position:relative;aspect-ratio:2/3;}
.cposter{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease;}
.no-poster{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted);}
.no-poster.q4kr{background:linear-gradient(135deg,#1c0e30,#10091e);}
.no-poster.q4kl{background:linear-gradient(135deg,#0e2015,#0a1510);}
.no-poster.q1r{background:linear-gradient(135deg,#0d1c28,#0a1318);}
.no-poster.q1l{background:linear-gradient(135deg,#281408,#180e07);}
.c-rating{position:absolute;top:7px;left:7px;z-index:2;background:rgba(0,0,0,0.82);color:#fbbf24;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;border:1px solid rgba(251,191,36,0.2);backdrop-filter:blur(6px);}
.card-overlay{position:absolute;inset:0;opacity:0;transition:opacity .22s;background:linear-gradient(to top,rgba(0,0,0,0.96) 0%,rgba(0,0,0,0.2) 55%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;z-index:1;}
.cov-play{position:absolute;top:calc(50% - 30px);left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;backdrop-filter:blur(4px);}
.cov-year{font-size:9px;color:rgba(255,255,255,0.5);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.detail-btn{position:absolute;top:7px;right:7px;z-index:3;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,0.78);border:1px solid rgba(255,255,255,0.1);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.8);transition:all .18s;backdrop-filter:blur(6px);}
.detail-btn:hover{background:rgba(79,61,200,0.45);border-color:rgba(124,106,245,0.4);}
.col-portrait-wrap{overflow:hidden;position:relative;aspect-ratio:2/3;}
.col-portrait-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(to top,rgba(0,0,0,0.92),transparent);pointer-events:none;}
.col-portrait{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .45s ease;}
.col-name-overlay{position:absolute;bottom:8px;left:8px;right:8px;z-index:2;}
.col-role{font-size:9px;color:rgba(220,180,70,0.85);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;}
.no-portrait{width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#1c0e30,#12091e);color:var(--muted);font-size:34px;}
.cbody{padding:9px 10px 11px;position:relative;}
.ctitle{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;padding-right:4px;}
.csub{font-size:10px;color:var(--muted2);margin-top:2px;font-weight:500;}
.cfoot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px;gap:4px;}
.ctags{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0;}
.ctag{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--muted);letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--border);white-space:nowrap;}
.qbadge{font-size:13px;line-height:1;padding:3px 5px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
.qbadge.q4kr{background:rgba(192,132,252,0.12);border:1px solid rgba(192,132,252,0.24);}
.qbadge.q4kl{background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.24);}
.qbadge.q1r{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.2);}
.qbadge.q1l{background:rgba(100,100,120,0.1);border:1px solid rgba(255,255,255,0.07);filter:grayscale(1);opacity:.55;}
.empty{padding:5rem 1rem;text-align:center;}
.empty-icon{font-size:50px;opacity:.14;margin-bottom:14px;}
.empty-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--muted2);}

/* ═══ REGROUPEMENTS TAB ═══ */
.groups-page{padding:1.5rem 2rem 3rem;position:relative;z-index:1;}
.groups-section-title{display:flex;align-items:center;gap:12px;margin-bottom:1.2rem;margin-top:2rem;}
.groups-section-title:first-child{margin-top:0;}
.gst-label{font-family:'DM Serif Display',serif;font-size:18px;font-style:italic;}
.gst-line{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.gst-count{font-size:10px;font-weight:700;color:var(--muted2);background:var(--s2);padding:2px 8px;border-radius:12px;border:1px solid var(--border);}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.group-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(0.34,1.4,0.64,1),border-color .2s,box-shadow .25s;}
.group-card:hover{transform:translateY(-5px);border-color:var(--border2);box-shadow:0 20px 44px rgba(0,0,0,0.55);}
.group-card.actor-group:hover{border-color:rgba(167,139,250,0.35);box-shadow:0 20px 44px rgba(0,0,0,0.55),0 0 18px rgba(167,139,250,0.08);}
.group-card.saga-group:hover{border-color:rgba(251,191,36,0.35);box-shadow:0 20px 44px rgba(0,0,0,0.55),0 0 18px rgba(251,191,36,0.08);}
.group-header{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start;}
.group-avatar{width:52px;height:52px;border-radius:9px;object-fit:cover;object-position:top;flex-shrink:0;border:1px solid var(--border);}
.group-avatar-placeholder{width:52px;height:52px;border-radius:9px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--border);}
.group-info{flex:1;min-width:0;}
.group-name{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.group-meta{font-size:11px;color:var(--muted2);margin-top:2px;font-weight:500;}
.group-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:12px;margin-top:5px;letter-spacing:.5px;text-transform:uppercase;}
.group-badge.actor{background:rgba(167,139,250,0.12);color:#c4b5fd;border:1px solid rgba(167,139,250,0.25);}
.group-badge.director{background:rgba(251,191,36,0.1);color:#fcd34d;border:1px solid rgba(251,191,36,0.22);}
.group-badge.saga{background:rgba(251,146,60,0.1);color:#fb923c;border:1px solid rgba(251,146,60,0.22);}
.group-posters{display:flex;gap:4px;padding:0 14px 14px;overflow:hidden;}
.group-poster-mini{flex:1;border-radius:6px;overflow:hidden;aspect-ratio:2/3;background:var(--s2);}
.group-poster-mini img{width:100%;height:100%;object-fit:cover;display:block;}
.group-poster-more{flex:1;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted2);aspect-ratio:2/3;border:1px solid var(--border);}
.groups-empty{padding:4rem 1rem;text-align:center;}
.groups-empty-icon{font-size:44px;opacity:.12;margin-bottom:12px;}
.groups-empty-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:6px;}
.groups-empty-sub{font-size:13px;color:var(--muted2);}

/* GROUP DETAIL MODAL */
.gmod{width:720px;max-height:88vh;}
.gmod-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:1.4rem;}
.gmod-avatar{width:72px;height:72px;border-radius:11px;object-fit:cover;object-position:top;border:1px solid var(--border);}
.gmod-avatar-ph{width:72px;height:72px;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:30px;border:1px solid var(--border);}
.gmod-info{flex:1;}
.gmod-name{font-family:'DM Serif Display',serif;font-size:22px;font-style:italic;margin-bottom:3px;}
.gmod-meta{font-size:12px;color:var(--muted2);font-weight:500;margin-bottom:8px;}
.gmod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:480px;overflow-y:auto;padding-right:4px;}
.gmod-film-card{background:var(--s2);border:1px solid var(--border);border-radius:9px;overflow:hidden;cursor:pointer;transition:all .18s;}
.gmod-film-card:hover{border-color:var(--border2);transform:translateY(-2px);}
.gmod-film-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
.gmod-film-no-poster{width:100%;aspect-ratio:2/3;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:20px;}
.gmod-film-body{padding:6px 7px 8px;}
.gmod-film-title{font-size:10px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gmod-film-year{font-size:9px;color:var(--muted2);margin-top:1px;}
.gmod-film-link{display:block;margin-top:5px;padding:4px 8px;background:linear-gradient(135deg,#4f3dc8,#7c6af5);border-radius:5px;text-align:center;color:#fff;font-size:9px;font-weight:800;text-decoration:none;transition:opacity .15s;}
.gmod-film-link:hover{opacity:.85;}

/* MODAL BASE */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(14px);}
.mbg.open{display:flex;}
.modal{background:var(--s1);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:1.75rem;width:530px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:modal-up .26s cubic-bezier(0.34,1.4,0.64,1);box-shadow:0 40px 80px rgba(0,0,0,0.75);}
@keyframes modal-up{from{opacity:0;transform:translateY(26px) scale(0.97)}to{opacity:1;transform:none}}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text);margin-bottom:1.5rem;}
.field{margin-bottom:1.1rem;}
.field label{display:block;font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:7px;}
.field input,.field select{width:100%;padding:10px 13px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;outline:none;transition:all .2s;}
.field input::placeholder{color:var(--muted2);}
.field input:focus,.field select:focus{border-color:var(--accent-border);background:var(--s3);box-shadow:0 0 0 3px rgba(124,106,245,0.08);}
.field select option{background:var(--s2);color:var(--text);}
.field-row{display:flex;gap:8px;}
.field-row input{flex:1;}
.sbtn{padding:10px 14px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;}
.sbtn:hover{border-color:var(--border2);background:var(--s3);}
.status-msg{font-size:11px;color:var(--muted2);margin-top:6px;min-height:16px;font-weight:500;}
.posters-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.poster-opt{width:66px;height:99px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:all .15s;opacity:.55;}
.poster-opt:hover{opacity:1;transform:scale(1.07);}
.poster-opt.sel{border-color:#a78bfa;opacity:1;box-shadow:0 0 14px rgba(167,139,250,0.4);}
.genre-preview{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.gpill{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-weight:600;}
.type-btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.type-btn:hover{border-color:var(--border2);color:var(--text);}
.type-btn.active{background:var(--accent-soft);border-color:var(--accent-border);color:#c4b5fd;}
.modal-actions{display:flex;gap:8px;align-items:center;margin-top:1.5rem;}
.modal-actions-right{display:flex;gap:8px;margin-left:auto;}
.btn-cancel{padding:9px 16px;background:transparent;border:1px solid var(--border);border-radius:9px;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.btn-cancel:hover{border-color:var(--border2);color:var(--text);}
.btn-save{padding:9px 22px;background:linear-gradient(135deg,#4f3dc8,#7c6af5);border:none;border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;}
.btn-save:hover{box-shadow:0 4px 18px rgba(79,61,200,0.45);}
.btn-delete{padding:9px 13px;background:transparent;border:1px solid rgba(239,68,68,0.25);border-radius:9px;color:#f87171;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.btn-delete:hover{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.45);}
.btn-delete-confirm{padding:9px 16px;background:#b91c1c;border:none;border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.current-poster-wrap{display:none;margin-top:10px;}
.current-poster-label{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.8px;font-weight:700;margin-bottom:6px;}
.current-poster-inner{display:flex;align-items:flex-start;gap:10px;}
.current-poster-img{width:58px;border-radius:7px;border:2px solid #a78bfa;box-shadow:0 0 14px rgba(167,139,250,0.4);}
.current-poster-actions{display:flex;flex-direction:column;gap:6px;padding-top:4px;}
.current-poster-hint{font-size:11px;color:var(--muted2);}
.btn-remove-poster{padding:4px 10px;background:transparent;border:1px solid rgba(239,68,68,0.25);border-radius:7px;color:#f87171;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;cursor:pointer;width:fit-content;}
.poster-url-row{display:flex;gap:6px;margin-top:8px;}
.poster-url-row input{flex:1;padding:8px 12px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;transition:all .2s;}
.poster-url-row input:focus{border-color:var(--accent-border);background:var(--s3);}
.link-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.link-row input{padding:10px 13px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:all .2s;}
.link-row input:focus{border-color:var(--accent-border);background:var(--s3);}
.link-row input.link-name{flex:1.2;}
.link-row input.link-url{flex:2;}
.link-row .btn-rm-link{padding:0 10px;background:transparent;border:1px solid rgba(239,68,68,0.25);border-radius:8px;color:#f87171;cursor:pointer;font-size:14px;flex-shrink:0;height:40px;}
.btn-add-link{margin-top:4px;padding:7px 12px;background:transparent;border:1px dashed var(--border);border-radius:8px;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;width:100%;transition:all .15s;}
.btn-add-link:hover{border-color:var(--border2);color:var(--text);}
.saga-posters-grid{display:flex;flex-wrap:wrap;gap:8px;max-height:155px;overflow-y:auto;padding:4px;}
.saga-poster-item{cursor:pointer;text-align:center;width:75px;}
.saga-poster-item img{width:100%;border-radius:6px;border:2px solid transparent;transition:border-color .15s;}
.saga-poster-item img.selected{border-color:#a78bfa;}
.saga-poster-label{font-size:9px;color:var(--muted2);margin-top:3px;}
.collection-link-input{margin-bottom:10px;}
.filmography-list{height:350px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;padding:6px;background:var(--s2);}
.filmo-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);border-radius:8px;cursor:pointer;transition:background .15s;}
.filmo-item:last-child{border-bottom:none;}
.filmo-item:hover{background:rgba(255,255,255,0.03);}
.filmo-item.selected{background:rgba(124,106,245,0.1);}
.filmo-item input[type="checkbox"]{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:#a78bfa;}
.filmo-item img{width:40px;border-radius:5px;flex-shrink:0;}
.filmo-item-info{flex:1;min-width:0;}
.filmo-item-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.filmo-item-year{font-size:11px;color:var(--muted2);margin-top:1px;}
.filmo-item-quality select{background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:10px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;}
/* link selector in filmo import */
.filmo-item-link select{background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:10px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;max-width:140px;}
.collection-import-hint{font-size:11px;color:#fbbf24;padding:8px 10px;background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.2);border-radius:8px;margin-bottom:10px;line-height:1.5;}
.btn-import-selected{margin-top:12px;width:100%;padding:11px;background:linear-gradient(135deg,#4f3dc8,#7c6af5);border:none;border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;}
.btn-import-selected:hover{box-shadow:0 4px 18px rgba(79,61,200,0.45);}

/* FILMO MODAL */
.fmod{width:690px;}
.fmod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;margin-top:1rem;max-height:420px;overflow-y:auto;padding-right:4px;}
.fcard{border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--s2);transition:all .15s;position:relative;}
.fcard:hover{border-color:var(--border2);transform:translateY(-2px);}
.fcard.sel{border-color:#a78bfa;box-shadow:0 0 14px rgba(167,139,250,0.3);}
.fcard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
.fcard-no-poster{width:100%;aspect-ratio:2/3;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:20px;}
.fcard-title{font-size:9px;font-weight:600;color:var(--muted2);padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fcard-year{font-size:8px;color:var(--muted);padding:0 5px 4px;font-weight:500;}
.fcard .fcheck{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:#a78bfa;display:none;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800;}
.fcard.sel .fcheck{display:flex;}
.fmod-bar{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.fmod-count{font-size:12px;color:var(--muted2);font-weight:500;}
.fmod-count strong{color:#a78bfa;}
.fmod-btn{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted2);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;}
.fmod-btn:hover{border-color:var(--border2);color:var(--text);}

/* DETAIL MODAL */
.dmod{width:580px;}
.detail-body{display:flex;gap:1.5rem;}
.detail-poster-wrap img{width:140px;border-radius:11px;box-shadow:0 22px 52px rgba(0,0,0,0.7);flex-shrink:0;}
.detail-no-poster{width:140px;height:210px;background:var(--s2);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--muted);flex-shrink:0;}
.detail-info{flex:1;min-width:0;}
.detail-title{font-family:'DM Serif Display',serif;font-size:21px;color:var(--text);line-height:1.2;margin-bottom:3px;}
.detail-year{font-size:11px;color:var(--muted2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.detail-qbadge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:5px;margin-bottom:11px;letter-spacing:.8px;text-transform:uppercase;}
.detail-qbadge.q4kr{background:var(--c4kr-bg);color:var(--c4kr);border:1px solid rgba(192,132,252,0.25);}
.detail-qbadge.q4kl{background:var(--c4kl-bg);color:var(--c4kl);border:1px solid rgba(74,222,128,0.25);}
.detail-qbadge.q1r{background:var(--c1r-bg);color:var(--c1r);border:1px solid rgba(56,189,248,0.25);}
.detail-qbadge.q1l{background:var(--c1l-bg);color:var(--c1l);border:1px solid rgba(251,146,60,0.25);}
.detail-badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.detail-badge{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:700;}
.detail-badge.r{background:rgba(251,191,36,0.08);color:#fcd34d;border:1px solid rgba(251,191,36,0.18);}
.detail-badge.d{background:rgba(96,165,250,0.08);color:#93c5fd;border:1px solid rgba(96,165,250,0.18);}
.detail-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;}
.detail-btns{display:flex;gap:7px;flex-wrap:wrap;}
.dbtn{display:inline-flex;align-items:center;gap:5px;padding:9px 13px;border-radius:9px;text-decoration:none;font-size:11px;font-weight:800;transition:all .15s;white-space:nowrap;}
.dbtn.lb{background:rgba(0,224,166,0.1);color:#00e0a6;border:1px solid rgba(0,224,166,0.25);}
.dbtn.lb:hover{background:rgba(0,224,166,0.18);}
.dbtn.alloc{background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.25);}
.dbtn.alloc:hover{background:rgba(245,158,11,0.18);}
.dbtn.sub{background:rgba(34,197,94,0.08);color:#4ade80;border:1px solid rgba(34,197,94,0.2);}
.dbtn.sub:hover{background:rgba(34,197,94,0.15);}
.dbtn.watch{background:linear-gradient(135deg,#4f3dc8,#7c6af5);color:#fff;box-shadow:0 4px 12px rgba(79,61,200,0.3);}
.dbtn.watch:hover{box-shadow:0 4px 18px rgba(79,61,200,0.5);}
.no-link{font-size:12px;color:var(--muted);font-style:italic;}
.links-section{display:flex;flex-direction:column;gap:6px;margin-top:10px;}

/* RANDOM MODAL */
.rmod{text-align:center;}
.random-label{font-size:9px;font-weight:800;letter-spacing:3px;color:var(--muted2);margin-bottom:1rem;text-transform:uppercase;}
.random-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:3px;}
.random-meta{font-size:11px;color:var(--muted2);font-weight:600;margin-bottom:1rem;letter-spacing:.5px;text-transform:uppercase;}
.btn-reroll{padding:9px 16px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-reroll:hover{border-color:var(--border2);}

/* FOOTER */
footer{padding:1rem 2rem;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1;}
.btn-footer{padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.5px;text-transform:uppercase;}
.btn-footer:hover{border-color:var(--border2);color:var(--muted2);}

/* RESPONSIVE */
@media(max-width:768px){
  header{padding:.75rem 1rem;height:auto;flex-wrap:wrap;gap:8px;}
  .logo-name{font-size:14px;}
  .search-wrap{order:3;max-width:100%;width:100%;}
  .sync-badge{display:none;}
  .btn-ghost{display:none;}
  .tabs-nav{padding:0 1rem;top:auto;position:relative;}
  .filter-bar{padding:.5rem 1rem;top:auto;position:relative;height:auto;flex-wrap:wrap;gap:5px;row-gap:6px;}
  .bar-sep{display:none;}
  .bar-select{flex:1;min-width:calc(50% - 6px);font-size:12px;padding:6px 10px;}
  .recent-section{padding:.8rem 1rem 0;}
  .results-bar{padding:.6rem 1rem 0;}
  .content,.groups-page{padding:.8rem 1rem 3rem;}
  .genre-bar{padding:.4rem 1rem;}
  .grid{grid-template-columns:repeat(3,1fr);gap:8px;}
  .card .ctags{display:none;}
  .groups-grid{grid-template-columns:1fr;}
  .modal{border-radius:18px 18px 0 0;position:fixed;bottom:0;left:0;right:0;width:100%;max-width:100%;max-height:88vh;padding:1.5rem 1.25rem;animation:modal-up-mob .25s ease;}
  @keyframes modal-up-mob{from{transform:translateY(100%)}to{transform:none}}
  .mbg.open{align-items:flex-end;}
  .dmod,.gmod{width:100%;}
  .detail-body{flex-direction:column;align-items:center;text-align:center;}
  .detail-poster-wrap img{width:115px;}
  .detail-no-poster{width:115px;height:172px;}
  .detail-title{font-size:18px;}
  .detail-btns,.detail-tags,.detail-badges,.links-section{justify-content:center;}
  footer{padding:1rem;justify-content:center;}
}
@media(max-width:480px){
  .logo-name{display:none;}
  .count-badge{display:none;}
}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-logo">Ciné<em>Vault</em></div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🎬</div>
    <div class="logo-name">Ciné<em>Vault</em></div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" id="sb" placeholder="Rechercher dans la bibliothèque..." oninput="onSearch()">
  </div>
  <div class="hdr-right">
    <div class="sync-badge"><div class="sync-dot" id="sdot"></div><span id="slbl">...</span></div>
    <span class="count-badge" id="tc">0</span>
    <button class="btn-ghost" id="size-btn" onclick="toggleSize()" title="Taille des cartes">⊞</button>
    <button class="btn-random" onclick="openRandom()">🎲 Surprise</button>
    <button class="btn-add" onclick="openModal()">+ Ajouter</button>
  </div>
</header>

<!-- TABS -->
<nav class="tabs-nav">
  <button class="tab-btn active" onclick="switchTab('library',this)">📚 Bibliothèque</button>
  <button class="tab-btn" onclick="switchTab('groups',this)">🎭 Regroupements</button>
</nav>

<!-- ═══ TAB: BIBLIOTHÈQUE ═══ -->
<div class="tab-panel active" id="tab-library">
  <div class="filter-bar">
    <button class="chip active" data-q="" onclick="setFilter('',this)">Tout <span class="chip-count" id="cnt-all"></span></button>
    <div class="bar-sep"></div>
    <button class="chip" data-q="4kr" onclick="setFilter('4kr',this)">💎 4K Remux <span class="chip-count" id="cnt-4kr"></span></button>
    <button class="chip" data-q="4kl" onclick="setFilter('4kl',this)">✨ 4K Light <span class="chip-count" id="cnt-4kl"></span></button>
    <button class="chip" data-q="1r"  onclick="setFilter('1r',this)">🍀 1080p Remux <span class="chip-count" id="cnt-1r"></span></button>
    <button class="chip" data-q="1l"  onclick="setFilter('1l',this)">🎬 1080p Light <span class="chip-count" id="cnt-1l"></span></button>
    <div class="bar-sep"></div>
    <button class="chip" id="filter-movie" onclick="setMediaFilter('movie')">🎬 Films <span class="chip-count" id="cnt-movie"></span></button>
    <button class="chip" id="filter-tv"    onclick="setMediaFilter('tv')">📺 Séries <span class="chip-count" id="cnt-tv"></span></button>
    <button class="chip" id="filter-col"   onclick="setMediaFilter('collection')">🎞 Collections <span class="chip-count" id="cnt-col"></span></button>
    <button class="chip" id="filter-saga"  onclick="setMediaFilter('saga')">⚡ Sagas <span class="chip-count" id="cnt-saga"></span></button>
    <div class="bar-sep"></div>
    <select class="bar-select" id="sort-sel" onchange="setSort(this.value)">
      <option value="added">📅 Date ajout</option>
      <option value="alpha">🔤 A → Z</option>
      <option value="date">🗓 Date sortie</option>
      <option value="pop" selected>🔥 Popularité</option>
      <option value="dur">⏱ Durée</option>
      <option value="note">⭐ Note</option>
    </select>
    <button class="bar-select" id="sort-dir-btn" onclick="toggleSortDir()" style="cursor:pointer;font-size:14px;">↓</button>

// ══════════════════════════════════════════════════

function switchTab(name,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='groups') renderGroups();
}

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
function ss(s,l){document.getElementById('sdot').className='sync-dot '+s;document.getElementById('slbl').textContent=l;}
function fmt(m){if(!m)return '';return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');}
function toggleSize(){sizeIdx=(sizeIdx+1)%SIZES.length;document.documentElement.style.setProperty('--card-w',SIZES[sizeIdx]+'px');document.getElementById('size-btn').textContent=sizeIdx===0?'⊞':sizeIdx===1?'⊟':'⊠';}
function setSort(s){srt=s;render();}
function toggleSortDir(){sortDir*=-1;document.getElementById('sort-dir-btn').textContent=sortDir===1?'↓':'↑';render();}
function setMediaFilter(t){mediaFilt=(mediaFilt===t?'':t);render();}
function onSearch(){render();}

function setFilter(f,btn){
  if(f===''){
    filts.clear();
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.style.setProperty('--bg-glow',BG_GLOWS['']);
  } else {
    document.querySelector('.chip[data-q=""]').classList.remove('active');
    if(filts.has(f)){filts.delete(f);btn.classList.remove('active');}
    else{filts.add(f);btn.classList.add('active');}
    if(filts.size===0){
      document.querySelector('.chip[data-q=""]').classList.add('active');
      document.documentElement.style.setProperty('--bg-glow',BG_GLOWS['']);
    } else {
      const last=[...filts][filts.size-1];
      document.documentElement.style.setProperty('--bg-glow',BG_GLOWS[last]||BG_GLOWS['']);
    }
  }
  render();
}

function toggleGenre(g){
  if(!genreInc.has(g)&&!genreExc.has(g))genreInc.add(g);
  else if(genreInc.has(g)){genreInc.delete(g);genreExc.add(g);}
  else genreExc.delete(g);
  render();
}
function clearGenres(){genreInc.clear();genreExc.clear();render();}

function sorted(list){
  const a=[...list],d=sortDir;
  if(srt==='alpha') return a.sort((x,y)=>d*x.title.localeCompare(y.title));
  if(srt==='date')  return a.sort((x,y)=>d*((y.release_date||'').localeCompare(x.release_date||'')));
  if(srt==='pop')   return a.sort((x,y)=>d*((y.popularity||0)-(x.popularity||0)));
  if(srt==='dur')   return a.sort((x,y)=>d*((y.runtime||0)-(x.runtime||0)));
  if(srt==='note')  return a.sort((x,y)=>d*((y.vote_average||0)-(x.vote_average||0)));
  if(srt==='added') return d===1?a:a.reverse();
  return a;
}

// ══════════════════════════════════════════════════
//  GENRES
// ══════════════════════════════════════════════════
function updGenres(){
  const all=new Set(); movies.forEach(m=>(m.tags||[]).forEach(t=>all.add(t)));
  const bar=document.getElementById('genre-bar');
  bar.innerHTML='';
  if(!all.size)return;
  const has=genreInc.size>0||genreExc.size>0;
  const hint=document.createElement('span');hint.className='genre-hint';hint.textContent=has?'🎭':'Genre :';bar.appendChild(hint);
  if(has){const clr=document.createElement('button');clr.className='genre-clear';clr.textContent='Effacer';clr.onclick=clearGenres;bar.appendChild(clr);}
  [...all].sort().forEach(g=>{
    const chip=document.createElement('button');chip.className='gchip';
    if(genreInc.has(g))chip.classList.add('inc');
    if(genreExc.has(g))chip.classList.add('exc');
    chip.textContent=(genreInc.has(g)?'✓ ':genreExc.has(g)?'✕ ':'')+g;
    chip.onclick=()=>toggleGenre(g);
    bar.appendChild(chip);
  });
}

function updCounts(){
  document.getElementById('cnt-all').textContent=movies.length;
  ['4kr','4kl','1r','1l'].forEach(q=>{const el=document.getElementById('cnt-'+q);if(el)el.textContent=movies.filter(m=>m.quality===q).length;});
  const ids={movie:'cnt-movie',tv:'cnt-tv',collection:'cnt-col',saga:'cnt-saga'};
  Object.entries(ids).forEach(([t,id])=>{const el=document.getElementById(id);if(el)el.textContent=movies.filter(m=>(m.media_type||'movie')===t).length;});
}

// ══════════════════════════════════════════════════
//  RECENT
// ══════════════════════════════════════════════════
function renderRecent(){
  const sec=document.getElementById('recent-section');
  if(filts.size>0||genreInc.size>0||genreExc.size>0||mediaFilt||document.getElementById('sb').value.trim()){sec.innerHTML='';return;}
  const recent=[...movies].slice(-50).sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,15);
  if(!recent.length){sec.innerHTML='';return;}
  sec.innerHTML=`<div class="recent-header"><div class="recent-title">🔥 Populaires — récemment ajoutés</div><div class="recent-line"></div></div>
  <div class="recent-grid">${recent.map(m=>{
    const idx=movies.indexOf(m);
    const icon=m.media_type==='tv'?'📺':m.media_type==='collection'?'🎞':m.media_type==='saga'?'⚡':'🎬';
    return `<div class="recent-card" onclick="openDetail(event,${idx})">${m.poster?`<img src="${m.poster}" loading="lazy" alt="${m.title}">`:`<div class="rc-no-poster">${icon}</div>`}<div class="rc-title">${m.title}</div></div>`;
  }).join('')}</div>`;
}

// ══════════════════════════════════════════════════
//  RENDER GRID
// ══════════════════════════════════════════════════
function render(){
  updGenres();updCounts();renderRecent();
  const q=document.getElementById('sb').value.toLowerCase().trim();
  const ct=document.getElementById('ct');
  document.getElementById('tc').textContent=movies.length+(movies.length>1?' films':' film');
  ct.innerHTML='';
  let list=[...movies];
  if(filts.size>0)list=list.filter(m=>filts.has(m.quality));
  if(mediaFilt)list=list.filter(m=>(m.media_type||'movie')===mediaFilt);
  if(genreInc.size>0)list=list.filter(m=>[...genreInc].every(g=>(m.tags||[]).includes(g)));
  if(genreExc.size>0)list=list.filter(m=>[...genreExc].every(g=>!(m.tags||[]).includes(g)));
  if(q)list=list.filter(m=>m.title.toLowerCase().includes(q));
  list=sorted(list);
  const filtLabel=filts.size>0?[...filts].map(f=>QLABEL[f]).join(', '):'';
  const gLabel=[[...genreInc].map(g=>'✓'+g),[...genreExc].map(g=>'✕'+g)].flat().join(' ');
  document.getElementById('rlabel').innerHTML=`Affichage de <strong>${list.length}</strong> film${list.length>1?'s':''}${filtLabel?' — <strong>'+filtLabel+'</strong>':''}${gLabel?' — '+gLabel:''}${q?' — <strong>"'+q+'"</strong>':''}`;
  if(!list.length){
    ct.innerHTML=`<div class="empty"><div class="empty-icon">🎬</div><div class="empty-title">${q?'Aucun résultat':'Bibliothèque vide'}</div><div class="empty-sub">${q?'Essayez un autre terme':'Cliquez sur "+ Ajouter" pour commencer'}</div></div>`;
    return;
  }
  const grid=document.createElement('div');grid.className='grid';
  const frag=document.createDocumentFragment();
  list.forEach((m,i)=>{
    const idx=movies.indexOf(m);
    const year=m.release_date?m.release_date.slice(0,4):'';
    const dur=fmt(m.runtime);
    const rating=m.vote_average?'⭐ '+m.vote_average.toFixed(1):'';
    const sub=[year,dur].filter(Boolean).join(' · ');
    const tagsHtml=m.tags&&m.tags.length?m.tags.slice(0,2).map(t=>`<span class="ctag">${t}</span>`).join(''):'';
    const isCol=m.media_type==='collection',isSaga=m.media_type==='saga';
    const typeIcon=isCol?'🎞':isSaga?'⚡':m.media_type==='tv'?'📺':'';
    const card=document.createElement('div');
    card.className=`card ${m.quality}${isCol?' collection':''}${isSaga?' collection':''}`;
    card.style.animationDelay=(Math.min(i,30)*0.022)+'s';
    card.onclick=e=>{if(!e.target.closest('.detail-btn'))openDetail(e,idx);};
    let posterHtml;
    if(isCol||isSaga){
      posterHtml=`<div class="col-portrait-wrap">`+(m.poster?`<img class="col-portrait" loading="lazy" src="${m.poster}" alt="${m.title}" onerror="this.outerHTML='<div class=&quot;no-portrait&quot;>${isCol?'🎞':'⚡'}</div>'">`:`<div class="no-portrait">${isCol?'🎞':'⚡'}</div>`)+`<div class="col-name-overlay"><div class="col-role">${isSaga?'Saga':(m.person_role||'Collection')}</div></div></div>`;
    } else {
      posterHtml=`<div class="poster-wrap">`+(m.poster?`<img class="cposter" loading="lazy" src="${m.poster}" alt="${m.title}" onerror="this.outerHTML='<div class=&quot;no-poster ${m.quality}&quot;>🎬</div>'">`:`<div class="no-poster ${m.quality}">🎬</div>`)+(rating?`<div class="c-rating">${rating}</div>`:'')+`<div class="card-overlay"><div class="cov-play">▶</div>${year?`<div class="cov-year">${year}</div>`:''}</div></div>`;
    }
    card.innerHTML=posterHtml+`<div class="cbody"><div class="ctitle">${typeIcon?typeIcon+' ':''}${m.title}</div>${sub&&!isCol&&!isSaga?`<div class="csub">${sub}</div>`:''}<div class="cfoot"><div class="ctags">${tagsHtml}</div><span class="qbadge ${m.quality}" title="${QLABEL[m.quality]||''}">${QICON[m.quality]||''}</span></div></div><button class="detail-btn" onclick="openDetail(event,${idx})">⋯</button>`;
    frag.appendChild(card);
  });
  grid.appendChild(frag);ct.appendChild(grid);
}

// ══════════════════════════════════════════════════
//  DETAIL MODAL  — FIX: links always shown
// ══════════════════════════════════════════════════
function openDetail(e,idx){
  e.preventDefault();e.stopPropagation();
  const m=movies[idx];
  const year=m.release_date?m.release_date.slice(0,4):'';
  const dur=fmt(m.runtime);
  const rating=m.vote_average?'⭐ '+m.vote_average.toFixed(1):'';
  const ql=QLABEL[m.quality]||m.quality;
  const qi=QICON[m.quality]||'';
  const isTV=m.media_type==='tv';
  const lbUrl=m.tmdb_id?(isTV?`https://letterboxd.com/search/${encodeURIComponent(m.title)}/`:`https://letterboxd.com/tmdb/${m.tmdb_id}/`):'';
  const allocUrl=`https://www.allocine.fr/rechercher/?q=${encodeURIComponent(m.title)}`;
  const subUrl=`https://www.opensubtitles.com/fr/search-all/q-${encodeURIComponent(m.title)}/hearing_impaired-include/machine_translated-exclude/trusted_sources-include`;

  // Build links — normalise old format + new format
  let links=[];
  if(m.links&&Array.isArray(m.links)&&m.links.length){
    links=m.links.filter(l=>l&&l.url);
  } else if(m.link&&m.link.trim()){
    links=[{name:'Ouvrir',url:m.link}];
  }
  const linksHtml=links.length
    ?`<div class="links-section">`+links.map(l=>`<a class="dbtn watch" href="${escHtml(l.url)}" target="_blank" rel="noopener">▶ ${escHtml(l.name||'Ouvrir le lien')}</a>`).join('')+`</div>`
    :`<span class="no-link">Aucun lien ajouté</span>`;

  document.getElementById('dcont').innerHTML=`
    <div class="detail-body">
      <div class="detail-poster-wrap">${m.poster?`<img src="${m.poster}" alt="${escHtml(m.title)}">`:`<div class="detail-no-poster">${isTV?'📺':'🎬'}</div>`}</div>
      <div class="detail-info">
        <div class="detail-title">${isTV?'📺 ':''}${escHtml(m.title)}</div>
        ${year?`<div class="detail-year">${year}</div>`:''}
        <span class="detail-qbadge ${m.quality}">${qi} ${ql}</span>
        <div class="detail-badges">
          ${rating?`<span class="detail-badge r">${rating}</span>`:''}
          ${dur?`<span class="detail-badge d">⏱ ${dur}</span>`:''}
        </div>
        ${m.tags&&m.tags.length?`<div class="detail-tags">${m.tags.map(t=>`<span class="gpill">${escHtml(t)}</span>`).join('')}</div>`:''}
        <div class="detail-btns">
          ${lbUrl?`<a class="dbtn lb" href="${lbUrl}" target="_blank" rel="noopener">🎞 Letterboxd</a>`:''}
          <a class="dbtn alloc" href="${allocUrl}" target="_blank" rel="noopener">🎬 Allociné</a>
          <a class="dbtn sub" href="${subUrl}" target="_blank" rel="noopener">💬 Sous-titres</a>
        </div>
        ${linksHtml}
      </div>
    </div>
    <div class="modal-actions" style="margin-top:1.5rem">
      <button class="btn-delete" onclick="closeDet();openEdit(null,${idx})">✎ Modifier</button>
      <div class="modal-actions-right"><button class="btn-cancel" onclick="closeDet()">Fermer</button></div>
    </div>`;
  document.getElementById('dmod').classList.add('open');
}
function closeDet(){document.getElementById('dmod').classList.remove('open');}
document.getElementById('dmod').addEventListener('click',e=>{if(e.target===document.getElementById('dmod'))closeDet();});
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ══════════════════════════════════════════════════
//  RANDOM MODAL
// ══════════════════════════════════════════════════
function openRandom(){
  if(!movies.length)return;
  let pool=[...movies];
  if(filts.size>0)pool=pool.filter(m=>filts.has(m.quality));
  if(mediaFilt)pool=pool.filter(m=>(m.media_type||'movie')===mediaFilt);

  const m=pool[Math.floor(Math.random()*pool.length)];
  const year=m.release_date?m.release_date.slice(0,4):'';
  const dur=fmt(m.runtime);
  const meta2=[year,dur,m.vote_average?'⭐ '+m.vote_average.toFixed(1):''].filter(Boolean).join(' · ');

    <div class="random-meta">${meta2}</div>
    ${m.tags&&m.tags.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:1rem">${m.tags.map(t=>`<span class="gpill">${escHtml(t)}</span>`).join('')}</div>`:''}
    <div style="margin-top:.75rem;display:flex;gap:7px;justify-content:center;flex-wrap:wrap">
      <button class="btn-reroll" onclick="openRandom()">🎲 Autre</button>
      ${lbUrl?`<a class="dbtn lb" href="${lbUrl}" target="_blank">🎞 Letterboxd</a>`:''}
      <a class="dbtn alloc" href="${allocUrl}" target="_blank">🎬 Allociné</a>

    </div>
    <div style="margin-top:1rem"><button class="btn-cancel" onclick="closeRnd()">Fermer</button></div>`;

function renderColLinks(){

    const rb=document.createElement('button');rb.className='btn-rm-link';rb.textContent='✕';rb.onclick=()=>{colLinks.splice(i,1);renderColLinks();};
    row.appendChild(ni);row.appendChild(ui);row.appendChild(rb);
    c.appendChild(row);
  });
  if(!colLinks.length){const row=document.createElement('div');row.className='link-row';const ni=document.createElement('input');ni.type='text';ni.className='link-name link-input';ni.placeholder='Nom (ex: Ma collection)';const ui=document.createElement('input');ui.type='text';ui.className='link-url link-input';ui.placeholder='https://...';ni.oninput=()=>{if(!colLinks.length)colLinks.push({name:'',url:''});colLinks[0].name=ni.value;};ui.oninput=()=>{if(!colLinks.length)colLinks.push({name:'',url:''});colLinks[0].url=ui.value;};row.appendChild(ni);row.appendChild(ui);c.appendChild(row);}
}
function getColLinks(){
  // Also scan DOM in case user typed without triggering oninput race
  const rows=document.querySelectorAll('#col-links-container .link-row');
  const result=[];
  rows.forEach(row=>{
    const name=(row.querySelector('.link-name')||{}).value||'';
    const url=(row.querySelector('.link-url')||{}).value||'';
    if(url.trim())result.push({name:name.trim(),url:url.trim()});
  });
  return result;
}

function renderFilmographyList(){
  const container=document.getElementById('filmography-list');if(!container)return;
  container.innerHTML='';
  if(!currentFilmography.length){container.innerHTML='<div style="text-align:center;padding:2rem;color:var(--muted2)">Aucun film trouvé</div>';return;}

  currentFilmography.forEach((item,idx)=>{
    const movie=item.movie;
    const div=document.createElement('div');div.className='filmo-item'+(item.selected?' selected':'');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=item.selected;
    cb.addEventListener('change',()=>{item.selected=cb.checked;div.classList.toggle('selected',item.selected);});
    const img=document.createElement('img');img.src=`https://image.tmdb.org/t/p/w92${movie.poster_path}`;img.alt=movie.title;img.loading='lazy';
    const info=document.createElement('div');info.className='filmo-item-info';
    info.innerHTML=`<div class="filmo-item-title">${escHtml(movie.title)}</div><div class="filmo-item-year">${movie.release_date?movie.release_date.slice(0,4):'N/A'}</div>`;
    const qualWrap=document.createElement('div');qualWrap.className='filmo-item-quality';
    const sel=document.createElement('select');sel.innerHTML=`<option value="4kr"${item.quality==='4kr'?' selected':''}>💎 4K</option><option value="4kl"${item.quality==='4kl'?' selected':''}>✨ 4KL</option><option value="1r"${item.quality==='1r'?' selected':''}>🍀 1080R</option><option value="1l"${item.quality==='1l'?' selected':''}>🎬 1080L</option>`;
    sel.addEventListener('change',()=>{item.quality=sel.value;});
    qualWrap.appendChild(sel);
    div.addEventListener('click',e=>{if(e.target===cb||e.target===sel||e.target.tagName==='OPTION'||e.target.closest('.filmo-item-quality')||e.target.closest('.filmo-item-link'))return;cb.checked=!cb.checked;item.selected=cb.checked;div.classList.toggle('selected',item.selected);});
    div.appendChild(cb);div.appendChild(img);div.appendChild(info);div.appendChild(qualWrap);
    // Link selector (only if multiple links available)
    if(availLinks.length>1){
      const linkWrap=document.createElement('div');linkWrap.className='filmo-item-link';
      const ls=document.createElement('select');
      ls.innerHTML=`<option value="-1">— Aucun lien —</option>`+availLinks.map((l,i)=>`<option value="${i}"${item.linkIdx===i?' selected':''}>${escHtml(l.name||l.url.slice(0,25))}</option>`).join('');
      ls.addEventListener('change',()=>{item.linkIdx=parseInt(ls.value);});
      if(item.linkIdx===-1&&availLinks.length===1)item.linkIdx=0; // auto-select if only one
      linkWrap.appendChild(ls);div.appendChild(linkWrap);
    } else if(availLinks.length===1){item.linkIdx=0;} // auto assign single link
    container.appendChild(div);
  });
}

async function importSelectedFilms(){
  const availLinks=getColLinks();
  const toImport=currentFilmography.filter(item=>item.selected);
  if(!toImport.length){alert('Aucun film sélectionné.');return;}
  let imported=0;
  ss('loading',`Import 0/${toImport.length}...`);
  for(const item of toImport){
    const movie=item.movie;
    const quality=item.quality;
    const poster=movie.poster_path?`https://image.tmdb.org/t/p/w342${movie.poster_path}`:'';
    let runtime=0;
    try{const d=await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${TK}`);const data=await d.json();runtime=data.runtime||0;}catch(e){}
    // Determine which link to assign
    let assignedLinks=[];let assignedLink='';
    if(availLinks.length>0){
      const linkIdx=item.linkIdx!=null?item.linkIdx:(availLinks.length===1?0:-1);
      if(linkIdx>=0&&linkIdx<availLinks.length){
        assignedLinks=[availLinks[linkIdx]];
        assignedLink=availLinks[linkIdx].url;
      } else if(availLinks.length===1){
        assignedLinks=[availLinks[0]];
        assignedLink=availLinks[0].url;
      }
    }
    const newMovie={title:movie.title,link:assignedLink,links:assignedLinks,quality,poster,release_date:movie.release_date||'',popularity:movie.popularity||0,vote_average:movie.vote_average||0,tags:[],runtime,tmdb_id:movie.id,media_type:'movie',person_role:''};
    await addM(newMovie);
    imported++;ss('loading',`Import ${imported}/${toImport.length}...`);
  }
  ss('ok',`${imported} film(s) importé(s) !`);
  alert(`✅ ${imported} film(s) importé(s) avec succès.`);
  currentFilmography=[];colLinks=[];
  document.getElementById('filmography-list').innerHTML='';
  document.getElementById('status').textContent='';
  renderColLinks();
  render();
}

async function searchFilmo(){

async function loadFilmo(personId,name,dept){
  const st=document.getElementById('filmo-status');st.textContent=`Chargement de la filmographie de ${name}...`;
  try{
    const res=await fetch(`https://api.themoviedb.org/3/person/${personId}/combined_credits?api_key=${TK}&language=fr-FR`);
    const data=await res.json();
    let cast=(data.cast||[]).filter(m=>m.media_type==='movie'&&m.poster_path);
    cast.sort((a,b)=>(b.release_date||'').localeCompare(a.release_date||''));cast=cast.slice(0,200);
    if(!cast.length){st.textContent='Aucun film trouvé.';return;}

//  REGROUPEMENTS TAB
// ══════════════════════════════════════════════════
function computeGroups(){
  const actors={};  // tmdb_id of collection-type cards → their films
  const sagas={};   // saga-type cards → their films

  // Step 1 — collect explicit collection / saga entries
  movies.forEach(m=>{
    if(m.media_type==='collection'){
      actors[m._id]=actors[m._id]||{meta:m,films:[]};
    }
    if(m.media_type==='saga'){
      sagas[m._id]=sagas[m._id]||{meta:m,films:[]};
    }
  });

  // Step 2 — group plain movies that share a link with a collection card
  movies.forEach(m=>{
    if((m.media_type||'movie')!=='movie'&&m.media_type!=='tv')return;
    const mLinks=((m.links&&m.links.length?m.links:[])
      .map(l=>l.url).filter(Boolean));
    if(m.link)mLinks.push(m.link);
    const uniqueMLinks=[...new Set(mLinks)];
    if(!uniqueMLinks.length)return;
    // Find collection cards sharing a link
    movies.forEach(col=>{
      if(col.media_type!=='collection')return;
      const colLinks2=((col.links&&col.links.length?col.links:[]).map(l=>l.url).filter(Boolean));
      if(col.link)colLinks2.push(col.link);
      const shared=uniqueMLinks.some(u=>colLinks2.includes(u));
      if(shared){
        if(!actors[col._id])actors[col._id]={meta:col,films:[]};
        if(!actors[col._id].films.find(f=>f._id===m._id))actors[col._id].films.push(m);
      }
    });
    // Find saga cards
    movies.forEach(saga=>{
      if(saga.media_type!=='saga')return;
      const sagaLinks=((saga.links&&saga.links.length?saga.links:[]).map(l=>l.url).filter(Boolean));
      if(saga.link)sagaLinks.push(saga.link);
      const shared=uniqueMLinks.some(u=>sagaLinks.includes(u));
      if(shared){
        if(!sagas[saga._id])sagas[saga._id]={meta:saga,films:[]};
        if(!sagas[saga._id].films.find(f=>f._id===m._id))sagas[saga._id].films.push(m);
      }
    });
  });

  // Step 3 — also auto-detect actors/directors from movies with person_role/tmdb link patterns
  // Group movies that share same link(s) even without a collection card, if 3+
  const linkGroups={};
  movies.forEach(m=>{
    if((m.media_type||'movie')!=='movie'&&m.media_type!=='tv')return;
    const mLinks=((m.links&&m.links.length?m.links:[]).map(l=>l.url).filter(Boolean));
    if(m.link)mLinks.push(m.link);
    [...new Set(mLinks)].forEach(u=>{
      if(!linkGroups[u])linkGroups[u]=[];
      if(!linkGroups[u].find(f=>f._id===m._id))linkGroups[u].push(m);
    });
  });
  // Link groups with 3+ films that don't already have a collection card → auto-group
  const autoActors=[];
  Object.entries(linkGroups).forEach(([url,films])=>{
    if(films.length<3)return;
    // Check if already covered by an explicit collection card
    const covered=movies.some(col=>col.media_type==='collection'&&(col.link===url||(col.links||[]).some(l=>l.url===url)));
    if(covered)return;
    // Check if covered by saga card
    const sagaCovered=movies.some(col=>col.media_type==='saga'&&(col.link===url||(col.links||[]).some(l=>l.url===url)));
    if(sagaCovered)return;
    autoActors.push({url,films:[...films].sort((a,b)=>(b.release_date||'').localeCompare(a.release_date||''))});
  });

  return {actorGroups:Object.values(actors),sagaGroups:Object.values(sagas),autoGroups:autoActors};
}

function renderGroups(){
  const page=document.getElementById('groups-page');
  const {actorGroups,sagaGroups,autoGroups}=computeGroups();
  page.innerHTML='';

  // ── Saga groups ────────────────────────────────
  const visibleSagas=sagaGroups.filter(g=>g.meta&&g.films.length>0);
  if(visibleSagas.length||sagaGroups.length){
    page.appendChild(makeSectionTitle('⚡ Sagas',visibleSagas.length||sagaGroups.length));
    const grid=document.createElement('div');grid.className='groups-grid';
    const items=sagaGroups.length?sagaGroups:[];
    if(!items.length){const e=document.createElement('div');e.style.cssText='color:var(--muted2);font-size:13px;padding:.5rem 0';e.textContent='Aucune saga — ajoutez une carte Saga pour voir vos regroupements ici.';page.appendChild(e);}
    items.forEach(g=>grid.appendChild(makeGroupCard(g,'saga')));
    page.appendChild(grid);
  }

  // ── Actor / Director groups from explicit collection cards ────
  const visibleActors=actorGroups.filter(g=>g.meta&&g.films.length>0);
  if(actorGroups.length){
    page.appendChild(makeSectionTitle('🎞 Collections — Acteurs & Réalisateurs',actorGroups.length));
    const grid=document.createElement('div');grid.className='groups-grid';
    actorGroups.forEach(g=>grid.appendChild(makeGroupCard(g,'actor')));
    page.appendChild(grid);
  }

  // ── Auto-detected groups (3+ films sharing same link, no card) ────
  if(autoGroups.length){
    page.appendChild(makeSectionTitle('🤖 Regroupements automatiques (3+ films · même lien)',autoGroups.length));
    const hint=document.createElement('div');hint.style.cssText='font-size:11px;color:var(--muted2);margin-bottom:1rem;';hint.textContent='Ces films partagent le même lien mais n\'ont pas encore de carte Collection ou Saga associée.';page.appendChild(hint);
    const grid=document.createElement('div');grid.className='groups-grid';
    autoGroups.forEach(g=>grid.appendChild(makeAutoGroupCard(g)));
    page.appendChild(grid);
  }

  if(!actorGroups.length&&!sagaGroups.length&&!autoGroups.length){
    page.innerHTML=`<div class="groups-empty"><div class="groups-empty-icon">🎭</div><div class="groups-empty-title">Aucun regroupement détecté</div><div class="groups-empty-sub">Ajoutez des cartes Collection ou Saga, ou importez des films via une collection pour voir les regroupements apparaître ici.</div></div>`;
  }
}

function makeGroupCard(g,type){
  const card=document.createElement('div');
  card.className=`group-card ${type==='saga'?'saga-group':'actor-group'}`;
  const films=g.films.slice().sort((a,b)=>(b.release_date||'').localeCompare(a.release_date||''));
  const m=g.meta;
  const roleLabel=type==='saga'?'Saga':(m.person_role&&m.person_role.includes('Direct')?'Réalisateur':'Acteur');
  const badgeClass=type==='saga'?'saga':(roleLabel==='Réalisateur'?'director':'actor');
  const avatarHtml=m.poster?`<img class="group-avatar" src="${m.poster}" alt="${escHtml(m.title)}">`:`<div class="group-avatar-placeholder">${type==='saga'?'⚡':'🎞'}</div>`;
  const topN=films.slice(0,4);
  const moreCount=films.length>4?films.length-3:0;
  const postersHtml=topN.slice(0,moreCount?3:4).map(f=>`<div class="group-poster-mini">${f.poster?`<img src="${f.poster}" alt="${escHtml(f.title)}" loading="lazy">`:`<div style="width:100%;height:100%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:14px">🎬</div>`}</div>`).join('')+(moreCount?`<div class="group-poster-more">+${moreCount}</div>`:'');
  card.innerHTML=`<div class="group-header">${avatarHtml}<div class="group-info"><div class="group-name">${escHtml(m.title)}</div><div class="group-meta">${films.length} film${films.length>1?'s':''}</div><span class="group-badge ${badgeClass}">${roleLabel}</span></div></div><div class="group-posters">${postersHtml}</div>`;
  card.onclick=()=>openGroupDetail(g,type);
  return card;
}

function makeAutoGroupCard(g){
  const card=document.createElement('div');card.className='group-card actor-group';
  const films=g.films.slice(0,4);
  const moreCount=g.films.length>4?g.films.length-3:0;

  card.innerHTML=`<div class="group-header"><div class="group-avatar-placeholder">🔗</div><div class="group-info"><div class="group-name" style="font-size:12px">${escHtml(shortUrl)}</div><div class="group-meta">${g.films.length} films partagent ce lien</div><span class="group-badge actor">Auto</span></div></div><div class="group-posters">${postersHtml}</div>`;

}
function exportData(){
  const blob=new Blob([JSON.stringify(movies,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cinevault-backup.json';a.click();
}
async function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);if(!Array.isArray(data)){alert('Fichier invalide.');return;}
      const dupes=data.filter(m=>movies.some(ex=>(m.tmdb_id&&ex.tmdb_id&&m.tmdb_id===ex.tmdb_id)||(m.title&&ex.title&&m.title.toLowerCase()===ex.title.toLowerCase())));
      const newItems=data.filter(m=>!dupes.includes(m));
      let msg=`Importer ${newItems.length} film(s) ?`;
      if(dupes.length)msg+=`\n(${dupes.length} doublon(s) ignoré(s))`;
      if(!newItems.length){alert('Aucun nouveau film.');event.target.value='';return;}
      if(confirm(msg)){for(const m of newItems)await addM(m);}
      event.target.value='';
    }catch(err){alert('Erreur de lecture.');}
  };
  reader.readAsText(file);
}

// ══════════════════════════════════════════════════
//  SUPABASE CRUD
// ══════════════════════════════════════════════════
async function load(){
  ss('loading','Chargement...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies?select=*&order=created_at.asc`,{headers:H});
    if(!r.ok)throw new Error();
    movies=(await r.json()).map(row=>({...row.data,_id:row.id}));
    ss('ok','Synchronisé');document.getElementById('loading-screen').style.display='none';render();
  }catch(e){ss('error','Erreur');document.getElementById('loading-screen').style.display='none';render();}
}
async function addM(m){
  ss('loading','Enregistrement...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies`,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({data:m})});
    if(!r.ok)throw new Error();
    m._id=(await r.json())[0].id;movies.push(m);ss('ok','Synchronisé');render();
  }catch(e){ss('error','Erreur enregistrement');}
}
async function updM(idx,m){
  const id=movies[idx]._id;ss('loading','Mise à jour...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies?id=eq.${id}`,{method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({data:m})});
    if(!r.ok)throw new Error();
    m._id=id;movies[idx]=m;ss('ok','Synchronisé');render();
  }catch(e){ss('error','Erreur mise à jour');}
}
async function delM(idx){
  const id=movies[idx]._id;ss('loading','Suppression...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies?id=eq.${id}`,{method:'DELETE',headers:H});
    if(!r.ok)throw new Error();
    movies.splice(idx,1);ss('ok','Synchronisé');render();closeModal();
  }catch(e){ss('error','Erreur suppression');}
}

load();
</script>
