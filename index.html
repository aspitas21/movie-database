<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CINEMA ARCHIVE · Médiathèque</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a10;
            --surface: #12121c;
            --surface-hover: #1e1e2a;
            --border: rgba(255,255,255,0.08);
            --border-active: rgba(255,255,255,0.2);
            --text: #f0f0f0;
            --text-muted: #8888aa;
            --accent: #c084fc;
            --accent-glow: rgba(192,132,252,0.2);
            --danger: #ff4d4d;
            --success: #4ade80;
            --warning: #fbbf24;
            --card-width: 170px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,16,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 2rem;
            color: var(--text);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge {
            background: var(--surface);
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
        }

        button {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: var(--surface-hover);
            border-color: var(--border-active);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: #d8b4fe;
            transform: translateY(-1px);
        }

        /* Filtres */
        .filters-bar {
            padding: 0.8rem 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            position: sticky;
            top: 70px;
            z-index: 99;
        }

        .chip {
            padding: 0.3rem 0.9rem;
            border-radius: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
        }

        .chip.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .genre-bar {
            padding: 0.5rem 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
        }

        .genre-chip {
            background: var(--surface);
            border-radius: 2rem;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }

        .genre-chip.inc {
            background: var(--accent);
            color: #000;
        }

        .genre-chip.exc {
            background: rgba(255,77,77,0.2);
            color: var(--danger);
            text-decoration: line-through;
        }

        /* Grille */
        .content {
            padding: 1.5rem 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            gap: 1.2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.4);
            border-color: var(--border-active);
        }

        .poster {
            aspect-ratio: 2/3;
            width: 100%;
            object-fit: cover;
            display: block;
        }

        .no-poster {
            aspect-ratio: 2/3;
            background: var(--surface-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .card-body {
            padding: 0.6rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .quality {
            font-size: 0.7rem;
            font-weight: 800;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 1.5rem;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid var(--border-active);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.8rem;
            color: var(--text);
            font-family: inherit;
        }

        .poster-grid {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
        }

        .poster-option {
            width: 70px;
            cursor: pointer;
            border-radius: 0.5rem;
            border: 2px solid transparent;
        }

        .poster-option.selected {
            border-color: var(--accent);
        }

        .link-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .footer-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .external-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .external-link {
            background: rgba(255,255,255,0.05);
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            text-decoration: none;
            color: var(--accent);
            transition: 0.1s;
        }
        .external-link:hover {
            background: var(--accent-glow);
        }

        @media (max-width: 700px) {
            header { padding: 0.8rem; }
            .filters-bar, .genre-bar, .content { padding-left: 1rem; padding-right: 1rem; }
            .grid { gap: 0.8rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🎬 CINEMA ARCHIVE</div>
    <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un film...">
    </div>
    <div class="stats">
        <span class="badge" id="movieCount">0</span>
        <button id="addMovieBtn">+ Ajouter</button>
        <button id="exportBtn">⬇ Export</button>
        <button id="importBtn">⬆ Import</button>
        <button id="letterboxdExportBtn" class="btn-primary" style="background:#00e5ff; color:#000;">🎞 Export Letterboxd</button>
    </div>
</header>

<div class="filters-bar" id="filtersBar"></div>
<div class="genre-bar" id="genreBar"></div>

<div class="content" id="content">
    <div class="grid" id="grid"></div>
</div>

<!-- Modal Add/Edit -->
<div id="movieModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Ajouter un film</h2>
            <button id="closeModalBtn">✕</button>
        </div>
        <div class="form-group">
            <label>Type</label>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button type="button" data-type="movie" class="type-btn active">🎬 Film</button>
                <button type="button" data-type="tv" class="type-btn">📺 Série</button>
                <button type="button" data-type="collection" class="type-btn">🎞 Collection</button>
                <button type="button" data-type="saga" class="type-btn">⚡ Saga</button>
            </div>
        </div>
        <div class="form-group">
            <label>Titre</label>
            <input type="text" id="movieTitle" placeholder="Titre du film / série / collection">
        </div>
        <div class="form-group">
            <label>Qualité</label>
            <select id="movieQuality">
                <option value="4kr">💎 4K Remux</option>
                <option value="4kl">✨ 4K Light</option>
                <option value="1r">🍀 1080p Remux</option>
                <option value="1l">🎬 1080p Light</option>
            </select>
        </div>
        <div class="form-group">
            <label>Poster (URL ou recherche TMDB)</label>
            <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="posterUrl" placeholder="URL directe">
                <button id="searchTmdbBtn">Rechercher</button>
            </div>
            <div id="tmdbResults" class="poster-grid"></div>
            <img id="currentPosterPreview" style="max-width: 80px; margin-top: 0.5rem; border-radius: 0.5rem;" />
        </div>
        <div class="form-group">
            <label>Liens personnalisés (streaming / bande-annonce)</label>
            <div id="linksContainer"></div>
            <button id="addLinkBtn" style="width: 100%; margin-top: 0.3rem;">+ Ajouter un lien</button>
        </div>
        <div class="footer-buttons">
            <button id="cancelModalBtn">Annuler</button>
            <button id="saveMovieBtn" class="btn-primary">Sauvegarder</button>
            <button id="deleteMovieBtn" style="background: rgba(255,77,77,0.2); border-color: var(--danger); color: var(--danger); display: none;">Supprimer</button>
        </div>
    </div>
</div>

<script>
    // ---------- Configuration Supabase ----------
    const SU = 'https://dnzrpvyeiyxplrcomsuo.supabase.co';
    const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuenJwdnllaXl4cGxyY29tc3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzYwNTAsImV4cCI6MjA5NTExMjA1MH0.BwuZBjZXQcJlNsaQ_DYSj_n-IbMZswsgL_VuGOVMVs4';
    const TMDB_KEY = '4dc76b66e8b41dd652e56c6cc3a425ab';
    const HEADERS = { 'Content-Type': 'application/json', 'apikey': SK, 'Authorization': `Bearer ${SK}` };

    let movies = [];
    let editIndex = null;
    let currentMediaType = 'movie';
    let currentPoster = '';
    let currentTmdbResults = [];
    let currentLinks = [];

    // Filtres
    let qualityFilters = new Set();
    let mediaTypeFilters = new Set();
    let genreInc = new Set();
    let genreExc = new Set();
    let searchQuery = '';

    // DOM
    const gridEl = document.getElementById('grid');
    const movieCountEl = document.getElementById('movieCount');
    const filtersBar = document.getElementById('filtersBar');
    const genreBar = document.getElementById('genreBar');
    const searchInput = document.getElementById('searchInput');
    const addMovieBtn = document.getElementById('addMovieBtn');
    const modal = document.getElementById('movieModal');
    const modalTitle = document.getElementById('modalTitle');
    const movieTitleInput = document.getElementById('movieTitle');
    const movieQualitySelect = document.getElementById('movieQuality');
    const posterUrlInput = document.getElementById('posterUrl');
    const searchTmdbBtn = document.getElementById('searchTmdbBtn');
    const tmdbResultsDiv = document.getElementById('tmdbResults');
    const currentPosterPreview = document.getElementById('currentPosterPreview');
    const linksContainer = document.getElementById('linksContainer');
    const addLinkBtn = document.getElementById('addLinkBtn');
    const saveMovieBtn = document.getElementById('saveMovieBtn');
    const cancelModalBtn = document.getElementById('cancelModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const deleteMovieBtn = document.getElementById('deleteMovieBtn');
    const typeBtns = document.querySelectorAll('.type-btn');

    // ---------- Chargement ----------
    async function loadMovies() {
        try {
            const res = await fetch(`${SU}/rest/v1/movies?select=*&order=created_at.asc`, { headers: HEADERS });
            if (!res.ok) throw new Error();
            const data = await res.json();
            movies = data.map(row => ({ ...row.data, _id: row.id }));
            localStorage.setItem('movies_backup', JSON.stringify(movies));
        } catch (e) {
            const backup = localStorage.getItem('movies_backup');
            if (backup) movies = JSON.parse(backup);
            else movies = [];
        }
        render();
    }

    async function saveMovieToDB(movie, isEdit, index) {
        try {
            if (isEdit) {
                const id = movies[index]._id;
                await fetch(`${SU}/rest/v1/movies?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: HEADERS,
                    body: JSON.stringify({ data: movie })
                });
                movies[index] = movie;
            } else {
                const res = await fetch(`${SU}/rest/v1/movies`, {
                    method: 'POST',
                    headers: { ...HEADERS, 'Prefer': 'return=representation' },
                    body: JSON.stringify({ data: movie })
                });
                const newMovie = (await res.json())[0].data;
                movies.push(newMovie);
            }
            localStorage.setItem('movies_backup', JSON.stringify(movies));
            render();
        } catch (e) {
            if (isEdit) movies[index] = movie;
            else movies.push(movie);
            localStorage.setItem('movies_backup', JSON.stringify(movies));
            render();
        }
    }

    async function deleteMovieFromDB(index) {
        const id = movies[index]._id;
        try {
            await fetch(`${SU}/rest/v1/movies?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
        } catch(e) {}
        movies.splice(index, 1);
        localStorage.setItem('movies_backup', JSON.stringify(movies));
        render();
        closeModal();
    }

    // ---------- Rendu principal ----------
    function render() {
        let filtered = [...movies];
        if (qualityFilters.size) filtered = filtered.filter(m => qualityFilters.has(m.quality));
        if (mediaTypeFilters.size) filtered = filtered.filter(m => mediaTypeFilters.has(m.media_type || 'movie'));
        if (genreInc.size) filtered = filtered.filter(m => (m.tags || []).some(t => genreInc.has(t)));
        if (genreExc.size) filtered = filtered.filter(m => !(m.tags || []).some(t => genreExc.has(t)));
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            filtered = filtered.filter(m => m.title.toLowerCase().includes(q));
        }

        movieCountEl.textContent = filtered.length;
        gridEl.innerHTML = '';
        filtered.forEach((movie, idx) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    ${movie.poster ? `<img class="poster" src="${movie.poster}" alt="${movie.title}" loading="lazy" onerror="this.src=''">` : `<div class="no-poster">🎬</div>`}
                </div>
                <div class="card-body">
                    <div class="card-title">${escapeHtml(movie.title)}</div>
                    <div class="card-meta">
                        <span class="quality">${getQualityIcon(movie.quality)}</span>
                        <span>${movie.release_date ? movie.release_date.slice(0,4) : ''}</span>
                    </div>
                </div>
            `;
            const originalIdx = movies.indexOf(movie);
            card.addEventListener('click', () => openDetail(originalIdx));
            gridEl.appendChild(card);
        });
        renderFilters();
        renderGenres();
    }

    function getQualityIcon(q) {
        const map = { '4kr': '💎', '4kl': '✨', '1r': '🍀', '1l': '🎬' };
        return map[q] || '🎞️';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderFilters() {
        const qualities = [
            { key: '4kr', label: '💎 4K Remux' },
            { key: '4kl', label: '✨ 4K Light' },
            { key: '1r', label: '🍀 1080p Remux' },
            { key: '1l', label: '🎬 1080p Light' }
        ];
        const types = [
            { key: 'movie', label: '🎬 Films' },
            { key: 'tv', label: '📺 Séries' },
            { key: 'collection', label: '🎞 Collections' },
            { key: 'saga', label: '⚡ Sagas' }
        ];
        filtersBar.innerHTML = '';
        qualities.forEach(q => {
            const chip = document.createElement('div');
            chip.className = `chip ${qualityFilters.has(q.key) ? 'active' : ''}`;
            chip.textContent = q.label;
            chip.dataset.filter = q.key;
            chip.addEventListener('click', () => {
                if (qualityFilters.has(q.key)) qualityFilters.delete(q.key);
                else qualityFilters.add(q.key);
                render();
            });
            filtersBar.appendChild(chip);
        });
        const sep = document.createElement('span');
        sep.style.width = '1px';
        sep.style.background = 'var(--border)';
        sep.style.margin = '0 0.5rem';
        filtersBar.appendChild(sep);
        types.forEach(t => {
            const chip = document.createElement('div');
            chip.className = `chip ${mediaTypeFilters.has(t.key) ? 'active' : ''}`;
            chip.textContent = t.label;
            chip.dataset.filter = t.key;
            chip.addEventListener('click', () => {
                if (mediaTypeFilters.has(t.key)) mediaTypeFilters.delete(t.key);
                else mediaTypeFilters.add(t.key);
                render();
            });
            filtersBar.appendChild(chip);
        });
    }

    function renderGenres() {
        const allGenres = new Set();
        movies.forEach(m => {
            (m.tags || []).forEach(g => allGenres.add(g));
        });
        genreBar.innerHTML = '';
        if (allGenres.size === 0) return;
        const clearBtn = document.createElement('div');
        clearBtn.className = 'genre-chip';
        clearBtn.textContent = '✖ Effacer genres';
        clearBtn.addEventListener('click', () => {
            genreInc.clear();
            genreExc.clear();
            render();
        });
        genreBar.appendChild(clearBtn);
        [...allGenres].sort().forEach(genre => {
            const chip = document.createElement('div');
            chip.className = 'genre-chip';
            if (genreInc.has(genre)) chip.classList.add('inc');
            if (genreExc.has(genre)) chip.classList.add('exc');
            chip.textContent = genre;
            chip.addEventListener('click', () => {
                if (genreInc.has(genre)) {
                    genreInc.delete(genre);
                    genreExc.add(genre);
                } else if (genreExc.has(genre)) {
                    genreExc.delete(genre);
                } else {
                    genreInc.add(genre);
                }
                render();
            });
            genreBar.appendChild(chip);
        });
    }

    // ---------- Détail avec liens Letterboxd, Allociné, sous-titres ----------
    function openDetail(index) {
        const movie = movies[index];
        const titleEncoded = encodeURIComponent(movie.title);
        const letterboxdUrl = movie.tmdb_id 
            ? `https://letterboxd.com/tmdb/${movie.tmdb_id}/`
            : `https://letterboxd.com/search/${titleEncoded}/`;
        const allocineUrl = `https://www.allocine.fr/rechercher/?q=${titleEncoded}`;
        const subsUrl = `https://www.opensubtitles.com/fr/search/all/q-${titleEncoded}/hearing_impaired-include/machine_translated-exclude/trusted_sources-include`;

        const detailHtml = `
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <img src="${movie.poster || ''}" style="width: 120px; border-radius: 0.8rem;" onerror="this.src=''">
                <div style="flex:1">
                    <h3>${escapeHtml(movie.title)}</h3>
                    <p>Qualité: ${getQualityIcon(movie.quality)} ${movie.quality}</p>
                    <p>Année: ${movie.release_date?.slice(0,4) || 'N/A'}</p>
                    <p>Note: ${movie.vote_average ? '⭐ ' + movie.vote_average.toFixed(1) : 'N/A'}</p>
                    <p>Genres: ${(movie.tags || []).join(', ') || 'Aucun'}</p>
                    ${(movie.links && movie.links.length) ? `<div>Liens personnalisés: ${movie.links.map(l => `<a href="${l.url}" target="_blank" style="color:var(--accent)">${l.name || 'lien'}</a>`).join(', ')}</div>` : ''}
                </div>
            </div>
            <div class="external-links">
                <a href="${letterboxdUrl}" target="_blank" class="external-link">🎞 Letterboxd</a>
                <a href="${allocineUrl}" target="_blank" class="external-link">🎬 Allociné</a>
                <a href="${subsUrl}" target="_blank" class="external-link">💬 Sous-titres</a>
            </div>
            <div class="footer-buttons" style="margin-top: 1rem;">
                <button id="editFromDetail">Modifier</button>
                <button id="closeDetail">Fermer</button>
            </div>
        `;
        const modalDetail = document.createElement('div');
        modalDetail.className = 'modal active';
        modalDetail.innerHTML = `<div class="modal-content">${detailHtml}</div>`;
        document.body.appendChild(modalDetail);
        modalDetail.querySelector('#closeDetail').addEventListener('click', () => modalDetail.remove());
        modalDetail.querySelector('#editFromDetail').addEventListener('click', () => {
            modalDetail.remove();
            openEdit(index);
        });
        modalDetail.addEventListener('click', (e) => { if (e.target === modalDetail) modalDetail.remove(); });
    }

    // ---------- Modal d'édition ----------
    function openEdit(index = null) {
        editIndex = index;
        const movie = index !== null ? movies[index] : null;
        if (movie) {
            modalTitle.innerText = 'Modifier le film';
            movieTitleInput.value = movie.title;
            movieQualitySelect.value = movie.quality;
            currentPoster = movie.poster || '';
            posterUrlInput.value = currentPoster;
            currentPosterPreview.src = currentPoster;
            currentMediaType = movie.media_type || 'movie';
            currentLinks = movie.links ? [...movie.links] : [];
            deleteMovieBtn.style.display = 'inline-block';
        } else {
            modalTitle.innerText = 'Ajouter un film';
            movieTitleInput.value = '';
            movieQualitySelect.value = '1l';
            currentPoster = '';
            posterUrlInput.value = '';
            currentPosterPreview.src = '';
            currentMediaType = 'movie';
            currentLinks = [];
            deleteMovieBtn.style.display = 'none';
        }
        updateTypeBtns(currentMediaType);
        renderLinks();
        tmdbResultsDiv.innerHTML = '';
        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
        editIndex = null;
    }

    function updateTypeBtns(type) {
        typeBtns.forEach(btn => {
            const btnType = btn.dataset.type;
            if (btnType === type) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    function renderLinks() {
        linksContainer.innerHTML = '';
        if (currentLinks.length === 0) currentLinks.push({ name: '', url: '' });
        currentLinks.forEach((link, idx) => {
            const row = document.createElement('div');
            row.className = 'link-row';
            row.innerHTML = `
                <input type="text" placeholder="Nom du lien" value="${escapeHtml(link.name)}" style="flex:1">
                <input type="text" placeholder="URL" value="${escapeHtml(link.url)}" style="flex:2">
                <button class="remove-link" data-idx="${idx}">✕</button>
            `;
            linksContainer.appendChild(row);
        });
        document.querySelectorAll('.remove-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                currentLinks.splice(idx, 1);
                renderLinks();
            });
        });
    }

    function collectLinks() {
        const rows = linksContainer.querySelectorAll('.link-row');
        const newLinks = [];
        rows.forEach(row => {
            const name = row.querySelector('input:first-child').value.trim();
            const url = row.querySelector('input:last-child').value.trim();
            if (url) newLinks.push({ name, url });
        });
        return newLinks;
    }

    async function searchTMDB() {
        const title = movieTitleInput.value.trim();
        if (!title) return;
        const type = currentMediaType === 'tv' ? 'tv' : 'movie';
        const url = `https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(title)}&language=fr-FR`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            const results = data.results || [];
            tmdbResultsDiv.innerHTML = '';
            results.slice(0, 8).forEach(item => {
                const posterPath = item.poster_path ? `https://image.tmdb.org/t/p/w154${item.poster_path}` : '';
                const div = document.createElement('div');
                div.className = 'poster-option';
                div.innerHTML = `<img src="${posterPath}" style="width:100%; border-radius:0.5rem;" onerror="this.src=''">`;
                div.addEventListener('click', () => {
                    currentPoster = `https://image.tmdb.org/t/p/w342${item.poster_path}`;
                    posterUrlInput.value = currentPoster;
                    currentPosterPreview.src = currentPoster;
                    tmdbResultsDiv.innerHTML = '';
                });
                tmdbResultsDiv.appendChild(div);
            });
        } catch(e) { console.error(e); }
    }

    async function saveMovie() {
        const title = movieTitleInput.value.trim();
        if (!title) { alert('Veuillez entrer un titre'); return; }
        const quality = movieQualitySelect.value;
        const poster = currentPoster || posterUrlInput.value.trim();
        const links = collectLinks();
        const movieData = {
            title, quality, poster, links,
            media_type: currentMediaType,
            release_date: '',
            popularity: 0,
            vote_average: 0,
            tags: [],
            runtime: 0,
            tmdb_id: null,
            link: links[0]?.url || ''
        };
        if (editIndex !== null) {
            await saveMovieToDB(movieData, true, editIndex);
        } else {
            await saveMovieToDB(movieData, false);
        }
        closeModal();
    }

    async function deleteMovie() {
        if (editIndex !== null && confirm('Supprimer définitivement ce film ?')) {
            await deleteMovieFromDB(editIndex);
        }
    }

    function exportData() {
        const dataStr = JSON.stringify(movies, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'movies_backup.json';
        a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            const text = await file.text();
            const imported = JSON.parse(text);
            for (const m of imported) {
                await saveMovieToDB(m, false);
            }
            render();
        };
        input.click();
    }

    function exportLetterboxd() {
        let csv = 'Title,Year,tmdbID\n';
        movies.forEach(m => {
            const year = m.release_date ? m.release_date.slice(0,4) : '';
            const tmdbId = m.tmdb_id || '';
            csv += `"${m.title.replace(/"/g, '""')}",${year},${tmdbId}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'letterboxd_export.csv';
        a.click();
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => { searchQuery = e.target.value; render(); });
    addMovieBtn.addEventListener('click', () => openEdit());
    cancelModalBtn.addEventListener('click', closeModal);
    closeModalBtn.addEventListener('click', closeModal);
    saveMovieBtn.addEventListener('click', saveMovie);
    deleteMovieBtn.addEventListener('click', deleteMovie);
    addLinkBtn.addEventListener('click', () => { currentLinks.push({ name: '', url: '' }); renderLinks(); });
    searchTmdbBtn.addEventListener('click', searchTMDB);
    typeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            currentMediaType = btn.dataset.type;
            updateTypeBtns(currentMediaType);
        });
    });
    posterUrlInput.addEventListener('input', (e) => { currentPoster = e.target.value; currentPosterPreview.src = currentPoster; });
    document.getElementById('exportBtn').addEventListener('click', exportData);
    document.getElementById('importBtn').addEventListener('click', importData);
    document.getElementById('letterboxdExportBtn').addEventListener('click', exportLetterboxd);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    loadMovies();
</script>
</body>
</html>
