<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VIDÉO CLUB - Expérience immersive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Courier New', 'Segoe UI', monospace;
            background: #0a0c12;
            height: 100vh;
            width: 100vw;
        }

        /* Conteneur principal de la scène */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            perspective: 1200px;
        }

        /* Écran extérieur (rue + façade) */
        .exterior {
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, #1a2a3a 0%, #0b1018 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 10;
        }

        /* Façade du vidéo-club */
        .facade {
            width: 80%;
            max-width: 800px;
            height: 70%;
            background: #2c1e12;
            background-image: repeating-linear-gradient(90deg, #3d2a1a 1px, transparent 1px, transparent 40px);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,215,150,0.3);
            position: relative;
            border-top: 8px solid #ffdd99;
            border-left: 2px solid #aa8866;
            border-right: 2px solid #aa8866;
        }

        /* Enseigne */
        .sign {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3366;
            padding: 8px 24px;
            border-radius: 40px;
            color: #fff7e8;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-shadow: 0 0 6px #ffaaff;
            box-shadow: 0 0 15px #ff3366;
            white-space: nowrap;
            font-family: monospace;
        }
        .sign small {
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        /* Porte */
        .door {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 220px;
            background: #5e3a22;
            background: linear-gradient(90deg, #7e4e2e, #5e3a22);
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            transition: transform 0.6s ease, box-shadow 0.2s;
            box-shadow: 0 0 0 3px #ffdd99, 0 10px 20px rgba(0,0,0,0.5);
            z-index: 20;
            transform-origin: left center;
        }
        .door::before {
            content: "OPEN";
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: #ffdd99;
            color: #2c1e12;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            font-family: monospace;
        }
        .door::after {
            content: "🍿";
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
        }
        .door.open {
            transform: translateX(-50%) rotateY(-110deg);
            box-shadow: -10px 0 20px rgba(0,0,0,0.3);
        }

        /* Panneau "OPEN" clignotant */
        .open-sign {
            position: absolute;
            top: 30%;
            right: -30px;
            background: #00ffaa;
            color: #002200;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: bold;
            animation: pulse 1s infinite;
            font-size: 14px;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Intérieur (caché au début) */
        .interior {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, #2a2418, #120e08);
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 5;
            overflow-y: auto;
            padding: 20px;
        }
        .interior.visible {
            display: flex;
            opacity: 1;
        }

        /* Mur intérieur style vidéo club */
        .shelves {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 60px;
            background: rgba(0,0,0,0.4);
            border-radius: 40px;
            padding: 30px 20px;
            backdrop-filter: blur(3px);
        }
        .catalog-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffcc44;
            color: #2a1e0e;
            border: none;
            padding: 12px 32px;
            font-size: 1.6rem;
            font-weight: 900;
            border-radius: 60px;
            cursor: pointer;
            z-index: 100;
            font-family: monospace;
            box-shadow: 0 0 20px #ffaa33;
            transition: 0.2s;
        }
        .catalog-btn:hover {
            transform: translateX(-50%) scale(1.02);
            background: #ffdd77;
        }

        /* Grille catalogue (réplique de l'application) */
        .catalog-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 24px;
            padding: 100px 40px 40px;
            background: rgba(10, 8, 15, 0.85);
            border-radius: 48px;
            margin-top: 20px;
            backdrop-filter: blur(12px);
            max-height: 80vh;
            overflow-y: auto;
        }
        .catalog-grid.visible {
            display: grid;
        }
        .movie-card {
            background: #1e1a24;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #ffcc66;
        }
        .movie-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #ff66aa;
        }
        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .movie-title {
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            color: #ffecb3;
        }

        /* Animation de prise de cassette */
        .take-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s;
        }
        .hand-take {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path fill="%23f7d9aa" d="M80,140 L110,170 L160,120 L130,90 L80,140Z" stroke="%23806040" stroke-width="2"/><circle cx="100" cy="110" r="28" fill="%23f7d9aa"/><rect x="90" y="80" width="40" height="60" fill="%23332211" rx="5"/><rect x="95" y="85" width="30" height="20" fill="%23ff3366"/></svg>') no-repeat center;
            background-size: contain;
            width: 180px;
            height: 180px;
            animation: grab 0.5s ease-out forwards;
        }
        @keyframes grab {
            0% { transform: translateY(100px) scale(0.8); opacity: 0; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .close-anim {
            position: absolute;
            bottom: 30px;
            background: #ffdd99;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Message accueil */
        .welcome-message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #000000aa;
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffdd99;
            pointer-events: none;
            z-index: 15;
        }
    </style>
</head>
<body>
<div class="scene">
    <!-- Vue extérieure -->
    <div class="exterior" id="exterior">
        <div class="facade">
            <div class="sign">📼 VIDÉO CLUB <small>DEPUIS 1989</small></div>
            <div class="door" id="door"></div>
            <div class="open-sign">🔓 OPEN</div>
        </div>
        <div class="welcome-message">👆 Cliquez sur la porte pour entrer</div>
    </div>

    <!-- Vue intérieure -->
    <div class="interior" id="interior">
        <button class="catalog-btn" id="catalogBtn">🎬 CATALOGUE</button>
        <div class="shelves" id="shelvesArea">
            <div style="text-align: center; width: 100%; color: #ffccaa;">✨ Les étagères sont remplies de cassettes... ✨<br> Cliquez sur CATALOGUE pour feuilleter</div>
        </div>
        <div class="catalog-grid" id="catalogGrid"></div>
    </div>
</div>

<script>
    // ---------- DATA MOVIES (exemple initial) ----------
    let movies = [
        { title: "PULP FICTION", poster: "https://image.tmdb.org/t/p/w200//d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg", year: 1994 },
        { title: "INCEPTION", poster: "https://image.tmdb.org/t/p/w200//9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg", year: 2010 },
        { title: "THE MATRIX", poster: "https://image.tmdb.org/t/p/w200//f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg", year: 1999 },
        { title: "BLADE RUNNER 2049", poster: "https://image.tmdb.org/t/p/w200//gajvy2e7abYP3GqQjQTBCxQv3OB.jpg", year: 2017 }
    ];
    
    // Charger depuis localStorage ou Supabase optionnel (simplifié)
    function loadMovies() {
        const stored = localStorage.getItem("videoclub_movies");
        if(stored) {
            try {
                movies = JSON.parse(stored);
            } catch(e) {}
        }
        renderCatalog();
    }
    function saveMovies() {
        localStorage.setItem("videoclub_movies", JSON.stringify(movies));
    }
    function renderCatalog() {
        const grid = document.getElementById("catalogGrid");
        if(!grid) return;
        grid.innerHTML = "";
        movies.forEach((m, idx) => {
            const card = document.createElement("div");
            card.className = "movie-card";
            card.innerHTML = `
                <img src="${m.poster}" onerror="this.src='https://via.placeholder.com/150x225?text=NO+POSTER'">
                <div class="movie-title">${m.title} (${m.year})</div>
            `;
            card.onclick = (e) => {
                e.stopPropagation();
                startTakeAnimation(m.title);
            };
            grid.appendChild(card);
        });
    }

    // Animation de prise de cassette
    function startTakeAnimation(movieTitle) {
        // Créer overlay animation
        const animDiv = document.createElement("div");
        animDiv.className = "take-animation";
        animDiv.innerHTML = `
            <div style="text-align:center; background:#1e1712; padding:30px; border-radius:48px; border:2px solid #ffcc44;">
                <div class="hand-take"></div>
                <p style="margin-top:20px; font-size:24px; font-weight:bold;">📼 ${movieTitle}</p>
                <p style="margin-top:8px;">Vous prenez la cassette sur l'étagère...</p>
                <button class="close-anim">Refermer la cassette</button>
            </div>
        `;
        document.body.appendChild(animDiv);
        const closeBtn = animDiv.querySelector(".close-anim");
        closeBtn.onclick = () => {
            animDiv.remove();
        };
        // Auto fermeture au bout de 3 secondes
        setTimeout(() => { if(animDiv.parentNode) animDiv.remove(); }, 3000);
    }

    // Gestion de l'ouverture de porte
    const door = document.getElementById("door");
    const exteriorDiv = document.getElementById("exterior");
    const interiorDiv = document.getElementById("interior");
    let isOpen = false;

    door.addEventListener("click", (e) => {
        if(isOpen) return;
        e.stopPropagation();
        door.classList.add("open");
        // Après l'animation, basculer vers l'intérieur
        setTimeout(() => {
            exteriorDiv.style.opacity = "0";
            setTimeout(() => {
                exteriorDiv.style.display = "none";
                interiorDiv.classList.add("visible");
                // Afficher un petit message d'ambiance
                const shelvesMsg = document.querySelector("#shelvesArea div");
                if(shelvesMsg) shelvesMsg.innerHTML = "📀 Bienvenue dans le vidéo club ! Flânez dans les allées...<br> 🎬 Cliquez sur CATALOGUE pour emprunter un film.";
            }, 400);
        }, 500);
        isOpen = true;
    });

    // Catalogue toggle
    const catalogBtn = document.getElementById("catalogBtn");
    const catalogGrid = document.getElementById("catalogGrid");
    let catalogVisible = false;
    catalogBtn.addEventListener("click", () => {
        if(!catalogVisible) {
            catalogGrid.classList.add("visible");
            catalogVisible = true;
            catalogBtn.textContent = "✖ FERMER CATALOGUE";
            // Recharger la grille pour être sûr
            renderCatalog();
        } else {
            catalogGrid.classList.remove("visible");
            catalogVisible = false;
            catalogBtn.textContent = "🎬 CATALOGUE";
        }
    });

    // Permettre l'ajout de films (comme avant) ? Pour rester simple, on garde les films existants.
    // Mais on peut ajouter une fonction d'import/export plus tard.
    // Pour que l'utilisateur puisse ajouter via l'interface, on va rajouter un petit plus:
    // Bouton "+" dans le catalogue ?
    // Amélioration: ajouter un film factice via console mais pour l'expérience on peut implémenter un petit formulaire
    // Pas obligatoire mais pour la démo on laisse la liste fixe

    // Pour permettre à l'utilisateur d'ajouter des films, on ajoute un bouton flottant dans le catalogue
    function addFloatingAddButton() {
        const addBtn = document.createElement("button");
        addBtn.innerText = "+ AJOUTER UN FILM";
        addBtn.style.position = "fixed";
        addBtn.style.bottom = "20px";
        addBtn.style.right = "20px";
        addBtn.style.background = "#ff66aa";
        addBtn.style.border = "none";
        addBtn.style.borderRadius = "40px";
        addBtn.style.padding = "10px 20px";
        addBtn.style.fontWeight = "bold";
        addBtn.style.cursor = "pointer";
        addBtn.style.zIndex = "200";
        addBtn.style.fontFamily = "monospace";
        addBtn.onclick = () => {
            const title = prompt("Titre du film ?");
            if(!title) return;
            const year = prompt("Année ?", "2024");
            const posterUrl = prompt("URL de l'affiche (laissez vide pour placeholder)", "https://via.placeholder.com/150x225?text=CASSETTE");
            movies.push({
                title: title,
                poster: posterUrl || "https://via.placeholder.com/150x225?text=CASSETTE",
                year: parseInt(year) || 2000
            });
            saveMovies();
            renderCatalog();
            if(catalogVisible) catalogGrid.classList.add("visible");
            else catalogGrid.classList.remove("visible");
        };
        document.body.appendChild(addBtn);
    }

    // Chargement et initialisation
    loadMovies();
    addFloatingAddButton();

    // Animation supplémentaire: sons fictifs (pas de son pour éviter autorisation)
    // Style cursor pour la porte
    door.style.cursor = "pointer";
</script>
</body>
</html>
