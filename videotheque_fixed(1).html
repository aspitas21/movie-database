<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Library</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#050508;
  --s1:#0a0a10;
  --s2:#0f0f18;
  --s3:#161622;
  --s4:#1c1c2e;
  --border:rgba(255,255,255,0.055);
  --border2:rgba(255,255,255,0.1);
  --text:#f0f0f8;
  --muted:#444460;
  --muted2:#6868a0;
  --c4kr:#c084fc; --c4kr-bg:rgba(192,132,252,0.06); --c4kr-glow:rgba(192,132,252,0.12);
  --c4kl:#4ade80;  --c4kl-bg:rgba(74,222,128,0.06);  --c4kl-glow:rgba(74,222,128,0.12);
  --c1r:#38bdf8;   --c1r-bg:rgba(56,189,248,0.06);   --c1r-glow:rgba(56,189,248,0.12);
  --c1l:#fb923c;   --c1l-bg:rgba(251,146,60,0.06);   --c1l-glow:rgba(251,146,60,0.12);
  --card-w:160px;
  --bg-glow:radial-gradient(ellipse,rgba(109,40,217,0.07) 0%,transparent 70%);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:900px;height:600px;border-radius:50%;background:var(--bg-glow);pointer-events:none;z-index:0;transition:background 0.6s ease;}

/* RECENT SECTION */
.recent-section{padding:1rem 2.5rem 0;position:relative;z-index:1;}
.recent-header{display:flex;align-items:center;gap:10px;margin-bottom:0.9rem;}
.recent-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);}
.recent-line{flex:1;height:1px;background:linear-gradient(to right,var(--border),transparent);}
.recent-grid{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.recent-grid::-webkit-scrollbar{display:none;}
.recent-card{flex-shrink:0;width:80px;cursor:pointer;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--s1);transition:transform 0.2s,border-color 0.2s;}
.recent-card:hover{transform:translateY(-3px);border-color:var(--border2);}
.recent-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
.recent-card .rc-placeholder{width:100%;aspect-ratio:2/3;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);}
.recent-card .rc-title{font-size:9px;font-weight:600;color:var(--muted2);padding:4px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* HEADER */
header{padding:0 2.5rem;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(5,5,8,0.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(24px);}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;}
.logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#6d28d9,#a855f7);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 14px rgba(124,58,237,0.45);position:relative;overflow:hidden;flex-shrink:0;}
.logo-mark::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shim 3s infinite;}
@keyframes shim{to{left:200%;}}
.logo-name{font-size:14px;font-weight:800;letter-spacing:-0.4px;}
.logo-name span{color:#a78bfa;}
.search-wrap{flex:1;max-width:460px;position:relative;}
.search-input{width:100%;padding:8px 14px 8px 36px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:all 0.2s;}
.search-input::placeholder{color:var(--muted2);}
.search-input:focus{border-color:rgba(167,139,250,0.3);background:rgba(255,255,255,0.05);box-shadow:0 0 0 3px rgba(167,139,250,0.07);}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:13px;pointer-events:none;}
.hdr-right{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.sync{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);font-weight:500;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.sdot.ok{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,0.5);}
.sdot.loading{background:#fbbf24;animation:blink 0.8s infinite;}
.sdot.error{background:#f87171;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
.count{font-size:11px;font-weight:700;color:var(--muted2);background:var(--s2);padding:3px 10px;border-radius:20px;border:1px solid var(--border);}
.btn-rnd{padding:7px 13px;background:rgba(56,189,248,0.07);border:1px solid rgba(56,189,248,0.18);border-radius:8px;color:#7dd3fc;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn-rnd:hover{background:rgba(56,189,248,0.13);border-color:rgba(56,189,248,0.3);}
.btn-size{padding:7px 10px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted2);font-size:14px;cursor:pointer;transition:all 0.15s;line-height:1;}
.btn-size:hover{border-color:var(--border2);color:var(--text);}
.btn-add{padding:7px 15px;background:linear-gradient(135deg,#6d28d9,#9333ea);border:none;border-radius:8px;color:#fff;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;cursor:pointer;transition:all 0.2s;letter-spacing:0.4px;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 12px rgba(109,40,217,0.35);}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(109,40,217,0.5);}

/* FILTERS BAR */
.bar{padding:0 2.5rem;height:44px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border);background:rgba(5,5,8,0.75);backdrop-filter:blur(12px);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:40;}
.bar::-webkit-scrollbar{display:none;}
.chip{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;flex-shrink:0;}
.chip:hover{border-color:var(--border2);color:var(--text);}
.chip.active{color:var(--text);background:rgba(255,255,255,0.05);border-color:var(--border2);}
.chip.active[data-q="4kr"]{background:var(--c4kr-bg);border-color:rgba(192,132,252,0.3);color:var(--c4kr);}
.chip.active[data-q="4kl"]{background:var(--c4kl-bg);border-color:rgba(74,222,128,0.3);color:var(--c4kl);}
.chip.active[data-q="1r"]{background:var(--c1r-bg);border-color:rgba(56,189,248,0.3);color:var(--c1r);}
.chip.active[data-q="1l"]{background:var(--c1l-bg);border-color:rgba(251,146,60,0.3);color:var(--c1l);}
.chip-cnt{font-size:9px;font-weight:800;opacity:0.7;margin-left:1px;}
.bsep{width:1px;height:16px;background:var(--border);margin:0 3px;flex-shrink:0;}
.bsel{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;outline:none;transition:all 0.15s;flex-shrink:0;}
.bsel:focus{border-color:var(--border2);color:var(--text);}
.bsel option{background:#0f0f18;color:var(--text);}

/* RESULTS */
.results-bar{padding:0.9rem 2.5rem 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.results-label{font-size:12px;color:var(--muted2);font-weight:500;}
.results-label strong{color:var(--text);font-weight:700;}

/* GRID */
.content{padding:1.2rem 2.5rem 3rem;position:relative;z-index:1;}

/* GENRE CHIPS ROW */
.genre-bar{padding:0.4rem 2.5rem;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border);background:rgba(5,5,8,0.6);overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;min-height:36px;}
.genre-bar::-webkit-scrollbar{display:none;}
.genre-bar:empty{display:none;}
.gchip{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all 0.15s;white-space:nowrap;flex-shrink:0;}
.gchip:hover{border-color:var(--border2);color:var(--text);}
.gchip.inc{background:rgba(167,139,250,0.12);border-color:rgba(167,139,250,0.35);color:#c4b5fd;}
.gchip.exc{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);color:#f87171;text-decoration:line-through;}
.genre-hint{font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap;flex-shrink:0;padding-left:4px;}
.genre-clear{padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;}
.genre-clear:hover{color:var(--text);border-color:var(--border2);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:14px;transition:grid-template-columns 0.3s;}

/* CARD */
.card{position:relative;border-radius:11px;overflow:hidden;background:var(--s1);border:1px solid var(--border);cursor:pointer;text-decoration:none;display:block;transition:transform 0.25s cubic-bezier(0.34,1.4,0.64,1),border-color 0.2s,box-shadow 0.25s;will-change:transform;}
.card.q4kr{background:linear-gradient(160deg,#0f0b18 0%,#0a0a10 60%);}
.card.q4kl{background:linear-gradient(160deg,#0a1410 0%,#0a0a10 60%);}
.card.q1r{background:linear-gradient(160deg,#0a1218 0%,#0a0a10 60%);}
.card.q1l{background:linear-gradient(160deg,#160e08 0%,#0a0a10 60%);}
.card:hover{transform:translateY(-8px) scale(1.015);box-shadow:0 24px 50px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.05);}
.card.q4kr:hover{border-color:rgba(192,132,252,0.25);box-shadow:0 24px 50px rgba(0,0,0,0.6),0 0 20px rgba(192,132,252,0.08);}
.card.q4kl:hover{border-color:rgba(74,222,128,0.25);box-shadow:0 24px 50px rgba(0,0,0,0.6),0 0 20px rgba(74,222,128,0.08);}
.card.q1r:hover{border-color:rgba(56,189,248,0.25);box-shadow:0 24px 50px rgba(0,0,0,0.6),0 0 20px rgba(56,189,248,0.08);}
.card.q1l:hover{border-color:rgba(251,146,60,0.25);box-shadow:0 24px 50px rgba(0,0,0,0.6),0 0 20px rgba(251,146,60,0.08);}
.card:hover .cov{opacity:1;}
.card:hover .cposter{transform:scale(1.05);}
.card:hover .detail-btn{opacity:1;transform:scale(1);}

.poster-wrap{overflow:hidden;position:relative;aspect-ratio:2/3;}
.cposter{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.4s ease;}
.no-poster{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted);}
.no-poster.q4kr{background:linear-gradient(135deg,#1a0d2e,#0f0a18);}
.no-poster.q4kl{background:linear-gradient(135deg,#0d1f12,#0a1410);}
.no-poster.q1r{background:linear-gradient(135deg,#0d1a26,#0a1218);}
.no-poster.q1l{background:linear-gradient(135deg,#261408,#160e08);}

.crating{position:absolute;top:7px;left:7px;z-index:2;background:rgba(0,0,0,0.8);color:#fbbf24;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;border:1px solid rgba(251,191,36,0.2);backdrop-filter:blur(6px);}

.cov{position:absolute;inset:0;opacity:0;transition:opacity 0.2s;background:linear-gradient(to top,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.2) 55%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;z-index:1;}
.cov-play{position:absolute;top:calc(50% - 28px);left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;backdrop-filter:blur(4px);}
.cov-year{font-size:9px;color:rgba(255,255,255,0.55);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}

.detail-btn{position:absolute;top:7px;right:7px;z-index:3;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.1);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.8);transition:all 0.18s;backdrop-filter:blur(6px);}
.detail-btn:hover{background:rgba(109,40,217,0.4);border-color:rgba(167,139,250,0.4);}

/* QUALITY BADGE - bottom right of card body */
.cbody{padding:8px 10px 10px;position:relative;}
.ctitle{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.1px;padding-right:4px;}
.csub{font-size:10px;color:var(--muted2);margin-top:2px;font-weight:500;}
.cfoot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:5px;gap:4px;}
.ctags{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0;}
.ctag{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,0.04);color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;border:1px solid var(--border);white-space:nowrap;}
.qbadge{font-size:13px;line-height:1;padding:3px 5px;border-radius:5px;white-space:nowrap;flex-shrink:0;}
.qbadge.q4kr{background:rgba(192,132,252,0.12);border:1px solid rgba(192,132,252,0.25);}
.qbadge.q4kl{background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.25);}
.qbadge.q1r{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);}
.qbadge.q1l{background:rgba(100,100,120,0.1);border:1px solid rgba(255,255,255,0.08);filter:grayscale(1);opacity:0.55;}

.empty{padding:5rem 1rem;text-align:center;}
.empty-icon{font-size:52px;opacity:0.15;margin-bottom:14px;}
.empty-title{font-size:17px;font-weight:800;letter-spacing:-0.4px;margin-bottom:7px;}
.empty-sub{font-size:13px;color:var(--muted2);}

/* COLLECTION CARD */
.card.collection{background:linear-gradient(160deg,#120a1e 0%,#0a0a10 60%);}
.card.collection:hover{border-color:rgba(232,184,74,0.3);box-shadow:0 24px 50px rgba(0,0,0,0.6),0 0 20px rgba(232,184,74,0.08);}
.col-portrait{width:100%;aspect-ratio:2/3;object-fit:cover;object-position:top;display:block;transition:transform 0.4s ease;}
.col-portrait-wrap{overflow:hidden;position:relative;aspect-ratio:2/3;}
.col-portrait-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top,rgba(0,0,0,0.9),transparent);pointer-events:none;}
.col-name-overlay{position:absolute;bottom:8px;left:8px;right:8px;z-index:2;}
.col-name-overlay .col-role{font-size:9px;color:rgba(232,184,74,0.8);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.no-portrait{width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#1a0d2e,#120820);color:var(--muted);font-size:36px;}

/* MODALS */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(12px);}
.mbg.open{display:flex;}
.modal{background:var(--s1);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:1.75rem;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:up 0.25s cubic-bezier(0.34,1.4,0.64,1);box-shadow:0 40px 80px rgba(0,0,0,0.7);}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:none}}
.mtitle{font-size:17px;font-weight:800;color:var(--text);margin-bottom:1.4rem;letter-spacing:-0.4px;}
.field{margin-bottom:1.1rem;}
.field label{display:block;font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:1.8px;font-weight:700;margin-bottom:6px;}
.field input,.field select{width:100%;padding:10px 13px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;outline:none;transition:all 0.2s;}
.field input::placeholder{color:var(--muted2);}
.field input:focus,.field select:focus{border-color:rgba(167,139,250,0.3);background:var(--s3);box-shadow:0 0 0 3px rgba(167,139,250,0.07);}
.field select option{background:var(--s2);}
.srow{display:flex;gap:8px;}.srow input{flex:1;}
.sbtn{padding:10px 14px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.sbtn:hover{border-color:var(--border2);background:var(--s3);}
.status{font-size:11px;color:var(--muted2);margin-top:6px;min-height:16px;font-weight:500;}
.posters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.popt{width:68px;height:102px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer;transition:all 0.15s;opacity:0.55;}
.popt:hover{opacity:1;transform:scale(1.07);}
.popt.sel{border-color:#a78bfa;opacity:1;box-shadow:0 0 14px rgba(167,139,250,0.4);}
.gprev{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.gpill{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-weight:600;}
.type-btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.type-btn:hover{border-color:var(--border2);color:var(--text);}
.type-btn.active{background:rgba(167,139,250,0.1);border-color:rgba(167,139,250,0.35);color:#c4b5fd;}
.mact{display:flex;gap:8px;align-items:center;margin-top:1.4rem;}
.mright{display:flex;gap:8px;margin-left:auto;}
.btnc{padding:9px 16px;background:transparent;border:1px solid var(--border);border-radius:9px;color:var(--muted2);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btnc:hover{border-color:var(--border2);color:var(--text);}
.btns{padding:9px 20px;background:linear-gradient(135deg,#6d28d9,#9333ea);border:none;border-radius:9px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all 0.15s;}
.btns:hover{box-shadow:0 4px 16px rgba(109,40,217,0.45);}
.btnd{padding:9px 13px;background:transparent;border:1px solid rgba(239,68,68,0.25);border-radius:9px;color:#f87171;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;}
.btnd:hover{background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.45);}
.btndc{padding:9px 16px;background:#b91c1c;border:none;border-radius:9px;color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}

/* FILMOGRAPHIE MODAL */
.fmod{width:680px;}
.fmod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:1rem;max-height:420px;overflow-y:auto;padding-right:4px;}
.fmod-grid::-webkit-scrollbar{width:4px;}
.fmod-grid::-webkit-scrollbar-track{background:transparent;}
.fmod-grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.fcard{border-radius:9px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--s2);transition:all 0.15s;position:relative;}
.fcard:hover{border-color:var(--border2);transform:translateY(-2px);}
.fcard.sel{border-color:#a78bfa;box-shadow:0 0 14px rgba(167,139,250,0.3);}
.fcard img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}

<script>
const SU='https://dnzrpvyeiyxplrcomsuo.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuenJwdnllaXl4cGxyY29tc3VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzYwNTAsImV4cCI6MjA5NTExMjA1MH0.BwuZBjZXQcJlNsaQ_DYSj_n-IbMZswsgL_VuGOVMVs4';
const TK='4dc76b66e8b41dd652e56c6cc3a425ab';
const H={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
const QLABEL={'4kr':'4K Remux','4kl':'4K Light','1r':'1080p Remux','1l':'1080p Light'};
const QICON={'4kr':'💎','4kl':'✨','1r':'🍀','1l':'🎬'};
const SIZES=[160,130,200];
let movies=[],selPoster='',srt='pop',genre='',meta={},editIdx=-1,sizeIdx=0;
let mediaType='movie';
let mediaFilt='';

function ss(s,l){document.getElementById('sdot').className='sdot '+s;document.getElementById('slbl').textContent=l;}

function toggleSize(){
  sizeIdx=(sizeIdx+1)%SIZES.length;
  document.documentElement.style.setProperty('--card-w',SIZES[sizeIdx]+'px');
  document.getElementById('size-btn').textContent=sizeIdx===0?'⊞':sizeIdx===1?'⊟':'⊠';
}

async function load(){
  ss('loading','Loading...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies?select=*&order=created_at.asc`,{headers:H});
    if(!r.ok) throw new Error();
    movies=(await r.json()).map(row=>({...row.data,_id:row.id}));
    ss('ok','Synced');
    document.getElementById('ls').style.display='none';
    render();
  }catch(e){ss('error','Error');document.getElementById('ls').style.display='none';render();}
}

async function addM(m){
  ss('loading','Saving...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies`,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({data:m})});
    if(!r.ok) throw new Error();
    m._id=(await r.json())[0].id; movies.push(m); ss('ok','Synced'); render();
  }catch(e){ss('error','Save error');}
}
async function updM(idx,m){
  const id=movies[idx]._id; ss('loading','Updating...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies?id=eq.${id}`,{method:'PATCH',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify({data:m})});
    if(!r.ok) throw new Error();
    m._id=id; movies[idx]=m; ss('ok','Synced'); render();
  }catch(e){ss('error','Error');}
}
async function delM(idx){
  const id=movies[idx]._id; ss('loading','Deleting...');
  try{
    const r=await fetch(`${SU}/rest/v1/movies?id=eq.${id}`,{method:'DELETE',headers:H});
    if(!r.ok) throw new Error();
    movies.splice(idx,1); ss('ok','Synced'); render(); closeModal();
  }catch(e){ss('error','Error');}
}

let filts=new Set();

function setSort(s){srt=s;render();}

const BG_GLOWS={
  '':'radial-gradient(ellipse,rgba(109,40,217,0.07) 0%,transparent 70%)',
  '4kr':'radial-gradient(ellipse,rgba(192,132,252,0.1) 0%,transparent 70%)',
  '4kl':'radial-gradient(ellipse,rgba(74,222,128,0.08) 0%,transparent 70%)',
  '1r':'radial-gradient(ellipse,rgba(56,189,248,0.09) 0%,transparent 70%)',
  '1l':'radial-gradient(ellipse,rgba(251,146,60,0.08) 0%,transparent 70%)'
};

function setFilter(f,btn){
  if(f===''){
    filts.clear();
    document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.style.setProperty('--bg-glow', BG_GLOWS['']);
  } else {
    document.querySelector('.chip[data-q=""]').classList.remove('active');
    if(filts.has(f)){filts.delete(f);btn.classList.remove('active');}
    else{filts.add(f);btn.classList.add('active');}
    if(filts.size===0){
      document.querySelector('.chip[data-q=""]').classList.add('active');
      document.documentElement.style.setProperty('--bg-glow', BG_GLOWS['']);
    } else {
      // Use glow of last selected
      const last=[...filts][filts.size-1];
      document.documentElement.style.setProperty('--bg-glow', BG_GLOWS[last]||BG_GLOWS['']);
    }
  }
  render();
}
let sortDir=1; // 1=desc, -1=asc

function toggleSortDir(){
  sortDir*=-1;
  document.getElementById('sort-dir-btn').textContent=sortDir===1?'↓':'↑';
  render();
}

function sorted(list){
  const a=[...list];
  const d=sortDir;
  if(srt==='alpha') return a.sort((x,y)=>d*x.title.localeCompare(y.title));
  if(srt==='date') return a.sort((x,y)=>d*((y.release_date||'').localeCompare(x.release_date||'')));
  if(srt==='pop') return a.sort((x,y)=>d*((y.popularity||0)-(x.popularity||0)));
  if(srt==='dur') return a.sort((x,y)=>d*((y.runtime||0)-(x.runtime||0)));
  if(srt==='note') return a.sort((x,y)=>d*((y.vote_average||0)-(x.vote_average||0)));
  if(srt==='added') return d===1?a:a.reverse();
  return a;
}
function fmt(m){if(!m)return '';return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');}

let genreInc=new Set(), genreExc=new Set();

function toggleGenre(g){
  if(!genreInc.has(g)&&!genreExc.has(g)){genreInc.add(g);}
  else if(genreInc.has(g)){genreInc.delete(g);genreExc.add(g);}
  else{genreExc.delete(g);}
  render();
}
function clearGenres(){genreInc.clear();genreExc.clear();render();}

function updGenres(){
  const all=new Set(); movies.forEach(m=>(m.tags||[]).forEach(t=>all.add(t)));
  const bar=document.getElementById('genre-bar');
  bar.innerHTML='';
  if(!all.size) return;
  const hasFilter=genreInc.size>0||genreExc.size>0;
  const hint=document.createElement('span');
  hint.className='genre-hint';
  hint.textContent=hasFilter?'🎭':'Genre :';
  bar.appendChild(hint);
  if(hasFilter){
    const clr=document.createElement('button');
    clr.className='genre-clear'; clr.textContent='Clear'; clr.onclick=clearGenres;
    bar.appendChild(clr);
  }
  [...all].sort().forEach(g=>{
    const chip=document.createElement('button');
    chip.className='gchip';
    if(genreInc.has(g)) chip.classList.add('inc');
    if(genreExc.has(g)) chip.classList.add('exc');
    chip.textContent=(genreInc.has(g)?'✓ ':genreExc.has(g)?'✕ ':'')+g;
    chip.title=genreInc.has(g)?'Cliquer pour exclure':genreExc.has(g)?'Cliquer pour désactiver':'Cliquer pour inclure';
    chip.onclick=()=>toggleGenre(g);
    bar.appendChild(chip);
  });
}

  if(genreInc.size>0) list=list.filter(m=>[...genreInc].every(g=>(m.tags||[]).includes(g)));

    const typeIcon=isCol?'🎭':isSaga?'⚡':m.media_type==='tv'?'📺':'';

async function searchFilmo(){
  const q=document.getElementById('filmo-search').value.trim(); if(!q) return;
  const st=document.getElementById('filmo-status');
  st.textContent='Recherche...';
  document.getElementById('filmo-grid').innerHTML='';
  document.getElementById('filmo-bar').style.display='none';
  document.getElementById('filmo-quality-field').style.display='none';
  document.getElementById('filmo-import-btn').style.display='none';
  filmoSel.clear();
  try{
    const res=await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TK}&query=${encodeURIComponent(q)}&language=fr-FR`);
    const data=await res.json();
    const people=(data.results||[]).filter(p=>p.known_for_department);
    if(!people.length){st.textContent='Aucune personne trouvée.';return;}
    if(people.length>1){
      st.innerHTML='Plusieurs résultats : '+people.slice(0,4).map((p,i)=>
        `<button onclick="loadFilmo(${p.id},'${p.name.replace(/'/g,"\\'")}','${p.known_for_department}')" style="margin:3px;padding:4px 10px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:Inter,sans-serif;font-size:11px;cursor:pointer;">${p.name} <span style="color:var(--muted2)">(${p.known_for_department})</span></button>`
      ).join('');
    } else {
      loadFilmo(people[0].id, people[0].name, people[0].known_for_department);
    }
  }catch(e){st.textContent='Erreur réseau.';}
}

async function loadFilmo(personId, name, dept){
  const st=document.getElementById('filmo-status');
  st.textContent=`Chargement de la filmographie de ${name}...`;
  try{
    const isDir=dept==='Directing';
    const url=isDir
      ?`https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${TK}&language=fr-FR`
      :`https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${TK}&language=fr-FR`;
    const res=await fetch(url);
    const data=await res.json();
    const cast=(data.cast||[]);
    const crew=(data.crew||[]).filter(c=>c.job==='Director');
    let all=[...cast,...crew];
    // Dédupe par id
    const seen=new Set(); all=all.filter(m=>{if(seen.has(m.id))return false;seen.add(m.id);return true;});
    // Trier par popularité
    all=all.filter(m=>m.poster_path).sort((a,b)=>(b.popularity||0)-(a.popularity||0));
    if(!all.length){st.textContent='Aucun film trouvé.';return;}
    filmoResults=all;
    // Pré-sélectionner ceux pas encore dans la biblio
    filmoSel=new Set(all.map((_,i)=>i).filter(i=>!movies.some(m=>m.tmdb_id===all[i].id)));
    st.textContent=`${all.length} films trouvés pour ${name}`;
    document.getElementById('filmo-bar').style.display='flex';
    document.getElementById('filmo-quality-field').style.display='block';
    document.getElementById('filmo-import-btn').style.display='block';
    renderFilmoGrid();
  }catch(e){st.textContent='Erreur réseau.';}
}

function renderFilmoGrid(){
  const grid=document.getElementById('filmo-grid');
  grid.innerHTML='';
  filmoResults.forEach((m,i)=>{
    const already=movies.some(ex=>ex.tmdb_id===m.id);
    const card=document.createElement('div');
    card.className='fcard'+(filmoSel.has(i)?' sel':'');
    card.innerHTML=`<div class="fcheck">✓</div>`
      +(m.poster_path?`<img src="https://image.tmdb.org/t/p/w185${m.poster_path}" loading="lazy" alt="${m.title}">`:`<div class="fcard-no-poster">🎬</div>`)
      +`<div class="fcard-title">${m.title}</div>`
      +`<div class="fcard-year">${m.release_date?m.release_date.slice(0,4):'?'}${already?' ✓':''}</div>`;
    card.onclick=()=>{
      if(filmoSel.has(i))filmoSel.delete(i); else filmoSel.add(i);
      card.classList.toggle('sel',filmoSel.has(i));
      document.getElementById('filmo-count').innerHTML=`<strong>${filmoSel.size}</strong> sélectionnés`;
    };
    grid.appendChild(card);
  });
  document.getElementById('filmo-count').innerHTML=`<strong>${filmoSel.size}</strong> sélectionnés`;
}

function filmoToggleAll(){
  if(filmoSel.size===filmoResults.length){
    filmoSel.clear();
  } else {
    filmoResults.forEach((_,i)=>filmoSel.add(i));
  }
  renderFilmoGrid();
}

function filmoDeselectExisting(){
  filmoResults.forEach((m,i)=>{
    if(movies.some(ex=>ex.tmdb_id===m.id)) filmoSel.delete(i);
  });
  renderFilmoGrid();
}

async function importFilmo(){
  const qual=document.getElementById('filmo-qual').value;
  const sel=[...filmoSel].map(i=>filmoResults[i]);
  if(!sel.length){alert('Aucun film sélectionné.');return;}
  closeFilmo();
  const btn=document.getElementById('filmo-import-btn');
  let done=0;
  for(const m of sel){
    const poster=m.poster_path?`https://image.tmdb.org/t/p/w342${m.poster_path}`:'';
    // Fetch runtime
    let runtime=0;
    try{const d=await(await fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${TK}`)).json();runtime=d.runtime||0;}catch(e){}
    const obj={
      title:m.title,link:'',links:[],quality:qual,poster,
      release_date:m.release_date||'',popularity:m.popularity||0,
      vote_average:m.vote_average||0,tags:[],runtime,
      tmdb_id:m.id,media_type:'movie',person_role:''
    };
    await addM(obj);
    done++;
    ss('loading',`Import ${done}/${sel.length}...`);
  }
  ss('ok',`${done} films importés !`);
}

function showGP(tags){
  const el=document.getElementById('gprev');
  if(!el) return;
  if(!tags||!tags.length){el.innerHTML='';return;}
  el.innerHTML=tags.map(t=>`<span class="gpill">${t}</span>`).join('');
}

function openEdit(e,idx){
  if(e){e.preventDefault();e.stopPropagation();}
  editIdx=idx; const m=movies[idx];
  mediaType=m.media_type||'movie';
  document.getElementById('mtitle').textContent='Edit';
  document.getElementById('ititle').value=m.title;
  document.getElementById('iqual').value=m.quality;
  document.getElementById('posters').innerHTML='';
  document.getElementById('status').textContent='';
  selPoster=m.poster||'';
  meta={release_date:m.release_date||'',popularity:m.popularity||0,vote_average:m.vote_average||0,tags:m.tags||[],runtime:m.runtime||0,tmdb_id:m.tmdb_id||null,media_type:mediaType,person_role:m.person_role||''};
  // Restore search label
  const labels={movie:'Titre du film',tv:'Titre de la série',collection:'Nom acteur / réalisateur',saga:'Nom de la saga / franchise'};
  document.getElementById('search-label').textContent=labels[mediaType]||'Titre';
  showCurrentPoster(m.poster||'');
  document.getElementById('iposterurl').value='';
  showGP(m.tags||[]);
  // Restore type buttons
  ['movie','tv','collection','saga'].forEach(x=>{
    const el=document.getElementById('type-'+x);
    if(el) el.classList.toggle('active',x===mediaType);
  });
  // Restore links
  setLinks(m.links&&m.links.length?m.links:(m.link?[{name:'',url:m.link}]:[]));
  document.getElementById('mact').innerHTML=`
    <button class="btnd" onclick="delFromModal()">🗑 Delete</button>
    <div class="mright"><button class="btnc" onclick="closeModal()">Cancel</button><button class="btns" onclick="saveMovie()">Save</button></div>`;
  document.getElementById('modal').classList.add('open');
}
function openModal(){
  editIdx=-1; mediaType='movie';
  document.getElementById('mtitle').textContent='Add';
  ['movie','tv','collection','saga'].forEach(x=>{
    const el=document.getElementById('type-'+x);
    if(el) el.classList.toggle('active',x==='movie');
  });
  document.getElementById('search-label').textContent='Titre du film';
  document.getElementById('ititle').placeholder='ex: Dune, Oppenheimer...';
  document.getElementById('ititle').value='';
  setLinks([]);
  document.getElementById('posters').innerHTML='';
  document.getElementById('status').textContent='';
  document.getElementById('gprev').innerHTML='';
  selPoster=''; meta={};
  showCurrentPoster('');
  document.getElementById('iposterurl').value='';
  document.getElementById('mact').innerHTML=`
    <div class="mright" style="margin-left:auto"><button class="btnc" onclick="closeModal()">Cancel</button><button class="btns" onclick="saveMovie()">Add</button></div>`;
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('ititle').focus(),100);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});
document.getElementById('ititle').addEventListener('keydown',e=>{if(e.key==='Enter')searchPosters();});

function setMediaFilter(t){
  if(mediaFilt===t){
    mediaFilt='';
    ['movie','tv','col','saga'].forEach(x=>{
      const el=document.getElementById('filter-'+x);
      if(el) el.classList.remove('active');
    });
  } else {
    mediaFilt=t;
    ['movie','tv','col','saga'].forEach(x=>{
      const map={movie:'movie',tv:'tv',collection:'col',saga:'saga'};
      const el=document.getElementById('filter-'+x);
      if(el) el.classList.toggle('active',map[t]===x);
    });
  }
  render();
}

function setType(t){
  mediaType=t;
  ['movie','tv','collection','saga'].forEach(x=>{
    const el=document.getElementById('type-'+x);
    if(el) el.classList.toggle('active',x===t);
  });
  const labels={movie:'Titre du film',tv:'Titre de la série',collection:'Nom acteur / réalisateur',saga:'Nom de la saga / franchise'};
  const placeholders={movie:'ex: Dune, Oppenheimer...',tv:'ex: Breaking Bad, Severance...',collection:'ex: Christopher Nolan, Tom Hanks...',saga:'ex: Godzilla, Evangelion, Marvel...'};
  document.getElementById('search-label').textContent=labels[t]||'Titre';
  document.getElementById('ititle').placeholder=placeholders[t]||'';
  document.getElementById('posters').innerHTML='';
  document.getElementById('status').textContent='';
  document.getElementById('gprev').innerHTML='';
  if(editIdx<0) selPoster='';
}

function addLinkRow(name='',url=''){
  const row=document.createElement('div');
  row.className='link-row';
  row.style.cssText='display:flex;gap:6px;margin-bottom:6px;';
  row.innerHTML=`<input type="text" class="link-input" placeholder="Titre du film / Nom..." style="flex:1.2;padding:10px 13px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:Inter,sans-serif;font-size:13px;outline:none;" value="${name}"/>
    <input type="text" class="link-url" placeholder="https://..." style="flex:2;padding:10px 13px;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:Inter,sans-serif;font-size:13px;outline:none;" value="${url}"/>
    <button onclick="removeLinkRow(this)" style="padding:0 10px;background:transparent;border:1px solid rgba(239,68,68,0.25);border-radius:8px;color:#f87171;cursor:pointer;font-size:14px;flex-shrink:0;">✕</button>`;
  document.getElementById('links-container').appendChild(row);
}

function removeLinkRow(btn){
  const rows=document.querySelectorAll('#links-container .link-row');
  if(rows.length>1) btn.closest('.link-row').remove();
}

function getLinks(){
  return [...document.querySelectorAll('#links-container .link-row')].map(row=>({
    name: row.querySelector('.link-input').value.trim(),
    url: row.querySelector('.link-url').value.trim()
  })).filter(l=>l.url);
}

function setLinks(links){
  const container=document.getElementById('links-container');
  container.innerHTML='';
  if(!links||!links.length){
    addLinkRow();
  } else {
    links.forEach(l=>addLinkRow(l.name||'',l.url||''));
  }
}
async function searchPosters(){
  const title=document.getElementById('ititle').value.trim(); if(!title) return;
  const st=document.getElementById('status'),row=document.getElementById('posters');
  st.textContent='Searching...'; row.innerHTML=''; document.getElementById('gprev').innerHTML='';
  if(editIdx<0) selPoster=''; // seulement en mode Add, pas Edit
  try{
    let results=[], gmap={};

    if(mediaType==='collection'){
      const res=await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TK}&query=${encodeURIComponent(title)}&language=fr-FR`);
      const data=await res.json();
      results=(data.results||[]).filter(r=>r.profile_path).slice(0,8);
      if(!results.length){st.textContent='Aucune personne trouvée.';return;}
      st.textContent='Sélectionne une personne :';
      results.forEach(r=>{
        const url=`https://image.tmdb.org/t/p/w342${r.profile_path}`;
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;';
        const img=document.createElement('img');
        img.className='popt'; img.src=url; img.alt=r.name;
        img.title=r.name+(r.known_for_department?' — '+r.known_for_department:'');
        const lbl=document.createElement('div');
        lbl.style.cssText='font-size:9px;color:var(--muted2);font-weight:600;text-align:center;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        lbl.textContent=r.name;
        wrap.appendChild(img); wrap.appendChild(lbl);
        img.onclick=()=>{
          document.querySelectorAll('.popt').forEach(i=>i.classList.remove('sel'));
          img.classList.add('sel'); selPoster=url;
          showCurrentPoster(url);
          meta={release_date:'',popularity:r.popularity||0,vote_average:0,tags:[r.known_for_department||''],runtime:0,tmdb_id:r.id||null,media_type:'collection',person_role:r.known_for_department||''};
          document.getElementById('ititle').value=r.name;
          st.textContent='';
        };
        row.appendChild(wrap);
      });
    } else if(mediaType==='saga'){
      // Search movie collections/franchises on TMDB
      const res=await fetch(`https://api.themoviedb.org/3/search/collection?api_key=${TK}&query=${encodeURIComponent(title)}&language=fr-FR`);
      const data=await res.json();
      // Also search movies to get saga poster if no collection found
      const res2=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TK}&query=${encodeURIComponent(title)}&language=fr-FR`);
      const data2=await res2.json();
      const colResults=(data.results||[]).filter(r=>r.poster_path).slice(0,5);
      const movResults=(data2.results||[]).filter(r=>r.poster_path).slice(0,5);
      const combined=[...colResults,...movResults].slice(0,10);
      if(!combined.length){st.textContent='Aucune saga trouvée.';return;}
      st.textContent='Sélectionne une affiche :';
      combined.forEach(r=>{
        const url=`https://image.tmdb.org/t/p/w342${r.poster_path}`;
        const name=r.name||r.title||'';
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;';
        const img=document.createElement('img');
        img.className='popt'; img.src=url; img.alt=name;
        const lbl=document.createElement('div');
        lbl.style.cssText='font-size:9px;color:var(--muted2);font-weight:600;text-align:center;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        lbl.textContent=name.length>12?name.slice(0,12)+'…':name;
        wrap.appendChild(img); wrap.appendChild(lbl);
        img.onclick=()=>{
          document.querySelectorAll('.popt').forEach(i=>i.classList.remove('sel'));
          img.classList.add('sel'); selPoster=url;
          showCurrentPoster(url);
          meta={release_date:r.release_date||'',popularity:r.popularity||0,vote_average:r.vote_average||0,tags:[],runtime:0,tmdb_id:r.id||null,media_type:'saga'};
          document.getElementById('ititle').value=name;
          st.textContent='';
        };
        row.appendChild(wrap);
      });
    } else {
      const endpoint=mediaType==='tv'
        ?`https://api.themoviedb.org/3/search/tv?api_key=${TK}&query=${encodeURIComponent(title)}&language=fr-FR`
        :`https://api.themoviedb.org/3/search/movie?api_key=${TK}&query=${encodeURIComponent(title)}&language=fr-FR&page=1`;
      const res=await fetch(endpoint);
      const data=await res.json();
      results=(data.results||[]).filter(r=>r.poster_path).slice(0,10);
      if(!results.length){st.textContent='No poster found.';return;}
      try{
        const gEndpoint=mediaType==='tv'
          ?`https://api.themoviedb.org/3/genre/tv/list?api_key=${TK}&language=fr-FR`
          :`https://api.themoviedb.org/3/genre/movie/list?api_key=${TK}&language=fr-FR`;
        (await(await fetch(gEndpoint)).json()).genres.forEach(g=>{gmap[g.id]=g.name;});
      }catch(e){}
      st.textContent='Select a poster:';
      results.forEach(r=>{
        const url=`https://image.tmdb.org/t/p/w342${r.poster_path}`;
        const rawDate=mediaType==='tv'?r.first_air_date:r.release_date;
        const year=rawDate?rawDate.slice(0,4):'';
        const displayTitle=mediaType==='tv'?r.name:r.title;
        const wrap=document.createElement('div');
        wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;';
        const img=document.createElement('img');
        img.className='popt'; img.src=url; img.alt=displayTitle;
        img.title=`${displayTitle}${year?' ('+year+')':''}`;
        const lbl=document.createElement('div');
        lbl.style.cssText='font-size:9px;color:var(--muted2);font-weight:600;text-align:center;max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
        lbl.textContent=year||'?';
        wrap.appendChild(img); wrap.appendChild(lbl);
        img.onclick=async()=>{
          document.querySelectorAll('.popt').forEach(i=>i.classList.remove('sel'));
          img.classList.add('sel'); selPoster=url;
          showCurrentPoster(url);
          const tags=(r.genre_ids||[]).map(id=>gmap[id]).filter(Boolean);
          const releaseDate=mediaType==='tv'?r.first_air_date||'':r.release_date||'';
          meta={release_date:releaseDate,popularity:r.popularity||0,vote_average:r.vote_average||0,tags,runtime:0,tmdb_id:r.id||null,media_type:mediaType};
          showGP(tags);
          document.getElementById('ititle').value=displayTitle;
          if(mediaType==='movie'){
            try{
              st.textContent='Getting duration...';
              const dd=await(await fetch(`https://api.themoviedb.org/3/movie/${r.id}?api_key=${TK}`)).json();
              meta.runtime=dd.runtime||0;
              st.textContent=dd.runtime?`⏱ ${fmt(dd.runtime)}`:'';
            }catch(e){st.textContent='';}
          } else { st.textContent=''; }
        };
        row.appendChild(wrap);
      });
    }
  }catch(e){st.textContent='Network error.';}
}

async function saveMovie(){
  const title=document.getElementById('ititle').value.trim();
  const quality=document.getElementById('iqual').value;
  if(!title){document.getElementById('ititle').focus();return;}
  const links=getLinks();
  const link=links.length>0?links[0].url:'';
  // En mode edit, si meta est vide (pas de nouvelle recherche), garder les données originales
  const orig=editIdx>=0?movies[editIdx]:{};
  const m={
    title,link,links,quality,
    poster:selPoster,
    release_date:meta.release_date||orig.release_date||'',
    popularity:meta.popularity||orig.popularity||0,
    vote_average:meta.vote_average||orig.vote_average||0,
    tags:meta.tags&&meta.tags.length?meta.tags:(orig.tags||[]),
    runtime:meta.runtime||orig.runtime||0,
    tmdb_id:meta.tmdb_id||orig.tmdb_id||null,
    media_type:meta.media_type||orig.media_type||mediaType||'movie',
    person_role:meta.person_role||orig.person_role||''
  };
  closeModal();
  if(editIdx>=0) await updM(editIdx,m); else await addM(m);
  meta={};
}

function exportLetterboxd(){
  const rows=['Title,Year,tmdbID,WatchedDate,Rating10,Rewatch,Tags,Notes'];
  movies.forEach(m=>{
    const year=m.release_date?m.release_date.slice(0,4):'';
    const tmdbId=m.tmdb_id||'';
    const title=m.title.replace(/"/g,'""');
    const tags=(m.tags||[]).join('|');
    rows.push(`"${title}",${year},${tmdbId},,,,,"${tags}"`);
  });
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='letterboxd-import.csv'; a.click();
}
function exportData(){
  const blob=new Blob([JSON.stringify(movies,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='movie-library.json'; a.click();
}
async function importData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)){alert('Invalid file.');return;}
      const dupes=data.filter(m=>movies.some(ex=>(m.tmdb_id&&ex.tmdb_id&&m.tmdb_id===ex.tmdb_id)||(m.title&&ex.title&&m.title.toLowerCase()===ex.title.toLowerCase())));
      const newItems=data.filter(m=>!dupes.includes(m));
      let msg=`Import ${newItems.length} new movie(s)?`;
      if(dupes.length) msg+=`\n(${dupes.length} duplicate(s) skipped: ${dupes.slice(0,3).map(m=>m.title).join(', ')}${dupes.length>3?'...':''})`;
      if(!newItems.length){alert('No new movies to import — all are duplicates.');event.target.value='';return;}
      if(confirm(msg)){for(const m of newItems) await addM(m);}
      event.target.value='';
    }catch(err){alert('Read error.');}
  };
  reader.readAsText(file);
}
